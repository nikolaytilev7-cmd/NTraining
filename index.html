   of the session itself: the modules this day carries, in order. */
function previewWorkout(progId, week, idx){ navigate('workout_preview', {progId, week, idx}); }
function renderWorkoutPreview(pr){
  const prog = PROG_BY_ID[pr.progId];
  if(!prog) return '<p>Program not found.</p>';
  const w = buildWorkoutInstance(prog, +pr.week, +pr.idx);
  const mods = workoutModules(w);
  const alreadyDone = isWorkoutDone(prog, +pr.week, +pr.idx);

  const exRow = (id, meta)=>{
    const ex = EX_BY_ID[id]; if(!ex) return '';
    return '<div class="ex-row" style="cursor:pointer;" onclick="peekExercise(\''+id+'\')">'
      +'<div class="ex-icon">'+poseIcon(ex.cat)+'</div>'
      +'<div class="ex-row-body"><div class="ex-row-title">'+esc(ex.name)+'</div>'
      +'<div class="ex-row-meta">'+esc(meta)+'</div></div>'
      +'<span class="row-chev">'+ICON.chevron+'</span></div>';
  };
  let mainList='';
  if(w.format==='traditional') mainList = w.blocks.map(b=>{
      const ex=EX_BY_ID[b.ex];
      const rng = plannedReps(ex, w, b);
      return exRow(b.ex, b.sets+' sets \u00b7 '+rng[0]+'\u2013'+rng[1]+(ex.timeBased?' sec':' reps')
        +(isPerSide(ex)?' per side':'')
        +' \u00b7 rest '+restSecondsFor(ex,'between_sets',w,b)+'s');
    }).join('');
  else if(w.format==='superset') mainList = w.pairs.map((pair,i)=>
      '<div class="eyebrow" style="margin:12px 0 4px;">Pair '+(i+1)+' \u00b7 '+w.rounds+' rounds</div>'
      + pair.map(id=>exRow(id,'back to back')).join('')).join('');
  else if(w.format==='emom') mainList = (w.pattern||[]).map((id,i)=> id==='rest'
      ? '<div class="ex-row"><div class="ex-row-body"><div class="ex-row-title" style="color:var(--text-3);">Rest minute</div></div></div>'
      : exRow(id,'minute '+(i+1)+(isPerSide(EX_BY_ID[id])?' \u00b7 alternates sides':'')+', then repeats')).join('');
  else if(w.format==='amrap') mainList = (w.round||[]).map(r=>exRow(r.ex, roundTarget(r.ex, r.target))).join('');
  else if(w.format==='for_time') mainList = '<div class="eyebrow" style="margin:12px 0 4px;">'
      + (w.ladder||[]).join(' \u2013 ') + ' \u00b7 ' + (w.capMin||w.mainMin) + ' min cap</div>'
      + (w.chain||[]).map(c=>exRow(c.ex, 'every round'+(c.mult&&c.mult!==1?' \u00d7'+c.mult+' reps':'')
          +(isPerSide(EX_BY_ID[c.ex])?' \u00b7 per side':''))).join('');
  else if(w.format==='complex') mainList = '<div class="eyebrow" style="margin:12px 0 4px;">One chain \u00b7 '+w.rounds+' rounds \u00b7 the bell stays in the hand</div>'
      + (w.chain||[]).map(c=>exRow(c.ex, c.reps+' reps'+(isPerSide(EX_BY_ID[c.ex])?' per side':''))).join('');

  /* The warm-up reads as the four phases a coach writes, each with its dose and
     its time — so the declared minutes are visibly where they go. */
  let _wPhase = null;
  const warmList = (w.warmup||[]).map(x=>{
    const it = parseWarmItem(x);
    let head = '';
    if(it.phase && it.phase !== _wPhase){
      _wPhase = it.phase;
      head = '<div class="eyebrow" style="margin:14px 0 4px;">'+esc(it.phase)+'</div>';
    }
    return head + '<div class="ex-row"><div class="ex-row-body">'
      + '<div class="ex-row-title" style="font-size:14px;font-weight:600;">'+esc(it.label)+'</div>'
      + (it.note ? '<div class="ex-row-meta">'+esc(it.note)+'</div>' : '')
      + '</div>'
      + (it.sec ? '<div class="ex-row-meta" style="white-space:nowrap;margin-left:10px;">'
                  + Math.round(it.sec/5)*5 + ' sec</div>' : '')
      + '</div>';
  }).join('');

  const finList = w.finisher ? (w.finisher.format==='emom'
      ? (w.finisher.pattern||[]).map((id,i)=> id==='rest'
          ? '<div class="ex-row"><div class="ex-row-body"><div class="ex-row-title" style="color:var(--text-3);">Rest minute</div></div></div>'
          : exRow(id,'minute '+(i+1))).join('')
      : (w.finisher.round||[]).map(r=>exRow(r.ex, roundTarget(r.ex, r.target))).join('')) : '';

  return '<div class="top-row"><div class="back-btn" onclick="navigate(\'program_detail\',{id:\''+pr.progId+'\'})">'+ICON.back+'</div>'
    +'<h2 style="font-size:20px;">'+esc(w.name)+'</h2></div>'
  +'<div class="chip-row" style="margin-bottom:14px;">'
    +'<span class="badge badge-blue">'+fmtLabel(w.format)+'</span>'
    +'<span class="badge badge-neutral">Week '+pr.week+'</span>'
    +'<span class="badge badge-neutral">'+esc(w.phaseName)+'</span>'
    +(alreadyDone?'<span class="badge badge-beginner">Completed</span>':'')
  +'</div>'
  +'<div class="stat-grid cols-3" style="margin-bottom:8px;">'
    +'<div class="stat-tile"><div class="num">'+w.totalMin+'</div><div class="lbl">Minutes</div></div>'
    +'<div class="stat-tile"><div class="num">'+mods.length+'</div><div class="lbl">Modules</div></div>'
    +'<div class="stat-tile"><div class="num">'+(w.blocks?w.blocks.length:(w.pattern?w.pattern.filter(x=>x!=='rest').length:(w.round?w.round.length:(w.pairs?w.pairs.length*2:0))))+'</div><div class="lbl">Movements</div></div>'
  +'</div>'
  +'<p style="color:var(--text-3);font-size:13px;margin:10px 0 18px;">'+esc(w.phaseNote||'')+'</p>'
  +(warmList?'<div class="section"><div class="section-head"><div class="section-title">Warm-up \u00b7 '+w.warmupMin+' min</div></div><div class="card">'+warmList+'</div></div>':'')
  +'<div class="section"><div class="section-head"><div class="section-title">Main \u00b7 '+w.mainMin+' min</div></div><div class="card">'+mainList+'</div></div>'
  +(finList?'<div class="section"><div class="section-head"><div class="section-title" style="color:var(--amber);">Finisher \u00b7 '+w.finisher.totalMinutes+' min</div></div><div class="card">'
      +(w.finisher.note?'<p style="color:var(--text-2);font-size:13.5px;margin-bottom:10px;line-height:1.55;">'+esc(w.finisher.note)+'</p>':'')
      +finList+'</div></div>':'')
  +'<button class="btn btn-primary btn-block" style="margin-bottom:30px;" onclick="startWorkout(\''+pr.progId+'\','+pr.week+','+pr.idx+')">'+ICON.play+(alreadyDone?' Run It Again':' Start Workout')+'</button>'
  + renderPeekOverlay();
}

function startWorkout(progId, week, idx){
  const prog = PROG_BY_ID[progId];
  const w = buildWorkoutInstance(prog, week, idx);
  initSession(w);
  navigate('active_workout');
}
function startCustomWorkout(w){ initSession(w); navigate('active_workout'); }

function initSession(w){
  SESSION = { workout:w, phase:(w.warmup&&w.warmup.length)?'warmup':'main', blockIndex:0, setIndex:0, round:0, minute:0, timeLeft:0, timerRunning:false,
    log:[], emomLog:[], pendingFeedback:null, restSecondsLeft:0, amrapRounds:0, amrapDone:false, amrapResults:{},
    finished:false, paused:false, endedEarly:false, startedAt:Date.now() };
  if(w.format==='emom'){ SESSION.minute=0; SESSION.timeLeft=60; }
  if(w.format==='amrap'){ SESSION.timeLeft = w.totalMinutes*60; }
  if(w.format==='complex'){ SESSION.round=0; SESSION.blockIndex=0; resetSide(); }
  if(w.format==='for_time'){ SESSION.rung=0; SESSION.timeElapsed=0; SESSION.ftDone=false; SESSION.ftCapped=false; }
}
function totalSegments(){
  const w = SESSION.workout;
  if(w.format==='traditional') return w.blocks.reduce((s,b)=>s+b.sets*sidesFor(EX_BY_ID[b.ex]),0);
  if(w.format==='superset') return w.pairs.length*w.rounds*2;
  if(w.format==='emom') return w.totalMinutes;
  if(w.format==='amrap') return 1;
  if(w.format==='complex') return w.rounds*(w.chain||[]).length*complexSides(w);
  if(w.format==='for_time') return Math.max(1,(w.ladder||[]).length);
  return 1;
}
function doneSegments(){
  const w = SESSION.workout;
  if(w.format==='traditional'){
    let d=0;
    for(let i=0;i<SESSION.blockIndex;i++) d+=w.blocks[i].sets*sidesFor(EX_BY_ID[w.blocks[i].ex]);
    const cur = w.blocks[SESSION.blockIndex];
    if(cur){ const sv=sidesFor(EX_BY_ID[cur.ex]);
      d += SESSION.setIndex*sv + (sv===2 && currentSide()==='L' ? 1 : 0); }
    return d;
  }
  if(w.format==='superset'){
    return SESSION.round*w.pairs.length*2 + SESSION.blockIndex*2 + SESSION.setIndex;
  }
  if(w.format==='emom') return SESSION.minute;
  if(w.format==='complex'){ const n=(w.chain||[]).length, sd=complexSides(w);
    return SESSION.round*n*sd + (sd===2 && currentSide()==='L' ? n : 0) + SESSION.blockIndex; }
  if(w.format==='amrap') return SESSION.amrapDone?1:0;
  if(w.format==='for_time') return SESSION.ftDone ? (w.ladder||[]).length : SESSION.rung;
  return 0;
}
function overallPct(){ return Math.min(100, Math.round(doneSegments()/totalSegments()*100)); }

function renderActiveWorkout(){
  if(!SESSION) return shell('<p>No active session.</p>','home');
  const w = SESSION.workout;
  let inner = '<div class="top-row"><div class="back-btn" onclick="exitWorkout()">'+ICON.x+'</div>'
    + '<h2 style="font-size:19px;flex:1;">'+esc(w.name)+'</h2>'
    + (SESSION.finished ? '<span class="badge badge-blue">'+fmtLabel(w.format)+'</span>'
       : voiceButton()+'<div class="back-btn" title="Pause" onclick="togglePause()" style="margin-left:7px;">'+(SESSION.paused?ICON.play:ICON.pause)+'</div>')
    + '</div>';
  if(SESSION.paused && !SESSION.finished){
    inner += '<div class="card card-tight" style="margin-bottom:14px;text-align:center;">'
      + '<div class="eyebrow">Paused</div>'
      + '<p style="color:var(--text-2);font-size:14px;margin:8px 0 14px;">Timers are held. Pick up whenever you\u2019re ready.</p>'
      + '<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;">'
      + '<button class="btn btn-primary btn-sm" onclick="togglePause()">Resume</button>'
      + '<button class="btn btn-danger btn-sm" onclick="endWorkoutEarly()">End workout here</button>'
      + '</div></div>';
  }
  inner += '<div class="progress-track" style="margin-bottom:6px;"><div class="progress-fill" style="width:'+overallPct()+'%;"></div></div>';
  inner += '<div style="text-align:right;font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:18px;">'+overallPct()+'% complete</div>';
  // the phase can change while the body is being built (the main part running
  // out of work hands over to the finisher), so build the body FIRST and only
  // then draw the strip, or it would highlight the module we just left
  let body;
  if(SESSION.phase==='warmup') body = renderWarmupPhase();
  else if(SESSION.finished) body = renderWorkoutSummary();
  else if(SESSION.phase==='finisher_intro') body = renderFinisherIntro();
  else if(w.format==='traditional') body = renderTraditionalPhase();
  else if(w.format==='superset') body = renderSupersetPhase();
  else if(w.format==='emom') body = renderEmomPhase();
  else if(w.format==='amrap') body = renderAmrapPhase();
  else if(w.format==='complex') body = renderComplexPhase();
  else if(w.format==='for_time') body = renderForTimePhase();
  else body = '';
  if(!SESSION.finished) inner += renderModuleStrip(SESSION.workout);
  inner += body;
  let overlay = '';
  if(currentPeek()) overlay = renderPeekOverlay();
  else if(SESSION._feedbackShow) overlay = renderFeedbackOverlay();
  else if(SESSION.restSecondsLeft>0) overlay = renderRestOverlay();
  return '<div class="main-col"><div class="main-inner" style="padding-top:22px;max-width:520px;">'+inner+'</div></div>'+overlay;
}
/* ============================= VOICE COACH =============================
   Uses the browser's own speech synthesis, so it needs no network and no
   audio files. It is off until you turn it on, and the switch is always in
   reach in the workout header. */
const VOICE = { on:false, last:'' };
function voiceSupported(){ return typeof window!=='undefined' && 'speechSynthesis' in window; }
function loadVoicePref(){ VOICE.on = !!(STATE.profile && STATE.profile.voice); }
function toggleVoice(){
  VOICE.on = !VOICE.on;
  STATE.profile.voice = VOICE.on; saveState();
  if(VOICE.on) say('Voice coach on.', true); else stopVoice();
  render();
}
function stopVoice(){ try{ window.speechSynthesis.cancel(); }catch(e){} }
function say(text, force){
  if(!VOICE.on || !voiceSupported() || !text) return;
  if(!force && text===VOICE.last) return;          // never repeat the same line twice
  VOICE.last = text;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02; u.pitch = 1.0; u.volume = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){ /* a browser that refuses to speak should never break the workout */ }
}
/* Spoken lines are built from the same data the screen shows. */
function sayExercise(ex, rec, prefix){
  if(!ex) return;
  let line = (prefix?prefix+'. ':'') + ex.name;
  if(rec){
    line += ex.timeBased ? ', '+rec.low+' to '+rec.high+' seconds'
                         : ', '+rec.low+' to '+rec.high+' reps';
    if(rec.weight) line += ', '+rec.weight+' '+(STATE.profile.units||'kg');
  }
  say(line);
}
function voiceButton(){
  if(!voiceSupported()) return '';
  return '<div class="back-btn" title="Voice coach" onclick="toggleVoice()" style="'
    + (VOICE.on?'background:var(--blue-glow);border-color:var(--blue);color:var(--blue);':'')
    + '">'+(VOICE.on?ICON.soundOn:ICON.soundOff)+'</div>';
}

function togglePause(){
  if(!SESSION) return;
  SESSION.paused = !SESSION.paused;
  if(SESSION.paused){ stopVoice(); say('Paused.', true); }
  render();
}
/* Leaving early keeps whatever was logged. The sets are already in history, so
   the only thing to decide is whether the program day counts as done — it does
   not, but the attempt is recorded so the week still reflects the work. */
function endWorkoutEarly(){
  if(!SESSION) return;
  SESSION.paused = false;
  SESSION.endedEarly = true;
  SESSION.timerRunning = false;
  clearTimeout(SESSION._emomHandle); clearTimeout(SESSION._amrapHandle); clearTimeout(SESSION._restHandle);
  SESSION.restSecondsLeft = 0;
  finishWorkout({early:true});
  render();
}
function exitWorkout(){
  if(!SESSION) return;
  const logged = countSessionSets();
  if(logged===0){
    SESSION=null;
    navigate(STATE.selectedProgramId?'program_detail':'home', STATE.selectedProgramId?{id:STATE.selectedProgramId}:{});
    return;
  }
  // there is work worth keeping — pause instead of throwing it away
  SESSION.paused = true;
  render();
  toast(logged+' set'+(logged===1?'':'s')+' logged so far — end the workout from here to keep them.');
}
function countSessionSets(){
  if(!SESSION) return 0;
  const w=SESSION.workout;
  const todays = STATE.history.filter(h=>h.date===todayISO() && h.workoutName===w.name);
  return todays.length + (SESSION.emomLog?SESSION.emomLog.filter(e=>!e.skipped).length:0);
}

/* The warm-up is a module you work through, shown the same way as the working
   sets: one movement at a time with the figure, the cue and what it is
   preparing. The items are free text in the program data, so the movement is
   resolved from the text rather than duplicating the list as ids. */
const WARM_MOVE_MAP = [
  [/arm circle|band or arm/i, 'arm_circles'],
  [/shoulder pass/i,          'shoulder_pass'],
  [/cat-?\s?cow/i,            'cat_cow'],
  [/jumping jack/i,           'jumping_jacks'],
  [/jump rope|march/i,        'march'],
  [/bodyweight squat/i,       'bw_squat'],
  [/hip hinge/i,              'bw_hinge'],
  [/halo/i,                   'kb_halo'],
  [/russian swing/i,          'russian_swing'],
  [/swing/i,                  'kb_swing'],
  [/split squat/i,            'split_squat'],
  [/reverse lunge/i,          'reverse_lunge'],
  [/push-?up/i,               'push_up'],
  [/plank/i,                  'plank'],
  [/mountain climber/i,       'mountain_climber'],
  [/glute bridge|bridge/i,    'glute_bridge'],
  [/sit-?up/i,                'kb_sit_up'],
];
function warmMoveFor(text){
  for(let i=0;i<WARM_MOVE_MAP.length;i++){
    const pair = WARM_MOVE_MAP[i];
    if(pair[0].test(text) && MOVES[pair[1]]) return pair[1];
  }
  return null;                                   // e.g. "Stretches in remaining time"
}
function parseWarmItem(item){
  if(item && typeof item === 'object') return item;
  const txt = String(item);
  const parts = txt.split(' — ');
  return { label: parts[0], note: parts.slice(1).join(' — '), move: warmMoveFor(txt) };
}
function warmItems(){ return (SESSION.workout.warmup||[]).map(parseWarmItem); }
function goWarmItem(i){
  const items = warmItems();
  SESSION._warmIdx = Math.max(0, Math.min(items.length-1, i));
  render();
}
function completeWarmItem(){
  if(!SESSION._warmDone) SESSION._warmDone = {};
  const i = SESSION._warmIdx||0;
  SESSION._warmDone[i] = true;
  const items = warmItems();
  const next = items.findIndex((_,j)=> j>i && !SESSION._warmDone[j]);
  if(next >= 0){ SESSION._warmIdx = next; render(); return; }
  const anyLeft = items.findIndex((_,j)=> !SESSION._warmDone[j]);
  if(anyLeft >= 0){ SESSION._warmIdx = anyLeft; render(); return; }
  finishWarmup();                                 // everything ticked
}
function renderWarmupPhase(){
  const w = SESSION.workout;
  const items = warmItems();
  if(!items.length){ return '<div class="card"><p>No warm-up for this day.</p>'
    +'<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="finishWarmup()">Start the main part</button></div>'; }
  if(SESSION._warmIdx==null) SESSION._warmIdx = 0;
  const idx = Math.max(0, Math.min(items.length-1, SESSION._warmIdx));
  const done = SESSION._warmDone||{};
  const nDone = items.filter((_,i)=>done[i]).length;
  const cur = items[idx];

  let html = '<div class="card" style="text-align:center;">'
    + '<div class="eyebrow">' + esc(cur.phase || 'Warm-up') + ' · ' + (idx+1) + ' of ' + items.length + '</div>'
    + '<h2 style="font-size:22px;margin:8px 0 2px;">' + esc(cur.label) + '</h2>'
    + (cur.note ? '<p style="color:var(--text-2);font-weight:700;font-size:14px;margin-bottom:4px;">'+esc(cur.note)+'</p>' : '')
    + '<div class="seg-track" style="margin:12px 0 4px;">'
      + items.map((_,i)=>'<div class="seg '+(done[i]?'done':i===idx?'current':'')+'"></div>').join('')
    + '</div>';

  if(cur.move){
    window._activeFigureExId = cur.move;          // drives the same animation engine
    html += figureMarkup('fig-compact')
          + '<div class="fig-caption" id="animCue"></div>'
          + '<div class="mus-row mus-compact" id="animMuscles"></div>';
  } else {
    window._activeFigureExId = null;
    html += '<p style="color:var(--text-3);font-size:13.5px;margin:18px 0;">Take this one at your own pace.</p>';
  }

  html += '<button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="completeWarmItem()">'
        + (nDone+1 >= items.length ? 'Done — start the main part' : 'Done, next movement') + '</button>';
  if(idx > 0) html += '<button class="btn btn-ghost btn-sm" style="margin-top:9px;" onclick="goWarmItem('+(idx-1)+')">Back</button>';
  html += '</div>';

  // the rest of the list stays visible, so you can see what is coming and jump
  html += '<div class="card" style="margin-top:12px;">'
    + items.map((it,i)=> i===idx ? '' :
        '<div class="workout-row" style="cursor:pointer;" onclick="goWarmItem('+i+')">'
        + '<div class="wr-status '+(done[i]?'done':'')+'">'+(done[i]?ICON.check:ICON.play)+'</div>'
        + '<div class="wr-body"><div class="wr-title" style="font-size:14px;'+(done[i]?'color:var(--text-3);':'')+'">'+esc(it.label)+'</div>'
        + (it.note?'<div class="wr-meta">'+esc(it.note)+'</div>':'') + '</div></div>').join('')
    + '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px;" onclick="finishWarmup()">Skip the rest of the warm-up</button>'
    + '</div>';
  return html;
}
function finishWarmup(){ SESSION.phase='main'; render(); }

/* Unilateral work is the single easiest thing for a training app to get wrong:
   a "set" of one-arm press means a set on EACH arm. Three kinds exist —
     perSide      one full set per side, logged separately
     alternating  both sides inside the same set (gorilla row, mountain climber)
     null         both limbs work together
   Anything perSide doubles the real work, so the set tracker, the progress
   bar and the rest timing all have to know about it. */
function isPerSide(ex){ return !!(ex && ex.unilateral === 'perSide'); }
function sidesFor(ex){ return isPerSide(ex) ? 2 : 1; }
function sideLabel(side){ return side === 'L' ? 'Left' : 'Right'; }
function currentSide(){ return (SESSION && SESSION.side) || 'R'; }
function resetSide(){ if(SESSION) SESSION.side = 'R'; }
function sideBadge(ex){
  if(!isPerSide(ex)) return ex && ex.unilateral==='alternating'
    ? '<span class="badge badge-neutral">Alternating</span>' : '';
  return '<span class="badge badge-blue">'+sideLabel(currentSide())+' side</span>';
}
/* A plain number against a per-side lift understates the work, so say it. */
function roundTarget(exId, target){
  const ex = EX_BY_ID[exId];
  const t = String(target);
  if(!isPerSide(ex)) return t;
  return /side|each/i.test(t) ? t : t+'/side';
}
function targetDisplay(rec, ex){
  const base = ex.timeBased ? rec.low+'\u2013'+rec.high+' sec' : rec.low+'\u2013'+rec.high+' reps';
  return base + (isPerSide(ex) ? ' / side' : '');
}

/* --- Traditional --- */
function renderTraditionalPhase(){
  const w = SESSION.workout; const block = w.blocks[SESSION.blockIndex];
  if(!block){ completeMainPart(); return afterMainMarkup(); }
  const ex = EX_BY_ID[block.ex];
  if(!isPerSide(ex)) resetSide();
  window._activeFigureExId = ex.id;
  window._figureMirror = isPerSide(ex) && currentSide()==='L';
  const rec = getRecommendation(ex, w.programId, w, block);
  const setNum = SESSION.setIndex+1;
  let html = '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="font-size:22px;">'+esc(ex.name)+'</h2><span class="badge badge-neutral">Set '+setNum+'/'+block.sets+'</span></div>'
    + (sideBadge(ex) ? '<div class="chip-row" style="margin:8px 0 2px;">'+sideBadge(ex)+'</div>' : '');
  html += figureMarkup('fig-compact')+'<div class="fig-caption" id="animCue"></div>'
          +'<div class="mus-row mus-compact" id="animMuscles"></div>';
  const sides = sidesFor(ex);
  const segCount = block.sets*sides;
  const segDone = SESSION.setIndex*sides + (sides===2 && currentSide()==='L' ? 1 : 0);

  +'</div>';

  html += feelField();
  sayExercise(ex, rec, 'Set '+(SESSION.setIndex+1));
  html += '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="submitTraditionalSet(\''+block.ex+'\','+rec.low+','+rec.high+','+(rec.weight||0)+')">'+(isPerSide(ex) ? 'Log '+sideLabel(currentSide())+' side' : 'Log Set')+'</button>';
  html += '</div>';
  if(ex.keyPoints) html += '<div class="card card-tight" style="margin-top:12px;"><div class="eyebrow" style="margin-bottom:8px;">Coach Notes</div><div style="font-size:14px;color:var(--text-2);">'+esc(ex.keyPoints[0])+'</div></div>';
  html += '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:12px;" onclick="toggleTechnique()">'
        + (SESSION._techOpen ? 'Hide technique' : 'What this loads \u00b7 technique') + '</button>';

/* The engine already works the target out from your own history — this just
   says so out loud. A number you cannot account for is a number you distrust. */
function whyThisTarget(rec){
  if(!rec) return '';
  const bits = [];
  if(rec.prevText) bits.push('Last time: '+esc(rec.prevText)+'.');
  if(rec.note) bits.push(esc(rec.note)+'.');
  if(!bits.length) return '';
  return '<div class="why-box"><b>Why this target</b>'+bits.join(' ')+'</div>';
}
/* Kettlebells come in fixed sizes, so stepping the weight by 1 is meaningless —
   the stepper walks the bells you actually own. */
function stepWeight(delta){
  const el = document.getElementById('weightInput'); if(!el) return;
  const inv = equipOwned().weights;
  const cur = parseInt(el.textContent,10);
  if(!inv.length){ el.textContent = Math.max(0, cur+delta); return; }
  let i = inv.indexOf(cur);
  if(i < 0) i = inv.reduce((best,w,idx)=> Math.abs(w-cur)<Math.abs(inv[best]-cur)?idx:best, 0);
  else i = Math.max(0, Math.min(inv.length-1, i+delta));
  el.textContent = inv[i];
  const hint = document.getElementById('weightHint');
  if(hint) hint.textContent = (i===0?'lightest bell you own':(i===inv.length-1?'heaviest bell you own':''));
}
function weightField(label, def){
  const inv = equipOwned().weights;
  return '<div class="field"><label>'+esc(label)+'</label>'
    +'<div class="num-stepper"><button onclick="stepWeight(-1)">−</button>'
    +'<div class="val" id="weightInput">'+def+'</div>'
    +'<button onclick="stepWeight(1)">+</button></div>'
    +'<div id="weightHint" style="font-size:11.5px;color:var(--text-3);margin-top:6px;">'
      + (inv.length? 'Steps through your bells: '+inv.join(', ')+' '+STATE.profile.units : '')
    +'</div></div>';
}
/* Swap the movement without losing the set you are on — a sore wrist or a bell
   someone else is using should not end the session. */
function swapCurrentExercise(){
  const w = SESSION.workout;
  if(w.blocks){
    const block = w.blocks[SESSION.blockIndex]; if(!block) return;
    const ex = EX_BY_ID[block.ex];
    if(!ex || !ex.swap) return;
    block.ex = ex.swap;
  } else if(w.pairs){
    const pair = w.pairs[SESSION.blockIndex]; if(!pair) return;
    const cur = pair[SESSION.setIndex];
    const ex = EX_BY_ID[cur];
    if(!ex || !ex.swap) return;
    pair[SESSION.setIndex] = ex.swap;
  } else return;
  SESSION._setFeel = null;
  render();
  toast('Swapped exercise — same movement, different demand');
}
function swapButton(ex){
  if(!ex || !ex.swap || !EX_BY_ID[ex.swap]) return '';
  return '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:9px;" onclick="swapCurrentExercise()">'
    + ICON.swap + ' Swap for ' + esc(EX_BY_ID[ex.swap].name) + '</button>';
}
function numField(id,label,def){
  return '<div class="field"><label>'+esc(label)+'</label><div class="num-stepper"><button onclick="stepNum(\''+id+'\',-1)">\u2212</button><div class="val" id="'+id+'">'+def+'</div><button onclick="stepNum(\''+id+'\',1)">+</button></div></div>';
}
function stepNum(id, delta){ const el=document.getElementById(id); let v=parseInt(el.textContent,10)+delta; if(v<0)v=0; el.textContent=v; }
function submitTraditionalSet(exId, low, high, weight){
  const result = parseInt(document.getElementById('resultInput').textContent,10);
  const weightEl = document.getElementById('weightInput');
  const usedWeight = weightEl? parseInt(weightEl.textContent,10) : null;
  const diff = takeFeel();
  const w = SESSION.workout;
  const ex = EX_BY_ID[exId];
  const side = isPerSide(ex) ? currentSide() : null;
  logSet({exerciseId:exId, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'traditional', weight:usedWeight, result, difficulty:diff, reason:null, targetLow:low, targetHigh:high, side:side});

  const doneBlock = w.blocks[SESSION.blockIndex];
  // the right side is only half the set — go straight to the left before counting it
  if(isPerSide(ex) && currentSide()==='R'){
    SESSION.side='L';
    startRest(Math.round(restSecondsFor(ex,'between_sets',w,doneBlock)*0.45), ()=>render(), 'Switch sides');
    return;
  }
  resetSide();
  const block = doneBlock;
  SESSION.setIndex++;
  if(SESSION.setIndex>=block.sets){ SESSION.setIndex=0; SESSION.blockIndex++; }
  if(SESSION.blockIndex>=w.blocks.length){ completeMainPart(); render(); return; }
  const movedOn = SESSION.setIndex===0;
  startRest(restSecondsFor(ex, movedOn?'between_exercises':'between_sets', w, block),
            ()=>render(), restLabelFor(ex, w, block));
}
function skipTraditionalExercise(){
  const w = SESSION.workout; resetSide(); SESSION.setIndex=0; SESSION.blockIndex++;
  if(SESSION.blockIndex>=w.blocks.length){ completeMainPart(); } render();
}
/* Rest is derived from what the set actually demanded, not one flat number.
   Established ranges (NSCA / ACSM): heavy strength and power sit at the long
   end, hypertrophy work in the middle, endurance work short. Kettlebell loads
   are moderate, so we run at the shorter end of each band. Moving to a
   DIFFERENT exercise needs less rest than repeating the same one, because the
   next pattern usually loads something else. */
function restSecondsFor(ex, kind, w, block){
  if(typeof ex === 'string') ex = null;               // tolerate the old call shape
  let base;
  if(!ex)                        base = 60;
  else if(ex.timeBased)          base = 45;           // carries, planks
  else if(ex.cat === 'power')    base = 75;           // ballistic: short but taxing
  else if(ex.cat === 'skill')    base = 90;           // get-up: quality, not fatigue
  else {
    const top = plannedReps(ex, w, block)[1] || 12;   // today's prescription, not the default
    base = top <= 8 ? 90 : top <= 12 ? 75 : top <= 15 ? 60 : 50;
  }
  if(kind === 'superset_within') return 0;            // straight into the pair
  if(kind === 'superset_round')  return Math.max(45, Math.round(base*0.8));
  if(kind === 'between_exercises') return Math.round(base*0.8);
  return base;
}
function restLabelFor(ex, w, block){
  if(!ex) return 'Rest';
  if(ex.timeBased) return 'Endurance';
  if(ex.cat === 'power') return 'Power';
  if(ex.cat === 'skill') return 'Skill';
  const top = plannedReps(ex, w, block)[1] || 12;
  return top <= 8 ? 'Strength' : top <= 15 ? 'Hypertrophy' : 'Endurance';
}

  + (rec.weight? '<div class="stat-tile"><div class="num" style="font-size:22px;">'+rec.weight+' '+STATE.profile.units+'</div><div class="lbl">Weight</div></div>' : '<div class="stat-tile"><div class="num" style="font-size:16px;">Bodyweight</div><div class="lbl">Equipment</div></div>')
  +'</div>';
  html += ex.timeBased ? numField('resultInput','Seconds completed', rec.low) : numField('resultInput','Reps completed', rec.low);
  if(rec.weight!=null && !ex.timeBased) html += weightField('Weight used ('+STATE.profile.units+')', rec.weight);
  html += feelField();
  sayExercise(ex, rec, 'Set '+(SESSION.setIndex+1));
  html += '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:12px;" onclick="toggleTechnique()">'
        + (SESSION._techOpen ? 'Hide technique' : 'What this loads \u00b7 technique') + '</button>';
  if(SESSION._techOpen) html += '<div class="card-tight" style="background:var(--bg-2);border-radius:var(--radius-s);padding:12px 14px;margin-top:9px;">'+techniqueBlock(ex,false)+'</div>';
  html += '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="submitSupersetSet(\''+exId+'\','+rec.low+','+rec.high+')">'+(isPerSide(ex) ? 'Log '+sideLabel(currentSide())+' side' : 'Log & Continue')+'</button>';
  html += '</div>';

}
function submitSupersetSet(exId, low, high){
  const result = parseInt(document.getElementById('resultInput').textContent,10);
  const weightEl = document.getElementById('weightInput');
  const usedWeight = weightEl? parseInt(weightEl.textContent,10) : null;
  const diff = takeFeel();
  const w = SESSION.workout;
  const exObj = EX_BY_ID[exId];
  const sideS = isPerSide(exObj) ? currentSide() : null;
  logSet({exerciseId:exId, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'superset', weight:usedWeight, result, difficulty:diff, reason:null, targetLow:low, targetHigh:high, side:sideS});
  if(isPerSide(exObj) && currentSide()==='R'){
    SESSION.side='L';
    startRest(Math.round(restSecondsFor(exObj,'between_sets',w)*0.4), ()=>render(), 'Switch sides');
    return;
  }
  resetSide();
  SESSION.setIndex++;
  if(SESSION.setIndex>=2){
    SESSION.setIndex=0;
    // hold on to the pair that just finished — the round rest is sized by it,
    // and the index below is about to move past it
    const donePair = w.pairs[SESSION.blockIndex] || [];
    SESSION.blockIndex++;
    if(SESSION.blockIndex>=w.pairs.length){
      SESSION.blockIndex=0; SESSION.round++;
      if(SESSION.round>=w.rounds){ completeMainPart(); render(); return; }
      const hardest = donePair.map(id=>EX_BY_ID[id])
        .sort((a,b)=>restSecondsFor(b,'superset_round',w)-restSecondsFor(a,'superset_round',w))[0];
      startRest(restSecondsFor(hardest,'superset_round',w), ()=>render(), 'Round complete'); return;
    }
  }
  render();
}


/* --- Complex ---
   A chain of movements done without putting the bell down. It is not a
   superset (you may rest between those) and not a circuit (you may change
   implement): the bell stays in the hand from the first rep to the last, which
   is what makes it its own format rather than a label on an old one. The whole
   chain runs on one side, then the other. */
function complexSides(w){ return (w.chain||[]).some(c=>isPerSide(EX_BY_ID[c.ex])) ? 2 : 1; }
function renderComplexPhase(){
  const w = SESSION.workout, chain = w.chain||[];
  if(SESSION.round >= w.rounds){ completeMainPart(); return afterMainMarkup(); }
  const step = chain[SESSION.blockIndex];
  if(!step){ completeMainPart(); return afterMainMarkup(); }
  const ex = EX_BY_ID[step.ex];
  const perSide = complexSides(w) === 2;
  if(!perSide) resetSide();
  window._activeFigureExId = ex.id;
  window._figureMirror = perSide && currentSide()==='L';

  let html = '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;">'
        + '<h2 style="font-size:22px;">'+esc(ex.name)+'</h2>'
        + '<span class="badge badge-neutral">Round '+(SESSION.round+1)+'/'+w.rounds+'</span></div>'
        + (perSide ? '<div class="chip-row" style="margin:8px 0 2px;">'+sideBadge(ex)+'</div>' : '');
  html += figureMarkup('fig-compact')+'<div class="fig-caption" id="animCue"></div>'
        + '<div class="mus-row mus-compact" id="animMuscles"></div>';
  html += '<div class="seg-track" style="margin:14px 0;">'
        + chain.map((c,i)=>'<div class="seg '+(i<SESSION.blockIndex?'done':i===SESSION.blockIndex?'current':'')+'"></div>').join('')
        + '</div>';
  html += '<div class="eyebrow" style="margin-top:4px;">The chain \u2014 the bell does not touch the floor</div>';
  html += chain.map((c,i)=>{
      const e = EX_BY_ID[c.ex];
      const cur = i===SESSION.blockIndex;
      return '<div class="ex-row" style="'+(cur?'border-color:var(--blue);background:var(--blue-glow);':'opacity:'+(i<SESSION.blockIndex?'0.45':'0.8')+';')+'">'
        + '<div class="ex-icon">'+poseIcon(e.cat)+'</div>'
        + '<div class="ex-row-body"><div class="ex-row-title">'+esc(e.name)+'</div>'
        + '<div class="ex-row-meta">'+c.reps+' reps'+(isPerSide(e)?' this side':'')+'</div></div></div>';
    }).join('');
  if(w.note) html += '<p style="color:var(--text-3);font-size:12.5px;margin-top:10px;">'+esc(w.note)+'</p>';
  const last = SESSION.blockIndex >= chain.length-1;
  const lastOfRound = last && (!perSide || currentSide()==='L');
  html += '<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="advanceComplex()">'
        + (lastOfRound ? 'Round complete' : last ? 'Switch sides' : 'Next movement') + '</button>';
  html += '<button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="skipComplexRound()">Skip this round</button>';
  html += '</div>';
  return html;
}
function advanceComplex(){
  const w = SESSION.workout, chain = w.chain||[];
  const perSide = complexSides(w) === 2;
  if(SESSION.blockIndex < chain.length-1){ SESSION.blockIndex++; render(); return; }
  if(perSide && currentSide()==='R'){
    SESSION.side='L'; SESSION.blockIndex=0;
    startRest(20, ()=>render(), 'Switch sides'); return;
  }
  // a round is logged as one unit of work, at the weight carried through it
  const first = EX_BY_ID[chain[0].ex];
  logSet({exerciseId:first.id, programId:w.programId, programName:w.programName, week:w.week,
          workoutIndex:w.idx, workoutName:w.name, format:'complex',
          weight:pickWeightFor(first,null), result:1, difficulty:null, reason:null,
          targetLow:1, targetHigh:1, side:null});
  resetSide(); SESSION.blockIndex=0; SESSION.round++;
  if(SESSION.round>=w.rounds){ completeMainPart(); render(); return; }
  startRest(w.restSec||75, ()=>render(), 'Between rounds');
}
function skipComplexRound(){
  const w = SESSION.workout;
  resetSide(); SESSION.blockIndex=0; SESSION.round++;
  if(SESSION.round>=w.rounds) completeMainPart();
  render();
}

/* --- EMOM --- */
function renderEmomPhase(){
  const w = SESSION.workout;
  if(SESSION.minute>=w.totalMinutes){ completeMainPart(); return afterMainMarkup(); }
  const exId = w.pattern[SESSION.minute % w.pattern.length];
  const isRest = exId==='rest';
  const ex = isRest?null:EX_BY_ID[exId];
  let emomSide = null;
  if(ex && isPerSide(ex)){
    let seen = 0;
    for(let m=0;m<SESSION.minute;m++) if(w.pattern[m % w.pattern.length]===exId) seen++;
    emomSide = (seen % 2) ? 'L' : 'R';
    SESSION.side = emomSide;
  }
  window._activeFigureExId = isRest ? null : exId;
  window._figureMirror = emomSide === 'L';
  const rec = ex? getRecommendation(ex, w.programId, w) : null;
  let html = '<div class="card" style="text-align:center;">';
  html += '<div class="eyebrow">Minute '+(SESSION.minute+1)+' of '+w.totalMinutes+'</div>';
  html += '<div class="timer-big" id="emomTimer">'+fmtMMSS(SESSION.timeLeft)+'</div>';
  html += '<div class="timer-sub">'+(isRest?'Rest':'Work')+'</div>';
  html += '<div class="divider"></div>';
  if(isRest){
    html += '<h3 style="font-size:20px;">Rest Minute</h3><p style="color:var(--text-3);margin-top:6px;">Recover and get ready for the next round.</p>';
    html += '<button class="btn btn-ghost btn-sm" style="margin-top:14px;" onclick="completeEmomMinute()">Skip this rest</button>';
  } else {
    html += '<h2 style="font-size:24px;">'+esc(ex.name)+(emomSide?' <span class="badge badge-blue" style="vertical-align:middle;">'+sideLabel(emomSide)+'</span>':'')+'</h2>';
    html += figureMarkup('fig-compact')+'<div class="fig-caption" id="animCue"></div>'
          +'<div class="mus-row mus-compact" id="animMuscles"></div>';
    html += '<p style="color:var(--text-2);font-weight:700;margin-top:6px;">Target: '+targetDisplay(rec,ex)+(rec.weight?' @ '+rec.weight+' '+STATE.profile.units:'')+'</p>';
    html += '<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="peekExercise(\''+exId+'\')">How it\u2019s done</button>';
    sayExercise(ex, rec, 'Minute '+(SESSION.minute+1));
  }
  html += '</div>';
  if(!SESSION.timerRunning){
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="startEmomTimer()">'+(SESSION.minute===0?'Start EMOM':'Resume')+'</button>';
  } else if(!isRest){
    html += '<div class="field" style="margin-top:16px;">'+numField('emomResultInput', ex.timeBased?'Seconds so far':'Reps completed so far', 0)+'</div>';
    html += '<button class="btn btn-secondary btn-block" onclick="skipEmomExercise(\''+exId+'\')">Skip This Exercise</button>';
  }
  return html;
}
function startEmomTimer(){
  SESSION.timerRunning = true;
  render();
  runEmomTick();
}
function runEmomTick(){
  if(!SESSION || SESSION.workout.format!=='emom' || !SESSION.timerRunning || SESSION.phase!=='main') return;
  const el = document.getElementById('emomTimer');
  const tick = ()=>{
    if(!SESSION || !SESSION.timerRunning) return;
    if(SESSION.paused){ SESSION._emomHandle = setTimeout(tick,1000); return; }
    SESSION.timeLeft--;
    const timerEl = document.getElementById('emomTimer');
    if(timerEl) timerEl.textContent = fmtMMSS(Math.max(0,SESSION.timeLeft));
    if(SESSION.timeLeft<=0){
      completeEmomMinute();
      return;
    }
    SESSION._emomHandle = setTimeout(tick,1000);
  };
  clearTimeout(SESSION._emomHandle);
  SESSION._emomHandle = setTimeout(tick,1000);
}
function completeEmomMinute(){
  const w = SESSION.workout;
  const exId = w.pattern[SESSION.minute % w.pattern.length];
  if(exId!=='rest'){
    const resultEl = document.getElementById('emomResultInput');
    const result = resultEl? parseInt(resultEl.textContent,10) : 0;
    const ex = EX_BY_ID[exId];
    const rec = getRecommendation(ex, w.programId, w);
    SESSION.emomLog.push({exerciseId:exId, result, minute:SESSION.minute+1, skipped:false});
    logSet({exerciseId:exId, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'emom', weight:rec.weight, result, difficulty: result>=rec.high?'good':(result<rec.low?'hard':'just_right'), reason:null, targetLow:rec.low, targetHigh:rec.high});
  }
  SESSION.minute++;
  if(SESSION.minute>=w.totalMinutes){ SESSION.timerRunning=false; completeMainPart(); render(); return; }
  SESSION.timeLeft=60;
  render();
  runEmomTick();
}
function skipEmomExercise(exId){
  SESSION.emomLog.push({exerciseId:exId, result:0, minute:SESSION.minute+1, skipped:true});
  completeEmomMinute();
}

  }
  return html;
}
/* ---------------------------------- FOR TIME ---------------------------------
   A chipper against a clock that counts UP, with a cap so the session cannot
   run away. The work is a ladder of rungs — 21-15-9, or 1-2-3-4-5 — and each
   rung is that many reps of every movement in the chain. A movement can carry
   a multiplier when its natural dose is higher (twice the mountain climbers
   for every swing). The clock is the score; the reps are what gets logged, so
   volume and history stay comparable with every other format. */
function ftReps(rung, c){ return Math.max(1, Math.round(rung * (c.mult||1))); }
function ftCapSec(w){ return (w.capMin || w.mainMin || 20) * 60; }
function ftTotals(w, rungsDone){
  const out = {};
  (w.chain||[]).forEach(c=> out[c.ex] = 0);
  (w.ladder||[]).slice(0, rungsDone).forEach(r=>
    (w.chain||[]).forEach(c=> out[c.ex] += ftReps(r, c)));
  return out;
}
function renderForTimePhase(){
  const w = SESSION.workout;
  if(SESSION.ftDone){ completeMainPart(); return afterMainMarkup(); }
  const lad = w.ladder||[], cap = ftCapSec(w);
  const idx = Math.min(SESSION.rung, Math.max(0,lad.length-1));
  const reps = lad[idx] || 0;
  const left = Math.max(0, cap - SESSION.timeElapsed);

  let html = '<div class="card" style="text-align:center;">'
    + '<div class="eyebrow">For time · '+Math.round(cap/60)+' min cap</div>'
    + '<div class="timer-big" id="ftTimer">'+fmtMMSS(SESSION.timeElapsed)+'</div>'
    + '<div class="timer-sub">Round <span id="ftRung">'+(SESSION.rung+1)+'</span> of '+lad.length
      + ' · <span id="ftLeft"'+(left<=120?' class="cap-warn"':'')+'>'+fmtMMSS(left)+'</span> to the cap</div>'
    + '</div>';

  html += '<div class="card"><div class="eyebrow" style="margin-bottom:10px;">The ladder</div>'
    + '<div class="rung-row">'+lad.map((r,i)=>'<span class="rung'
        +(i<SESSION.rung?' done':i===SESSION.rung?' now':'')+'">'+r+'</span>').join('')+'</div>'
    + (w.note ? '<div class="wr-meta" style="margin-top:10px;">'+esc(w.note)+'</div>' : '')
    + '</div>';

  html += '<div class="card"><div class="eyebrow" style="margin-bottom:10px;">This round</div>'
    + (w.chain||[]).map(c=>{ const ex=EX_BY_ID[c.ex]; if(!ex) return '';
        return '<div class="tap-row" onclick="peekExercise(\''+c.ex+'\')">'
        + '<div class="ex-icon" style="width:38px;height:38px;">'+poseIcon(ex.cat)+'</div>'
        + '<div style="flex:1;text-align:left;"><div style="font-size:14.5px;font-weight:700;">'+esc(ex.name)+'</div>'
        + '<div class="wr-meta">'+ftReps(reps,c)+' reps'+(isPerSide(ex)?' per side':'')+'</div></div>'
        + '<span class="row-chev">'+ICON.chevron+'</span></div>'; }).join('')
    + '<div style="font-size:11px;color:var(--text-3);margin-top:10px;font-weight:600;text-align:center;">TAP ANY MOVEMENT TO SEE IT</div>'
    + '</div>';

  if(!SESSION.timerRunning){
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="startForTime()">Start the clock</button>';
  } else {
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="completeRung()">'
         + (SESSION.rung+1 >= lad.length ? 'Last round done — stop the clock' : 'Round of '+reps+' done')+'</button>'
         + '<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="finishForTime(true)">Stop here</button>';
  }
  return html;
}
function startForTime(){ SESSION.timerRunning=true; render(); runForTimeTick(); }
function runForTimeTick(){
  if(!SESSION || SESSION.workout.format!=='for_time' || !SESSION.timerRunning) return;
  const cap = ftCapSec(SESSION.workout);
  const tick = ()=>{
    if(!SESSION || !SESSION.timerRunning) return;
    if(SESSION.paused){ SESSION._ftHandle = setTimeout(tick,1000); return; }
    SESSION.timeElapsed++;
    const t = document.getElementById('ftTimer'); if(t) t.textContent = fmtMMSS(SESSION.timeElapsed);
    const l = document.getElementById('ftLeft');
    const left = Math.max(0, cap-SESSION.timeElapsed);
    if(l){ l.textContent = fmtMMSS(left); if(left<=120) l.className='cap-warn'; }
    if(left<=0){ say('Cap. Put the bell down.', true); finishForTime(true); return; }
    SESSION._ftHandle = setTimeout(tick,1000);
  };
  clearTimeout(SESSION._ftHandle);
  SESSION._ftHandle = setTimeout(tick,1000);
}
function completeRung(){
  const w = SESSION.workout, lad = w.ladder||[];
  SESSION.rung++;
  if(SESSION.rung >= lad.length){ finishForTime(false); return; }
  say('Round of '+lad[SESSION.rung]+'.', true);
  render();
}
function finishForTime(capped){
  const w = SESSION.workout;
  SESSION.timerRunning=false; clearTimeout(SESSION._ftHandle);
  SESSION.ftDone=true; SESSION.ftCapped=!!capped;
  const totals = ftTotals(w, SESSION.rung);
  (w.chain||[]).forEach(c=>{
    const ex = EX_BY_ID[c.ex]; if(!ex) return;
    const rec = getRecommendation(ex, w.programId, w);
    logSet({exerciseId:c.ex, programId:w.programId, programName:w.programName, week:w.week,
      workoutIndex:w.idx, workoutName:w.name, format:'for_time', weight:rec.weight,
      result:totals[c.ex]||0, timeSec:SESSION.timeElapsed, capped:!!capped, noPR:true,
      difficulty:'just_right', reason:null,
      targetLow:totals[c.ex]||0, targetHigh:totals[c.ex]||0});
  });
  completeMainPart();
  render();
}

function startAmrapTimer(){ SESSION.timerRunning=true; render(); runAmrapTick(); }
function runAmrapTick(){
  if(!SESSION || SESSION.workout.format!=='amrap' || !SESSION.timerRunning) return;
  const tick=()=>{
    if(!SESSION || !SESSION.timerRunning) return;
    if(SESSION.paused){ SESSION._amrapHandle = setTimeout(tick,1000); return; }
    SESSION.timeLeft--;
    const timerEl = document.getElementById('amrapTimer');
    if(timerEl) timerEl.textContent = fmtMMSS(Math.max(0,SESSION.timeLeft));
    if(SESSION.timeLeft<=0){ finishAmrapEarly(); return; }
    SESSION._amrapHandle = setTimeout(tick,1000);
  };
  clearTimeout(SESSION._amrapHandle);
  SESSION._amrapHandle = setTimeout(tick,1000);
}
function logAmrapRound(){ SESSION.amrapRounds++; const el=document.getElementById('amrapRoundCount'); if(el) el.textContent=SESSION.amrapRounds; }
function finishAmrapEarly(){
  SESSION.timerRunning=false; SESSION.amrapDone=true;
  const w = SESSION.workout;
  w.round.forEach(r=>{
    const ex = EX_BY_ID[r.ex]; const rec = getRecommendation(ex, w.programId, w);
    logSet({exerciseId:r.ex, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'amrap', weight:rec.weight, result:SESSION.amrapRounds, difficulty:'just_right', reason:null, targetLow:SESSION.amrapRounds, targetHigh:SESSION.amrapRounds});
  });
  completeMainPart();
  render();
}

/* --- Rest overlay --- */
function startRest(seconds, onDone, label){
  if(!seconds || seconds<=0){ if(onDone) onDone(); return; }   // e.g. straight into a superset pair
  SESSION.restSecondsLeft = seconds; SESSION.restTotal = seconds;
  SESSION.restLabel = label || 'Rest'; SESSION._restOnDone = onDone;
  say('Rest. '+seconds+' seconds.', true);
  render(); tickRest();
}
function tickRest(){
  if(!SESSION || SESSION.restSecondsLeft<=0) return;
  const el = document.getElementById('restCountdown');
  if(el) el.textContent = fmtMMSS(SESSION.restSecondsLeft);
  SESSION._restHandle = setTimeout(()=>{
    if(!SESSION) return;
    if(SESSION.paused){ tickRest(); return; }                  // a paused workout holds the clock
    SESSION.restSecondsLeft--;
    if(SESSION.restSecondsLeft<=0){ say('Go.', true); const cb=SESSION._restOnDone; SESSION._restOnDone=null; render(); if(cb) cb(); }
    else { if(SESSION.restSecondsLeft===3) say('Three seconds.', true); tickRest(); }
  },1000);
}
function addRestTime(sec){
  if(!SESSION || SESSION.restSecondsLeft<=0) return;
  SESSION.restSecondsLeft = Math.max(5, SESSION.restSecondsLeft + sec);
  const el=document.getElementById('restCountdown'); if(el) el.textContent=fmtMMSS(SESSION.restSecondsLeft);
}
function skipRest(){ clearTimeout(SESSION._restHandle); const cb=SESSION._restOnDone; SESSION.restSecondsLeft=0; SESSION._restOnDone=null; render(); if(cb) cb(); }
function renderRestOverlay(){
  const why = {Strength:'Heavy, low-rep work needs the longest rest.',
               Hypertrophy:'Enough to recover, short enough to keep the stimulus.',
               Power:'Ballistic sets are short but taxing.',
               Skill:'Rest for quality of movement, not fatigue.',
               Endurance:'Short rest is part of the training effect.'}[SESSION.restLabel] || '';
  return '<div class="rest-overlay"><div class="eyebrow">'+esc(SESSION.restLabel||'Rest')+' \u00b7 Rest</div>'
  +'<div class="timer-big" id="restCountdown">'+fmtMMSS(SESSION.restSecondsLeft)+'</div>'
  +'<p style="color:var(--text-3);margin:12px 0 20px;max-width:300px;">'+esc(why)+'</p>'
  +'<div style="display:flex;gap:10px;">'
  +'<button class="btn btn-ghost btn-sm" onclick="addRestTime(-15)">\u221215s</button>'
  +'<button class="btn btn-primary" onclick="skipRest()">I\u2019m Ready</button>'
  +'<button class="btn btn-ghost btn-sm" onclick="addRestTime(15)">+15s</button>'
  +'</div></div>';
}

/* --- Feedback modal (simple inline overlay via confirm-like screen) --- */
/* How the set felt is OPTIONAL and sits with the other inputs. Interrupting
   every single set with a modal made it feel like homework; the adaptive engine
   only needs to hear from you when something was off. */
const FEEL_OPTS = [['easy','Too easy'],['just_right','Just right'],['hard','Hard'],['too_hard','Couldn’t finish']];
function feelField(){

/* What it loads, how to do it, what usually goes wrong — from the exercise's
   own data, trimmed to what is useful mid-set. */
function techniqueBlock(ex, expanded){
  if(!ex) return '';
  const zones = (ex.primary||[]).map(m=>'<span class="zone zone-primary">'+esc(MUSCLE_LABELS[m]||m)+'</span>').join('')
              + (ex.secondary||[]).map(m=>'<span class="zone">'+esc(MUSCLE_LABELS[m]||m)+'</span>').join('');

function toggleTechnique(){

/* A workout is a sequence of MODULES. Not every day carries all of them: a
   template declares only what it needs, and the strip at the top of the screen
   shows what this particular day actually contains. */
function workoutModules(w){
  const mods=[];
  if(w.warmup && w.warmup.length) mods.push({key:'warmup', label:'Warm-up', min:w.warmupMin});
  mods.push({key:'main', label:'Main', min:w.mainMin});
  if(w.finisher || SESSION && SESSION.finisherSpec) mods.push({key:'finisher', label:'Finisher', min:(w.finisher||SESSION.finisherSpec).totalMinutes});
  return mods;
}
function currentModuleKey(){
  if(!SESSION) return 'main';
  if(SESSION.phase==='warmup') return 'warmup';
  if(SESSION.inFinisher || SESSION.phase==='finisher_intro') return 'finisher';
  return 'main';
}
function renderModuleStrip(w){
  const mods=workoutModules(w);
  if(mods.length<2) return '';
  const order={warmup:0,main:1,finisher:2}, cur=currentModuleKey();
  return '<div class="mod-strip">'+mods.map(m=>{
    const st = order[m.key]<order[cur] ? 'done' : (m.key===cur ? 'current' : '');
    return '<div class="mod '+st+'"><b>'+esc(m.label)+'</b><span>'+m.min+' min</span></div>';
  }).join('')+'</div>';
}
/* The main part can be followed by a finisher, so anything that renders
   straight after it must ask which of the two to show. */
function afterMainMarkup(){
  return SESSION.phase==='finisher_intro' ? renderFinisherIntro() : renderWorkoutSummary();
}
/* Called wherever the main part runs out of work. */
function completeMainPart(){
  const w = SESSION.workout;
  if(w.finisher && !SESSION.inFinisher){

    SESSION.phase = 'finisher_intro';

  }

}
function startFinisher(){
  const f = SESSION.finisherSpec, w = SESSION.workout;
  // swap the running workout for the finisher spec, keeping the identity fields
  // (name, programId, week, idx) so logging and progress still line up
  SESSION.workout = Object.assign({}, w, {
    format:f.format, pattern:f.pattern||null, round:f.round||null,
    totalMinutes:f.totalMinutes||null, rounds:f.rounds||null,
    blocks:f.blocks||null, pairs:f.pairs||null, finisher:null});
  SESSION.inFinisher = true; SESSION.phase='main';
  SESSION.blockIndex=0; SESSION.setIndex=0; SESSION.round=0; SESSION.minute=0;

function finishWorkout(opts){
  const w = SESSION.workout;
  const early = !!(opts && opts.early);
  // a day only unlocks the next one when it was actually finished
  if(w.programId && !early){ markWorkoutDone(PROG_BY_ID[w.programId], w.week, w.idx); }
  if(w.programId && early){
    const pp = progKey(w.programId);
    if(!pp.partial) pp.partial = {};
    pp.partial[w.week+'-'+w.idx] = { date: todayISO(), sets: countSessionSets(), pct: overallPct() };

  SESSION.finished = true; SESSION.phase='done'; SESSION.endedEarly = early;
  say(early?'Workout ended.':'Workout complete. Good work.', true);
  saveState();
}

  +'<div class="stat-tile"><div class="num">'+streak+'</div><div class="lbl">Current Streak</div></div>'
  +'</div>'
  +'<div class="section"><div class="section-title">Weekly Volume</div><div class="card">'
  + volumeChart(weeks) +'</div></div>'
  +'<div class="section"><div class="section-title">Personal Records</div><div class="card">'
  +(prList.length? prList.map(([id,pr])=>{ const ex=EX_BY_ID[id]; return '<div class="workout-row"><div class="wr-status done">'+ICON.trophy+'</div><div class="wr-body"><div class="wr-title">'+(ex?esc(ex.name):id)+'</div><div class="wr-meta">'+(pr.heaviestWeight? 'Heaviest: '+pr.heaviestWeight+' '+STATE.profile.units+' x '+pr.repsAtHeaviest : 'Best: '+pr.bestResult)+'</div></div></div>'; }).join('')
    : '<div class="empty-state">Complete a few sets to start setting PRs.</div>')
  +'</div></div>'
  +'<div class="section"><div class="section-title">Workout History</div><div class="card">'
  +(STATE.history.length? groupHistoryByDate().slice(0,10).map(g=>'<div class="workout-row"><div class="wr-status done">'+ICON.check+'</div><div class="wr-body"><div class="wr-title">'+esc(g.workoutName)+'</div><div class="wr-meta">'+g.date+' \u00b7 '+g.count+' sets logged</div></div></div>').join('')
    : '<div class="empty-state">No workouts logged yet.</div>')
  +'</div></div>';
}
/* 3 024 kg does not fit under a 30-pixel bar, so volume gets a compact form.
   The unit is written once, in the caption, not repeated on every label. */
function fmtVol(v){
  if(v >= 10000) return Math.round(v/1000)+'k';
  if(v >= 1000)  return (v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(v));
}
/* One series, so no legend — the section title names it. A number on every bar
   is noise; only the latest week with work in it is labelled, because that is
   the one being read. Empty weeks get a baseline tick, not a stub bar that
   looks like a broken column. */
function volumeChart(weeks){
  const u    = STATE.profile.units || 'kg';
  if(!weeks.length)
    return '<div class="empty-state">Log a few sets and your weekly volume shows up here.</div>';
  const max  = Math.max.apply(null, weeks.map(w=>w.v));
  const done = weeks.filter(w=>w.v>0);
  if(!done.length)
    return '<div class="empty-state">Log a few sets and your weekly volume shows up here.</div>';

  const lastIdx = weeks.reduce((k,w,i)=> w.v>0 ? i : k, -1);
  const cols = weeks.map((w,i)=>{
    const pct   = max>0 ? Math.max(3, w.v/max*74) : 0;   // 74% leaves room for the label
    const label = i===lastIdx ? '<div class="vol-val">'+fmtVol(w.v)+'</div>' : '';
    /* the highlight marks the week the caption is talking about — the latest
       one with work in it. The peak line, not a second colour, carries the max. */
    const bar   = w.v>0
      ? '<div class="vol-bar'+(i===lastIdx?' hi':'')+'" style="height:'+pct.toFixed(1)+'%;"></div>'
      : '<div class="vol-bar zero"></div>';
    return '<div class="vol-col" title="'+esc(w.label)+' · '
      + (w.v>0 ? Math.round(w.v)+' '+u : 'no sets logged')+'">'+label+bar+'</div>';
  }).join('');

  /* the caption has room for the real number; only the bars need the short form */
  const thisWeek = Math.round(weeks[weeks.length-1].v);
  const span = weeks.length>1 ? 'Weeks '+weeks[0].week+'–'+weeks[weeks.length-1].week
                              : 'Week '+weeks[0].week;
  return '<div class="vol-cap"><span class="k">'+span+'</span>'
    + '<span class="v">'+thisWeek.toLocaleString('en-US')+' '+u+' this week</span></div>'
    + '<div class="vol-plot">'
      + '<div class="vol-peak"><b>'+fmtVol(max)+'</b></div>'
      + '<div class="vol-base"></div>'
      + '<div class="vol-cols">'+cols+'</div>'
    + '</div>'
    + '<div class="vol-axis">'+weeks.map((w,i)=>'<span'+(i===weeks.length-1?' class="now"':'')
        +'>'+esc(w.label)+'</span>').join('')+'</div>'
    + (done.length<2 ? '<div class="vol-note">One week in. A second week of logging gives you a trend to read.</div>' : '');
}
/* Week 1 is the week you first logged a set, not an arbitrary slice of the
   calendar. The old version numbered the eight columns 1-8 within a rolling
   window, so a first-ever workout landed under "W8" and the oldest column of
   an empty history was labelled "W1" — the number meant the opposite of what
   it read as. Anchoring to the first log also stops the buckets sliding by a
   day every day, which used to move old sets between columns. */
function weekIndexer(){
  const DAY = 24*3600*1000;
  const logs = STATE.history.filter(h=>h.weight && h.result && h.date);
  if(!logs.length) return null;
  let first = logs[0].date;
  logs.forEach(h=>{ if(h.date < first) first = h.date; });
  const anchor = new Date(first+'T00:00:00').getTime();
  const at = iso => Math.floor((new Date(iso+'T00:00:00').getTime()-anchor)/(7*DAY)) + 1;
  return {logs, at, current: Math.max(1, at(todayISO()))};
}
function last8WeeksVolume(){
  const W = weekIndexer();
  if(!W) return [];
  const from = Math.max(1, W.current-7);
  const buckets = [];
  for(let n=from; n<=W.current; n++){
    let v = 0;
    W.logs.forEach(h=>{ if(W.at(h.date)===n) v += h.weight*h.result; });
    buckets.push({v, week:n, label:'W'+n});
  }
  const max = Math.max.apply(null, buckets.map(b=>b.v).concat([1]));
  return buckets.map(b=>Object.assign({},b,{max}));
}
function groupHistoryByDate(){
  const map = {};
  STATE.history.slice().reverse().forEach(h=>{
    const key = h.date+'|'+h.workoutName;
    if(!map[key]) map[key] = {date:h.date, workoutName:h.workoutName||'Session', count:0};
    map[key].count++;
  });
  return Object.values(map);
}

/* ============================= PROFILE ============================= */
function renderProfile(){
  const p = STATE.profile;
  return '<h1 style="font-size:28px;margin-bottom:18px;">Profile</h1>'
  +'<div class="card">'
  +'<div class="field"><label>Name</label><input type="text" id="profName" value="'+esc(p.name)+'" onchange="updateProfileField(\'name\',this.value)"></div>'
  +profRow('Goal', p.goals.map(goalLabel).join(', ')||'\u2014')
  +profRow('Experience', expLabel(p.experience))
  +profRow('Training Days', p.days+' / week')
  +profRow('Session Duration', bandFor(p.duration||50).label)
  +profRow('Preferred Formats', p.formats.length? p.formats.map(fmtLabel).join(', '):'No preference')
  +profRow('Program', STATE.selectedProgramId? PROG_BY_ID[STATE.selectedProgramId].name : 'None selected')
  +'</div>'
  +'<div class="section"><div class="section-title">Kettlebell Inventory</div><div class="card">'
  +'<div class="chip-row">'+[4,6,8,10,12,16,20,24,28,32].map(w=>'<div class="chip '+(p.inventory.includes(w)?'selected':'')+'" onclick="toggleInventory('+w+')">'+w+' kg</div>').join('')+'</div>'
  +'</div></div>'
  +'<div class="section"><div class="section-title">Units</div><div class="card card-tight"><div class="chip-row">'
  +['kg','lb'].map(u=>'<div class="chip '+(p.units===u?'selected':'')+'" onclick="updateProfileField(\'units\',\''+u+'\')">'+u.toUpperCase()+'</div>').join('')
  +'</div></div></div>'
  +'<div class="section"><div class="section-title">Saved Exercises</div><div class="card">'
  +(STATE.savedExercises.length? STATE.savedExercises.map(id=>{const e=EX_BY_ID[id]; return e?exRowHtml(e):'';}).join('') : '<div class="empty-state">No saved exercises yet.</div>')
  +'</div></div>'
  +'<div class="section"><div class="section-title">Your Data</div>'
  + (SAVE_FAILED ? '<div class="card card-tight save-alert">'+esc(SAVE_FAILED)+'</div>' : '')
  + '<div class="card">'
  + '<p style="margin:0 0 4px;font-size:13.5px;color:var(--text-2);line-height:1.5;">'
    + (STATE.history||[]).length + ' sets logged'
    + (lastSavedAt() ? ' \u00b7 last saved '+esc(lastSavedAt().slice(0,16).replace('T',' ')) : '')
    + '.</p>'
  + '<p style="margin:0 0 14px;font-size:12.5px;color:var(--text-3);line-height:1.5;">'
    + 'All of it lives in this browser only. Safari clears storage for sites it has not seen in a while, '
    + 'so keep a copy somewhere you control.</p>'
  + '<button class="btn btn-primary btn-block" onclick="exportData()">Export backup file</button>'
  + '<button class="btn btn-secondary btn-block" style="margin-top:9px;" onclick="copyBackup()">Copy backup as text</button>'
  + '<button class="btn btn-ghost btn-block" style="margin-top:9px;" onclick="pickBackupFile()">Restore from a backup</button>'
  + '<input type="file" id="restoreFile" accept="application/json,.json" style="display:none;" onchange="onBackupFile(this)">'
  + '<p style="margin:12px 0 0;font-size:12px;color:var(--text-3);line-height:1.5;">'
    + 'Restoring adds anything missing. It never removes a session you already have.</p>'
  + '</div></div>'
  +'<button class="btn btn-danger btn-block" style="margin-top:20px;" onclick="resetAllData()">Reset All Data</button>'
  +'<p style="margin:16px 0 0;text-align:center;font-size:11.5px;color:var(--text-3);'
    +'font-variant-numeric:tabular-nums;">Build '+BUILD
    +(('serviceWorker' in navigator) && navigator.serviceWorker.controller ? ' \u00b7 offline ready' : '')
    +'</p>';
}
function updateProfileField(field,val){ STATE.profile[field]=val; saveState(); if(field==='units') render(); }
function toggleInventory(w){
  const inv = STATE.profile.inventory; const i=inv.indexOf(w);
  if(i>=0) inv.splice(i,1); else { inv.push(w); inv.sort((a,b)=>a-b); }
  saveState(); render();
}
function resetAllData(){
  if(confirm('This will erase your profile, program progress and workout history. Continue?')){
    STATE = defaultState(); ONB_DATA=null; ONB_STEP=0; saveState(); navigate('onboarding');
  }
}

/* ============================= INIT ============================= */
/* The session length a programme advertises is measured, never typed. A
   hand-written range goes stale the moment the programming changes, and a
   programme that promises 45 minutes and delivers 60 has lied to the person
   deciding whether they have time to train today. */
function deriveSessionLengths(){
  PROGRAMS.forEach(p=>{
    let lo=Infinity, hi=0;
    for(let wk=1; wk<=p.weeks; wk++) p.templates.forEach((t,i)=>{
      const w = buildWorkoutInstance(p, wk, i);
      lo = Math.min(lo, w.totalMin); hi = Math.max(hi, w.totalMin);
    });
    if(isFinite(lo)) p.sessionMin = [lo, hi];
  });
}
/* Registered only on a real origin: a file:// page or an in-app preview has no
   service worker, and asking for one there throws. Failure is silent by design
   — the app works perfectly well online without it. */
function registerWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){
      console.warn('Offline support unavailable', e);
    });
  });
}
function boot(){
  registerWorker();
  deriveSessionLengths();
  loadState();
  render();
}
boot();
</script>
