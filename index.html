function startWorkout(progId, week, idx){
  const prog = PROG_BY_ID[progId];
  const w = buildWorkoutInstance(prog, week, idx);
  initSession(w);
  navigate('active_workout');
}
function startCustomWorkout(w){ initSession(w); navigate('active_workout'); }

function initSession(w){
  // the session works on its own copy: a swap or a trimmed set count must
  // never reach back into the program's template
  w = JSON.parse(JSON.stringify(w));
  SESSION = { workout:w, phase:(w.warmup&&w.warmup.length)?'warmup':'main', blockIndex:0, setIndex:0, round:0, minute:0, timeLeft:0, timerRunning:false,
    log:[], emomLog:[], pendingFeedback:null, restSecondsLeft:0, amrapRounds:0, amrapDone:false, amrapResults:{},
    finished:false, paused:false, endedEarly:false, startedAt:Date.now(), origWorkout:w };
  if(w.format==='emom'){ SESSION.minute=0; SESSION.timeLeft=60; }
  if(w.format==='amrap'){ SESSION.timeLeft = w.totalMinutes*60; }
  if(w.format==='complex'){ SESSION.round=0; SESSION.blockIndex=0; resetSide(); }
  if(w.format==='for_time'){ SESSION.rung=0; SESSION.timeElapsed=0; SESSION.ftDone=false; SESSION.ftCapped=false; }
  if(readinessWanted()){ SESSION.afterReady = SESSION.phase; SESSION.phase = 'readiness'; SESSION._ready = {sleep:2, energy:2, sore:2}; }   // start on the good answers: a normal day is two taps from Start
}
function totalSegments(){
  const w = SESSION.workout;
  if(w.format==='traditional') return w.blocks.reduce((s,b)=>s+b.sets*sidesFor(EX_BY_ID[b.ex]),0);
  if(w.format==='superset') return w.pairs.length*w.rounds*2;
  if(w.format==='emom') return w.totalMinutes;
  if(w.format==='amrap') return 1;
  if(w.format==='complex') return w.rounds*(w.chain||[]).length*complexSides(w);
  if(w.format==='for_time') return Math.max(1,(w.ladder||[]).length);
  return 1;
}
function doneSegments(){
  const w = SESSION.workout;
  if(w.format==='traditional'){
    let d=0;
    for(let i=0;i<SESSION.blockIndex;i++) d+=w.blocks[i].sets*sidesFor(EX_BY_ID[w.blocks[i].ex]);
    const cur = w.blocks[SESSION.blockIndex];
    if(cur){ const sv=sidesFor(EX_BY_ID[cur.ex]);
      d += SESSION.setIndex*sv + (sv===2 && currentSide()==='L' ? 1 : 0); }
    return d;
  }
  if(w.format==='superset'){
    return SESSION.round*w.pairs.length*2 + SESSION.blockIndex*2 + SESSION.setIndex;
  }
  if(w.format==='emom') return SESSION.minute;
  if(w.format==='complex'){ const n=(w.chain||[]).length, sd=complexSides(w);
    return SESSION.round*n*sd + (sd===2 && currentSide()==='L' ? n : 0) + SESSION.blockIndex; }
  if(w.format==='amrap') return SESSION.amrapDone?1:0;
  if(w.format==='for_time') return SESSION.ftDone ? (w.ladder||[]).length : SESSION.rung;
  return 0;
}
function overallPct(){ return Math.min(100, Math.round(doneSegments()/totalSegments()*100)); }

function renderActiveWorkout(){
  if(!SESSION) return shell('<p>No active session.</p>','home');
  const w = SESSION.workout;
  let inner = '<div class="top-row"><div class="back-btn" onclick="exitWorkout()">'+ICON.x+'</div>'
    + '<h2 style="font-size:19px;flex:1;">'+esc(w.name)+'</h2>'
    + (SESSION.finished ? '<span class="badge badge-blue">'+fmtLabel(w.format)+'</span>'
       : voiceButton()+'<div class="back-btn" title="Pause" onclick="togglePause()" style="margin-left:7px;">'+(SESSION.paused?ICON.play:ICON.pause)+'</div>')
    + '</div>';
  if(SESSION.paused && !SESSION.finished){
    inner += '<div class="card card-tight" style="margin-bottom:14px;text-align:center;">'
      + '<div class="eyebrow">Paused</div>'
      + '<p style="color:var(--text-2);font-size:14px;margin:8px 0 14px;">Timers are held. Pick up whenever you\u2019re ready.</p>'
      + '<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;">'
      + '<button class="btn btn-primary btn-sm" onclick="togglePause()">Resume</button>'
      + '<button class="btn btn-danger btn-sm" onclick="endWorkoutEarly()">End workout here</button>'
      + '</div></div>';
  }
  if(!SESSION.finished && SESSION.phase!=='readiness') inner += voiceHintCard();   // one question at a time
  inner += '<div class="progress-track" style="margin-bottom:6px;"><div class="progress-fill" style="width:'+overallPct()+'%;"></div></div>';
  inner += '<div style="text-align:right;font-size:12px;color:var(--text-3);font-weight:600;margin-bottom:18px;">'+overallPct()+'% complete</div>';
  // the phase can change while the body is being built (the main part running
  // out of work hands over to the finisher), so build the body FIRST and only
  // then draw the strip, or it would highlight the module we just left
  let body;
  if(SESSION.phase==='readiness') body = renderReadinessPhase();
  else if(SESSION.phase==='warmup') body = renderWarmupPhase();
  else if(SESSION.finished) body = renderWorkoutSummary();
  else if(SESSION.phase==='finisher_intro') body = renderFinisherIntro();
  else if(w.format==='traditional') body = renderTraditionalPhase();
  else if(w.format==='superset') body = renderSupersetPhase();
  else if(w.format==='emom') body = renderEmomPhase();
  else if(w.format==='amrap') body = renderAmrapPhase();
  else if(w.format==='complex') body = renderComplexPhase();
  else if(w.format==='for_time') body = renderForTimePhase();
  else body = '';
  if(!SESSION.finished && SESSION.phase!=='readiness') inner += renderModuleStrip(SESSION.workout);
  inner += body;
  let overlay = '';
  if(SESSION._shareOpen) overlay = renderShareOverlay();
  else if(SESSION._swapOpen) overlay = renderSwapOverlay();
  else if(SESSION._sheet) overlay = renderFocusSheet();
  else if(currentPeek()) overlay = renderPeekOverlay();
  else if(SESSION._feedbackShow) overlay = renderFeedbackOverlay();
  else if(SESSION.restSecondsLeft>0) overlay = renderRestOverlay();
  return '<div class="main-col"><div class="main-inner" style="padding-top:22px;max-width:520px;">'+inner+'</div></div>'+overlay;
}
/* ============================= VOICE COACH =============================
   Uses the browser's own speech synthesis, so it needs no network and no
   audio files. It is off until you turn it on, and the switch is always in
   reach in the workout header. */
const VOICE = { on:false, last:'', preKey:null };
function voiceSupported(){ return typeof window!=='undefined' && 'speechSynthesis' in window; }
function audioSupported(){ return typeof window!=='undefined' && !!(window.AudioContext||window.webkitAudioContext); }
function coachSupported(){ return voiceSupported() || audioSupported(); }
function loadVoicePref(){ VOICE.on = !!(STATE.profile && STATE.profile.voice); }
function toggleVoice(){
  VOICE.on = !VOICE.on;
  STATE.profile.voice = VOICE.on; STATE.profile.voiceHintSeen = true; saveState();
  if(VOICE.on){ unlockAudio(); beep(880,90); say('Voice coach on.', true); } else stopVoice();
  render();
}
function dismissVoiceHint(){ STATE.profile.voiceHintSeen = true; saveState(); render(); }
function stopVoice(){ try{ window.speechSynthesis.cancel(); }catch(e){} }
function say(text, force){
  if(!VOICE.on || !voiceSupported() || !text) return;
  if(!force && text===VOICE.last) return;          // never repeat the same line twice
  VOICE.last = text;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02; u.pitch = 1.0; u.volume = 1.0; u.lang = 'en-US';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){ /* a browser that refuses to speak should never break the workout */ }
}
function unitWord(){ return (STATE.profile.units||'kg')==='lb' ? 'pounds' : 'kilos'; }

/* Tones carry the timing; the voice carries the content. A spoken "three, two,
   one" lags and overlaps itself, where three short beeps and a long one land
   exactly on the second — the same convention every interval timer uses, so
   nobody has to learn it. */
const AUDIO = { ctx:null, unlocked:false };
function audioCtx(){
  try{
    if(!AUDIO.ctx){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; AUDIO.ctx = new C(); }
    if(AUDIO.ctx.state==='suspended') AUDIO.ctx.resume();
    return AUDIO.ctx;
  }catch(e){ return null; }
}
function beep(freq, ms, vol){
  if(!VOICE.on) return;
  const c = audioCtx(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    const t=c.currentTime, d=(ms||120)/1000, v=vol||0.28;
    o.type='sine'; o.frequency.value=freq||880;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}
function countBeep(n){ if(n>0) beep(660,110); else beep(990,420,0.34); }
/* iOS keeps both audio and speech locked until the page has been touched once.
   The first tap anywhere opens them, so a cue fired later from a timer is
   allowed to play. */
function unlockAudio(){
  if(AUDIO.unlocked) return;
  const c = audioCtx();
  if(c){ try{ const b=c.createBuffer(1,1,22050), s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); }catch(e){} }
  if(voiceSupported() && VOICE.on){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }catch(e){} }
  AUDIO.unlocked = true;
}
if(typeof document!=='undefined'){
  ['touchend','click'].forEach(function(ev){ document.addEventListener(ev, unlockAudio, {capture:true, passive:true}); });
}

/* Spoken lines are built from the same data the screen shows. A set that was
   already called out during the rest is not read out a second time when it
   starts — the long beep is the start. */
function cueKey(ex, prefix, side){
  const s = (ex && isPerSide(ex)) ? (side!==undefined ? side : ((SESSION&&SESSION.side)||'R')) : '';
  return (ex?ex.id:'')+'|'+(prefix||'')+'|'+(s||'');
}
function exerciseLine(ex, rec){
  let line = ex.name;
  if(rec){
    line += ex.timeBased ? ', '+rec.low+' to '+rec.high+' seconds'
                         : ', '+rec.low+' to '+rec.high+' reps';
    if(rec.weight) line += ', '+rec.weight+' '+unitWord();
  }
  return line;
}
function sayExercise(ex, rec, prefix){
  if(!ex) return;
  // the next set is drawn underneath the rest screen, but it is not live yet —
  // the rest itself calls it out at ten seconds
  if(SESSION && SESSION.restSecondsLeft > 0) return;
  const key = cueKey(ex, prefix);
  if(VOICE.preKey === key) return;          // already called out during the rest
  VOICE.preKey = null;
  const side = isPerSide(ex) ? sideLabel((SESSION&&SESSION.side)||'R')+' side. ' : '';
  say((prefix?prefix+'. ':'') + side + exerciseLine(ex, rec));
}
function voiceButton(){
  if(!coachSupported()) return '';
  return '<div class="back-btn" title="Voice coach" onclick="toggleVoice()" style="'
    + (VOICE.on?'background:var(--blue-glow);border-color:var(--blue);color:var(--blue);':'')
    + '">'+(VOICE.on?ICON.soundOn:ICON.soundOff)+'</div>';
}
/* Offered once, at the top of the first workout, because an audio coach nobody
   knows about is an audio coach nobody uses. */
function voiceHintCard(){
  if(!coachSupported() || VOICE.on || STATE.profile.voiceHintSeen) return '';
  return '<div class="voice-hint">'
    + '<div class="voice-hint-ico">'+ICON.soundOn+'</div>'
    + '<div style="flex:1;min-width:0;"><div class="voice-hint-t">Train with the voice coach</div>'
    + '<div class="voice-hint-b">It calls the next set during the rest and beeps the last three seconds, so the phone can stay on the bench.</div>'
    + '<div style="display:flex;gap:8px;margin-top:10px;">'
    + '<button class="btn btn-primary btn-sm" onclick="toggleVoice()">Turn it on</button>'
    + '<button class="btn btn-ghost btn-sm" onclick="dismissVoiceHint()">Not now</button></div></div></div>';
}

/* What comes after the rest that is running now. The session indexes have
   already moved on by the time a rest starts, so this simply reads them. */
function nextUpInfo(){
  if(!SESSION) return null;
  const w = SESSION.workout;
  let ex=null, rec=null, prefix='', detail='';
  if(w.format==='traditional' && w.blocks){
    const b = w.blocks[SESSION.blockIndex]; if(!b) return null;
    ex = EX_BY_ID[b.ex]; if(!ex) return null;
    rec = getRecommendation(ex, w.programId, w, b);
    prefix = 'Set '+(SESSION.setIndex+1);
    detail = 'Set '+(SESSION.setIndex+1)+' of '+b.sets;
  } else if(w.format==='superset' && w.pairs){
    const p = w.pairs[SESSION.blockIndex]; if(!p) return null;
    ex = EX_BY_ID[p[SESSION.setIndex]]; if(!ex) return null;
    rec = getRecommendation(ex, w.programId, w);
    prefix = 'Set '+(SESSION.setIndex+1);
    detail = (SESSION.setIndex===0?'A1':'A2')+' · Round '+(SESSION.round+1)+' of '+w.rounds;
  } else if(w.format==='complex' && w.chain){
    const c = w.chain[SESSION.blockIndex]; if(!c) return null;
    ex = EX_BY_ID[c.ex]; if(!ex) return null;
    prefix = 'Round '+(SESSION.round+1);
    detail = 'Round '+(SESSION.round+1)+' of '+w.rounds+' · '+w.chain.length+' movements';
  } else return null;
  const perSide = w.format==='complex' ? complexSides(w)===2 : isPerSide(ex);
  return { ex, rec, prefix, detail, side: perSide ? currentSide() : null };
}
function announceNext(){
  const n = nextUpInfo(); if(!n) return;
  if(SESSION.restLabel==='Switch sides'){ say(sideLabel(n.side||'L')+' side next.', true); }
  else say('Next. '+(n.side?sideLabel(n.side)+' side. ':'')+exerciseLine(n.ex, n.rec)+'.', true);
  VOICE.preKey = cueKey(n.ex, n.prefix, n.side||'R');
}
/* The side an EMOM minute will be worked on: per-side movements alternate each
   time they come round, right first — the same rule the minute screen uses. */
function emomSideFor(w, minute, exId){
  let seen = 0;
  for(let m=0;m<minute;m++) if(w.pattern[m % w.pattern.length]===exId) seen++;
  return (seen % 2) ? 'L' : 'R';
}
function announceEmomNext(){
  const w = SESSION.workout, m = SESSION.minute+1;
  if(m >= w.totalMinutes) return;
  const id = w.pattern[m % w.pattern.length];
  if(id==='rest'){ say('Next minute is rest.', true); return; }
  const ex = EX_BY_ID[id]; if(!ex) return;
  const rec = getRecommendation(ex, w.programId, w);
  const side = isPerSide(ex) ? emomSideFor(w, m, id) : null;
  say('Next. '+(side?sideLabel(side)+' side. ':'')+exerciseLine(ex, rec)+'.', true);
  VOICE.preKey = cueKey(ex, 'Minute '+(m+1), side||'R');
}

/* ============================= SCREEN WAKE LOCK =============================
   A phone that dims mid-set is a phone you have to pick up with chalky hands.
   The lock is held only while a workout is actually running and let go the
   moment it ends; the system drops it whenever the app goes to the background,
   so it is taken again on return. Browsers without the API simply sleep as
   before. */
const WAKE = { sentinel:null, pending:false, want:false };
function wakeWanted(){ return ROUTE.name==='active_workout' && !!SESSION && !SESSION.finished; }
function syncWakeLock(){
  WAKE.want = wakeWanted();
  if(typeof navigator==='undefined' || !('wakeLock' in navigator)) return;
  if(WAKE.want && !WAKE.sentinel && !WAKE.pending && document.visibilityState==='visible'){
    WAKE.pending = true;
    navigator.wakeLock.request('screen').then(function(s){
      WAKE.pending = false;
      if(!WAKE.want){ s.release().catch(function(){}); return; }
      WAKE.sentinel = s;
      s.addEventListener('release', function(){ WAKE.sentinel = null; });
    }).catch(function(){ WAKE.pending = false; });
  } else if(!WAKE.want && WAKE.sentinel){
    const s = WAKE.sentinel; WAKE.sentinel = null; s.release().catch(function(){});
  }
}
if(typeof document!=='undefined'){
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') syncWakeLock(); });
}

function togglePause(){
  if(!SESSION) return;
  SESSION.paused = !SESSION.paused;
  if(SESSION.paused){ stopVoice(); say('Paused.', true); }
  render();
}
/* Leaving early keeps whatever was logged. The sets are already in history, so
   the only thing to decide is whether the program day counts as done — it does
   not, but the attempt is recorded so the week still reflects the work. */
function endWorkoutEarly(){
  if(!SESSION) return;
  SESSION.paused = false;
  SESSION.endedEarly = true;
  SESSION.timerRunning = false;
  clearTimeout(SESSION._emomHandle); clearTimeout(SESSION._amrapHandle); clearTimeout(SESSION._restHandle);
  SESSION.restSecondsLeft = 0;
  finishWorkout({early:true});
  render();
}
function exitWorkout(){
  if(!SESSION) return;
  const logged = countSessionSets();
  if(logged===0){
    SESSION=null;
    navigate(STATE.selectedProgramId?'program_detail':'home', STATE.selectedProgramId?{id:STATE.selectedProgramId}:{});
    return;
  }
  // there is work worth keeping — pause instead of throwing it away
  SESSION.paused = true;
  render();
  toast(logged+' set'+(logged===1?'':'s')+' logged so far — end the workout from here to keep them.');
}
function countSessionSets(){
  if(!SESSION) return 0;
  const w=SESSION.workout;
  const todays = STATE.history.filter(h=>h.date===todayISO() && h.workoutName===w.name);
  return todays.length + (SESSION.emomLog?SESSION.emomLog.filter(e=>!e.skipped).length:0);
}

/* The warm-up is a module you work through, shown the same way as the working
   sets: one movement at a time with the figure, the cue and what it is
   preparing. The items are free text in the program data, so the movement is
   resolved from the text rather than duplicating the list as ids. */
const WARM_MOVE_MAP = [
  [/arm circle|band or arm/i, 'arm_circles'],
  [/shoulder pass/i,          'shoulder_pass'],
  [/cat-?\s?cow/i,            'cat_cow'],
  [/jumping jack/i,           'jumping_jacks'],
  [/jump rope|march/i,        'march'],
  [/bodyweight squat/i,       'bw_squat'],
  [/hip hinge/i,              'bw_hinge'],
  [/halo/i,                   'kb_halo'],
  [/american swing/i,         'american_swing'],
  [/swing/i,                  'kb_swing'],
  [/split squat/i,            'split_squat'],
  [/reverse lunge/i,          'reverse_lunge'],
  [/push-?up/i,               'push_up'],
  [/plank/i,                  'plank'],
  [/mountain climber/i,       'mountain_climber'],
  [/glute bridge|bridge/i,    'glute_bridge'],
  [/sit-?up/i,                'kb_sit_up'],
];
function warmMoveFor(text){
  for(let i=0;i<WARM_MOVE_MAP.length;i++){
    const pair = WARM_MOVE_MAP[i];
    if(pair[0].test(text) && MOVES[pair[1]]) return pair[1];
  }
  return null;                                   // e.g. "Stretches in remaining time"
}
function parseWarmItem(item){
  if(item && typeof item === 'object') return item;
  const txt = String(item);
  const parts = txt.split(' — ');
  return { label: parts[0], note: parts.slice(1).join(' — '), move: warmMoveFor(txt) };
}
function warmItems(){ return (SESSION.workout.warmup||[]).map(parseWarmItem); }
function goWarmItem(i){
  const items = warmItems();
  SESSION._warmIdx = Math.max(0, Math.min(items.length-1, i));
  render();
}
function completeWarmItem(){
  if(!SESSION._warmDone) SESSION._warmDone = {};
  const i = SESSION._warmIdx||0;
  SESSION._warmDone[i] = true;
  const items = warmItems();
  const next = items.findIndex((_,j)=> j>i && !SESSION._warmDone[j]);
  if(next >= 0){ SESSION._warmIdx = next; render(); return; }
  const anyLeft = items.findIndex((_,j)=> !SESSION._warmDone[j]);
  if(anyLeft >= 0){ SESSION._warmIdx = anyLeft; render(); return; }
  finishWarmup();                                 // everything ticked
}
function renderWarmupPhase(){
  const w = SESSION.workout;
  const items = warmItems();
  if(!items.length){ return '<div class="card"><p>No warm-up for this day.</p>'
    +'<button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="finishWarmup()">Start the main part</button></div>'; }
  if(SESSION._warmIdx==null) SESSION._warmIdx = 0;
  const idx = Math.max(0, Math.min(items.length-1, SESSION._warmIdx));
  const done = SESSION._warmDone||{};
  const nDone = items.filter((_,i)=>done[i]).length;
  const cur = items[idx];

  const eb = esc(cur.phase || 'Warm-up') + ' \u00b7 ' + (idx+1) + ' of ' + items.length;
  let html = '';
  window._figureMirror = false;
  if(cur.move){
    window._activeFigureExId = cur.move;          // drives the same animation engine
    html += focusHero(cur.move, eb, cur.label);
  } else {
    window._activeFigureExId = null;
    html += '<div class="card" style="text-align:center;"><div class="eyebrow">'+eb+'</div><h2 style="font-size:24px;margin:8px 0 2px;">'+esc(cur.label)+'</h2>'
          + '<p style="color:var(--text-3);font-size:13.5px;margin:12px 0 0;">Take this one at your own pace.</p></div>';
  }
  html += '<div class="focus-body">'
    + (cur.note ? '<p class="focus-why" style="font-size:15px;font-weight:700;color:var(--text-1);margin-top:14px;">'+esc(cur.note)+'</p>' : '')
    + (idx > 0 ? '<div class="focus-links"><button onclick="goWarmItem('+(idx-1)+')">Back</button></div>' : '')
    + '</div>';
  html += focusDock(nDone+1 >= items.length ? 'Done \u2014 start the main part' : 'Done, next movement', 'completeWarmItem()');

  // the rest of the list stays visible, so you can see what is coming and jump
  html += '<div class="card" style="margin-top:14px;">'
    + items.map((it,i)=> i===idx ? '' :
        '<div class="workout-row" style="cursor:pointer;" onclick="goWarmItem('+i+')">'
        + '<div class="wr-status '+(done[i]?'done':'')+'">'+(done[i]?ICON.check:ICON.play)+'</div>'
        + '<div class="wr-body"><div class="wr-title" style="font-size:14px;'+(done[i]?'color:var(--text-3);':'')+'">'+esc(it.label)+'</div>'
        + (it.note?'<div class="wr-meta">'+esc(it.note)+'</div>':'') + '</div></div>').join('')
    + '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px;" onclick="finishWarmup()">Skip the rest of the warm-up</button>'
    + '</div>';
  return html;
}
function finishWarmup(){ SESSION.phase='main'; render(); }

/* Unilateral work is the single easiest thing for a training app to get wrong:
   a "set" of one-arm press means a set on EACH arm. Three kinds exist —
     perSide      one full set per side, logged separately
     alternating  both sides inside the same set (gorilla row, mountain climber)
     null         both limbs work together
   Anything perSide doubles the real work, so the set tracker, the progress
   bar and the rest timing all have to know about it. */
function isPerSide(ex){ return !!(ex && ex.unilateral === 'perSide'); }
function sidesFor(ex){ return isPerSide(ex) ? 2 : 1; }
function sideLabel(side){ return side === 'L' ? 'Left' : 'Right'; }
function currentSide(){ return (SESSION && SESSION.side) || 'R'; }
function resetSide(){ if(SESSION) SESSION.side = 'R'; }
function sideBadge(ex){
  if(!isPerSide(ex)) return ex && ex.unilateral==='alternating'
    ? '<span class="badge badge-neutral">Alternating</span>' : '';
  return '<span class="badge badge-blue">'+sideLabel(currentSide())+' side</span>';
}
/* A plain number against a per-side lift understates the work, so say it. */
function roundTarget(exId, target){
  const ex = EX_BY_ID[exId];
  const t = String(target);
  if(!isPerSide(ex)) return t;
  return /side|each/i.test(t) ? t : t+'/side';
}
function targetDisplay(rec, ex){
  const base = ex.timeBased ? rec.low+'\u2013'+rec.high+' sec' : rec.low+'\u2013'+rec.high+' reps';
  return base + (isPerSide(ex) ? ' / side' : '');
}

/* ============================== FOCUS MODE ==============================
   The set screen shows what you need while the bell is in your hands: a big
   photo of the movement, the target in numbers you can read from the floor,
   and one button. Logging, technique, muscles and skip open as a sheet from
   the bottom, so none of them crowd the screen while you train. */
function focusHero(exId, eyebrow, title){
  const set = PHOTO_SETS[exId];
  const n = set ? set.src.length : 0;
  return '<div class="focus-hero">'+figureMarkup('fig-hero')
    + '<div class="fh-txt"><div class="fh-eb">'+eyebrow+'</div><div class="fh-title">'+esc(title)+'</div>'
    + '<div class="fh-row"><span class="fh-cap" id="animCue"></span>'
    + (n>1 ? '<span class="fh-dots" id="fhDots">'+Array.from({length:n}).map(function(_,i){ return '<i'+(i===0?' class="on"':'')+'></i>'; }).join('')+'</span>' : '')
    + '</div></div></div>';
}
function focusSideTag(ex){
  if(isPerSide(ex)) return ' · <span class="fh-side">'+sideLabel(currentSide())+' side</span>';
  if(ex && ex.unilateral==='alternating') return ' · alternating';
  return '';
}
function focusBig(rec, ex){
  const u = STATE.profile.units||'kg';
  const reps = rec.low===rec.high ? String(rec.low) : rec.low+'–'+rec.high;
  const unit = (ex.timeBased ? 'sec' : 'reps') + (isPerSide(ex) ? ' / side' : '');
  return '<div class="focus-big"><div><div class="n fh-num">'+reps+'</div><div class="u">'+unit+'</div></div><span class="sep"></span>'
    + (rec.weight ? '<div><div class="n">'+rec.weight+'</div><div class="u">'+u+'</div></div>'
                  : '<div><div class="n sm">BW</div><div class="u">bodyweight</div></div>')
    + '</div>';
}
function focusWhy(rec){
  if(!rec) return '';
  const bits = [];
  if(rec.prevText) bits.push('Last time: '+esc(rec.prevText)+'.');
  if(rec.note) bits.push(esc(rec.note)+'.');
  return bits.length ? '<p class="focus-why">'+bits.join(' ')+'</p>' : '';
}
function focusLinks(ex, skipFn){
  return '<div class="focus-links">'
    + '<button onclick="openSheet(\'tech\')">Technique</button>'
    + '<button onclick="openSheet(\'muscles\')">Muscles</button>'
    + (swapOptions(ex).length ? '<button onclick="openSwap()">'+ICON.swap+' Swap</button>' : '')
    + (skipFn ? '<button onclick="openSheet(\'skip\')">Skip</button>' : '')
    + '</div>';
}
function focusDock(label, onclick){
  return '<div class="focus-dock"><button class="btn btn-primary" onclick="'+onclick+'">'+esc(label)+'</button></div>';
}
function openSheet(kind){ if(!SESSION) return; SESSION._sheet = kind; render(); }
function closeSheet(){ if(!SESSION) return; SESSION._sheet = null; render(); }
function renderFocusSheet(){
  const kind = SESSION._sheet, ctx = SESSION._focusCtx || {};
  const ex = EX_BY_ID[ctx.exId] || EX_BY_ID[currentLiveExId()];
  let h = '';
  if(kind==='log' && ctx.log){
    const L = ctx.log;
    h = '<h3>'+esc(L.title)+'</h3>'
      + '<div class="fs-steps">'+numField('resultInput', ex.timeBased ? 'Seconds' : 'Reps', L.def)
      + (L.weight!=null && !ex.timeBased ? weightField(STATE.profile.units||'kg', L.weight) : '<div></div>') + '</div>'
      + feelField()
      + '<button class="btn btn-primary btn-block" onclick="'+L.save+'">Save set</button>';
  } else if(kind==='tech' && ex){
    const set = PHOTO_SETS[ex.id];
    h = '<h3>'+esc(ex.name)+'</h3>'
      + (set ? '<div class="tech-strip">'+set.src.map(function(src,i){ return '<figure class="'+(ANIM.photo&&ANIM.photo.cur===i?'on':'')+'" onclick="photoPick('+i+')"><img alt="" style="aspect-ratio:'+(set.ar||'480/540')+'" src="'+src+'"><span class="tn">'+(i+1)+'</span><figcaption>'+esc(set.labels[i])+'</figcaption></figure>'; }).join('')+'</div>' : '')
      + '<div class="tech">'
      + '<div class="tech-h">Do this</div><ul class="tech-list">'+(ex.keyPoints||[]).map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')+'</ul>'
      + '<div class="tech-h tech-h-bad">Watch for</div><ul class="tech-list tech-bad">'+(ex.mistakes||[]).map(function(t){ return '<li>'+esc(t)+'</li>'; }).join('')+'</ul>'
      + '</div><button class="btn btn-ghost btn-block" onclick="closeSheet()">Back to the set</button>';
  } else if(kind==='muscles' && ex){
    h = '<h3>'+esc(ex.name)+' · muscles</h3><div class="card-tight" style="background:var(--bg-2);border-radius:var(--radius-m);">'+muscleMap(ex)+'</div>'
      + '<button class="btn btn-ghost btn-block" onclick="closeSheet()">Back to the set</button>';
  } else if(kind==='skip' && ctx.skip){
    h = '<h3>Skip '+esc(ex ? ex.name : 'this')+'?</h3><p style="color:var(--text-2);font-size:14px;margin:0;">'+esc(ctx.skipText||'The rest of it is dropped and you move on.')+'</p>'
      + '<button class="btn btn-danger btn-block" onclick="SESSION._sheet=null;'+ctx.skip+'">Skip it</button>'
      + '<button class="btn btn-ghost btn-block" onclick="closeSheet()">Keep going</button>';

}

/* --- Traditional --- */

/* The engine already works the target out from your own history — this just
   says so out loud. A number you cannot account for is a number you distrust. */

/* ------------------------------ REPS IN RESERVE -----------------------------
   How many reps you should be able to leave in the tank. This is a PRESCRIPTION
   only — it tells you how to run the set. It is deliberately NOT what the
   progression reads: novices systematically underestimate how much they have
   left, and betting the load on a number they are guessing would make the
   engine guess with them. The load still moves on how the set actually felt.

   Ballistics are excluded on purpose. A swing is not taken near failure; it is
   stopped the moment the hips stop snapping, which is a different instruction
   entirely. */
const RIR_BY_PHASE = {Foundation:3, Build:2, Peak:1, Deload:4, Steady:3,
                      'Test week':1, Reset:4, 'Base rung':3, Climbing:2, 'Top rung':1};
const NO_RIR_TYPES = ['Swing','Power','Carry','Skill'];
function rirFor(ex, w){
  if(!ex || !w) return null;
  if(ex.timeBased) return null;
  if(NO_RIR_TYPES.indexOf(ex.type) >= 0) return null;
  if(['emom','amrap','for_time','complex'].indexOf(w.format) >= 0) return null;
  let r = RIR_BY_PHASE[w.phaseName];
  if(r == null) return null;
  /* A beginner is told to keep more back, because the estimate is the thing
     they are still learning. */
  const exp = (STATE.profile && STATE.profile.experience) || 'intermediate';
  if(exp === 'beginner') r += 1;
  else if(exp === 'advanced') r = Math.max(1, r-1);
  return Math.max(0, Math.min(5, r));
}
function rirLine(ex, w){
  const r = rirFor(ex, w);
  if(r == null) return '';
  const txt = r === 0 ? 'Take the last set to the edge \u2014 stop before the position goes'
    : 'Stop with about '+r+' rep'+(r===1?'':'s')+' still in the tank';
  return '<div class="rir-line"><span class="rir-n">RIR '+r+'</span>'+esc(txt)+'</div>';
}
function whyThisTarget(rec){
  if(!rec) return '';
  const bits = [];
  if(rec.prevText) bits.push('Last time: '+esc(rec.prevText)+'.');
  if(rec.note) bits.push(esc(rec.note)+'.');
  if(!bits.length) return '';
  return '<div class="why-box"><b>Why this target</b>'+bits.join(' ')+'</div>';
}
/* Kettlebells come in fixed sizes, so stepping the weight by 1 is meaningless —
   the stepper walks the bells you actually own. */
function stepWeight(delta){
  const el = document.getElementById('weightInput'); if(!el) return;
  const inv = equipOwned().weights;
  const cur = parseInt(el.textContent,10);
  if(!inv.length){ el.textContent = Math.max(0, cur+delta); return; }
  let i = inv.indexOf(cur);
  if(i < 0) i = inv.reduce((best,w,idx)=> Math.abs(w-cur)<Math.abs(inv[best]-cur)?idx:best, 0);
  else i = Math.max(0, Math.min(inv.length-1, i+delta));
  el.textContent = inv[i];
  const hint = document.getElementById('weightHint');
  if(hint) hint.textContent = (i===0?'lightest bell you own':(i===inv.length-1?'heaviest bell you own':''));
}
function weightField(label, def){
  const inv = equipOwned().weights;
  return '<div class="field"><label>'+esc(label)+'</label>'
    +'<div class="num-stepper"><button onclick="stepWeight(-1)">−</button>'
    +'<div class="val" id="weightInput">'+def+'</div>'
    +'<button onclick="stepWeight(1)">+</button></div>'
    +'<div id="weightHint" style="font-size:11.5px;color:var(--text-3);margin-top:6px;">'
      + (inv.length? 'Steps through your bells: '+inv.join(', ')+' '+STATE.profile.units : '')
    +'</div></div>';
}
/* ============================ READINESS CHECK ============================
   Three taps before the session. A coach looks at you walking in and changes
   the day; this is the closest an app gets. The answer can only take work
   away — trim sets, rounds or minutes, and hold the bell where it is — never
   add it, because feeling great is not a reason to rewrite the plan and a
   wrong "great" costs more than a wrong "rough". The warm-up is never cut:
   on a bad day it matters more, not less. */
const READY_Q = [
  {k:'sleep',  q:'Sleep last night', opts:['Poor','OK','Good']},
  {k:'energy', q:'Energy right now', opts:['Low','Normal','High']},
  {k:'sore',   q:'Soreness',         opts:['A lot','Some','None']},
];
function readinessWanted(){ return !STATE.profile || STATE.profile.readiness !== false; }
function readinessPlan(a){
  const s = a.sleep + a.energy + a.sore;
  if(s <= 1 || (a.sleep===0 && a.energy===0) || (a.sore===0 && s <= 2))
    return {level:'low', f:0.6, hold:true, dropFinisher:true, title:'Easy day'};
  if(s <= 3) return {level:'mid', f:0.75, hold:true, dropFinisher:false, title:'Trimmed session'};
  return {level:'ok', f:1, hold:false, dropFinisher:false, title:'Good to go'};
}
/* What the factor does to this particular workout, in its own units. */
function scaleWorkout(w, f, dropFinisher){
  const out = JSON.parse(JSON.stringify(w));
  const r = {unit:'', before:0, after:0};
  if(out.blocks){
    r.unit = 'sets';
    out.blocks.forEach(function(b){
      r.before += b.sets;
      if(b.ladder && b.ladder.length){
        b.ladder = b.ladder.slice(0, Math.max(2, Math.round(b.ladder.length*f)));
        b.sets = b.ladder.length;
      } else b.sets = Math.max(1, Math.round(b.sets*f));
      r.after += b.sets;
    });
  } else if(out.rounds){
    r.unit = 'rounds'; r.before = out.rounds;
    out.rounds = Math.max(1, Math.round(out.rounds*f)); r.after = out.rounds;
  } else if(out.format==='emom' && out.totalMinutes){
    r.unit = 'minutes'; r.before = out.totalMinutes;
    const L = (out.pattern||[]).length || 1;
    out.totalMinutes = Math.max(L, Math.round(out.totalMinutes*f/L)*L); r.after = out.totalMinutes;
  } else if(out.format==='amrap' && out.totalMinutes){
    r.unit = 'minutes'; r.before = out.totalMinutes;
    out.totalMinutes = Math.max(5, Math.round(out.totalMinutes*f)); r.after = out.totalMinutes;
  }
  if(out.mainMin && r.before) out.mainMin = Math.max(8, Math.round(out.mainMin * r.after / r.before));
  r.dropped = !!(dropFinisher && out.finisher);
  if(r.dropped) out.finisher = null;
  return {w: out, change: r};
}
function readinessVerdict(plan, change){
  if(plan.level==='ok') return 'Train as written.';
  const bits = [];
  if(change.unit && change.after < change.before) bits.push(change.before+' → '+change.after+' '+change.unit);
  if(change.dropped) bits.push('no finisher');
  let t = (bits.length ? bits.join(', ')+'. ' : '')
        + 'Same bells as last time — no jump to a heavier one today. The warm-up stays whole.';
  if(SESSION && SESSION.workout.format==='for_time') t = 'The clock sets the pace: go by feel today and stop at the cap. Same bells, no jump to a heavier one.';
  return t;
}
function readinessHold(){ return !!(SESSION && SESSION.readiness && SESSION.readiness.hold); }
function setReady(k, v){ SESSION._ready[k] = v; render(); }
function readyAnswers(){
  const a = SESSION._ready || {};
  return (a.sleep==null || a.energy==null || a.sore==null) ? null : a;
}
function renderReadinessPhase(){
  const a = SESSION._ready || {};
  let html = '<div class="card ready-card">'
    + '<div class="eyebrow">Before you start</div>'
    + '<h2 style="font-size:23px;margin:8px 0 6px;">How are you today?</h2>'
    + '<p class="ready-lede">Feeling fine? Just hit Start. A bad night is a reason to train lighter, not to skip.</p>';
  READY_Q.forEach(function(q){
    html += '<div class="ready-q"><div class="ready-l">'+esc(q.q)+'</div><div class="ready-opts">'
      // best answer first; the stored value stays 0 = worst .. 2 = best
      + q.opts.map(function(o,i){ return {o:o, i:i}; }).reverse().map(function(x){ return '<button class="ready-o'+(a[q.k]===x.i?' on':'')+'" onclick="setReady(\''+q.k+'\','+x.i+')">'+esc(x.o)+'</button>'; }).join('')
      + '</div></div>';
  });
  const ans = readyAnswers();
  if(ans){
    const plan = readinessPlan(ans);
    const sc = scaleWorkout(SESSION.workout, plan.f, plan.dropFinisher);
    html += '<div class="ready-verdict '+plan.level+'"><b>'+esc(plan.title)+'</b><span>'+esc(readinessVerdict(plan, sc.change))+'</span></div>';
  }
  html += '<button class="btn btn-primary btn-block" style="margin-top:16px;" '+(ans?'':'disabled ')+'onclick="confirmReadiness()">'
    + (SESSION.afterReady==='warmup' ? 'Start warm-up' : 'Start')+'</button>'
    + '<div class="ready-foot"><button class="btn btn-ghost btn-sm" onclick="skipReadiness()">Skip — train as written</button>'
    + '<button class="link-btn" onclick="neverReadiness()">Don’t ask before sessions</button></div>'
    + '</div>';
  return html;
}
function confirmReadiness(){
  const a = readyAnswers(); if(!a) return;
  const plan = readinessPlan(a);
  if(plan.f < 1 || plan.dropFinisher){
    const sc = scaleWorkout(SESSION.workout, plan.f, plan.dropFinisher);
    SESSION.workout = sc.w;
  }
  SESSION.readiness = {level:plan.level, hold:plan.hold, answers:a};
  (STATE.readinessLog = STATE.readinessLog || []).push({date:todayISO(), sleep:a.sleep, energy:a.energy, sore:a.sore, level:plan.level});
  if(STATE.readinessLog.length > 400) STATE.readinessLog = STATE.readinessLog.slice(-400);
  saveState();
  SESSION.phase = SESSION.afterReady || 'main';
  if(plan.level!=='ok') say(plan.title+'. '+(plan.level==='low'?'Lighter work today.':'A little less work today.'), true);
  render();
}
function skipReadiness(){ SESSION.phase = SESSION.afterReady || 'main'; render(); }

/* ============================== EXERCISE SWAP ==============================
   A sore wrist, a bell someone else has, a movement that is not working today.
   The options keep the day's intent: same movement pattern first, same kind
   of effort (a timed hold only swaps for a timed hold), gear you own, and
   nothing well beyond your level. */
const LVL = {beginner:0, intermediate:1, advanced:2};
function swapOptions(ex){
  if(!ex) return [];
  const exp = LVL[(STATE.profile && STATE.profile.experience) || 'intermediate'];
  const ok = function(e){
    return e && e.id!==ex.id && !!e.timeBased===!!ex.timeBased && MOVES[e.id]
      && (!e.pair || (STATE.profile && STATE.profile.pairs))
      && e.type!=='Mobility/Core'
      && (isLoaded(e) ? equipOwned().weights.length>0 : true)
      && LVL[e.difficulty] <= Math.max(exp, LVL[ex.difficulty]);   // a swap is never a promotion
  };
  const out = [];
  const add = function(e){ if(ok(e) && out.indexOf(e)<0) out.push(e); };
  if(ex.swap) add(EX_BY_ID[ex.swap]);
  EXERCISES.forEach(function(e){ if(e.type===ex.type) add(e); });
  EXERCISES.forEach(function(e){ if(e.cat===ex.cat) add(e); });
  return out.slice(0,4);
}
function swapTag(e, ex){
  const bits = [e.type===ex.type ? 'Same pattern' : 'Similar pattern',
                !isLoaded(e) ? 'no bell' : e.pair ? 'two bells' : 'one bell'];
  if(isPerSide(e)) bits.push('per side');
  const d = LVL[e.difficulty] - LVL[ex.difficulty];
  if(d<0) bits.push('easier'); else if(d>0) bits.push('harder');
  return bits.join(' · ');
}
function currentLiveExId(){
  const w = SESSION.workout;
  if(w.format==='traditional' && w.blocks){ const b = w.blocks[SESSION.blockIndex]; return b && b.ex; }
  if(w.format==='superset' && w.pairs){ const p = w.pairs[SESSION.blockIndex]; return p && p[SESSION.setIndex]; }
  if(w.format==='emom' && w.pattern){ const id = w.pattern[SESSION.minute % w.pattern.length]; return id==='rest' ? null : id; }
  return null;
}
function openSwap(){ if(SESSION){ SESSION._swapOpen = true; render(); } }
function closeSwap(){ if(SESSION){ SESSION._swapOpen = false; render(); } }
function doSwap(newId){
  if(SESSION) SESSION._sheet = null;
  const w = SESSION.workout, from = currentLiveExId();
  if(!from || !EX_BY_ID[newId]) return closeSwap();
  if(w.format==='traditional') w.blocks[SESSION.blockIndex].ex = newId;
  else if(w.format==='superset') w.pairs[SESSION.blockIndex][SESSION.setIndex] = newId;
  else if(w.format==='emom') w.pattern = w.pattern.map(function(x){ return x===from ? newId : x; });
  resetSide();
  SESSION._setFeel = null; SESSION._swapOpen = false;
  (SESSION.swaps = SESSION.swaps || []).push({from, to:newId});
  render();
  toast('Swapped to '+EX_BY_ID[newId].name+' for today');
}
function swapButton(ex){
  if(!ex || !swapOptions(ex).length) return '';
  return '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:9px;" onclick="openSwap()">'
    + ICON.swap + ' Swap exercise</button>';
}
function renderSwapOverlay(){
  const ex = EX_BY_ID[currentLiveExId()];
  const opts = swapOptions(ex);
  return '<div class="share-overlay" onclick="if(event.target===this) closeSwap()"><div class="swap-sheet">'
    + '<div class="share-top"><div><div class="eyebrow">Swap for today</div><div class="wr-meta" style="margin-top:3px;">Instead of '+esc(ex?ex.name:'')+'</div></div>'
    + '<div class="back-btn" onclick="closeSwap()">'+ICON.x+'</div></div>'
    + opts.map(function(e){
        return '<div class="ex-row swap-opt" onclick="doSwap(\''+e.id+'\')"><div class="ex-icon">'+exIcon(e)+'</div>'
          + '<div class="ex-row-body"><div class="ex-row-title">'+esc(e.name)+'</div><div class="ex-row-meta">'+esc(swapTag(e, ex))+'</div></div>'
          + ico(ICON.chevron)+'</div>';
      }).join('')
    + '<p class="share-hint" style="text-align:left;margin-top:4px;">Only today changes. Your program keeps its own exercise.</p>'

}

function numField(id,label,def){
  return '<div class="field"><label>'+esc(label)+'</label><div class="num-stepper"><button onclick="stepNum(\''+id+'\',-1)">\u2212</button><div class="val" id="'+id+'">'+def+'</div><button onclick="stepNum(\''+id+'\',1)">+</button></div></div>';
}
function stepNum(id, delta){ const el=document.getElementById(id); let v=parseInt(el.textContent,10)+delta; if(v<0)v=0; el.textContent=v; }
function submitTraditionalSet(exId, low, high, weight){
  const result = parseInt(document.getElementById('resultInput').textContent,10);
  const weightEl = document.getElementById('weightInput');
  const usedWeight = weightEl? parseInt(weightEl.textContent,10) : null;
  const diff = takeFeel(); const flags = takeFlags();
  const w = SESSION.workout;
  const ex = EX_BY_ID[exId];
  const side = isPerSide(ex) ? currentSide() : null;
  logSet({exerciseId:exId, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'traditional', weight:usedWeight, result, difficulty:diff, reason:null, targetLow:low, targetHigh:high, side:side, pain:flags.pain, form:flags.form});

  const doneBlock = w.blocks[SESSION.blockIndex];
  // the right side is only half the set — go straight to the left before counting it
  if(isPerSide(ex) && currentSide()==='R'){
    SESSION.side='L';
    startRest(Math.round(restSecondsFor(ex,'between_sets',w,doneBlock)*0.45), ()=>render(), 'Switch sides');
    return;
  }
  resetSide();
  const block = doneBlock;
  SESSION.setIndex++;
  if(SESSION.setIndex>=block.sets){ SESSION.setIndex=0; SESSION.blockIndex++; }
  if(SESSION.blockIndex>=w.blocks.length){ completeMainPart(); render(); return; }
  const movedOn = SESSION.setIndex===0;
  startRest(restSecondsFor(ex, movedOn?'between_exercises':'between_sets', w, block),
            ()=>render(), restLabelFor(ex, w, block));
}
function skipTraditionalExercise(){
  const w = SESSION.workout; resetSide(); SESSION.setIndex=0; SESSION.blockIndex++;
  if(SESSION.blockIndex>=w.blocks.length){ completeMainPart(); } render();
}
/* Rest is derived from what the set actually demanded, not one flat number.
   Established ranges (NSCA / ACSM): heavy strength and power sit at the long
   end, hypertrophy work in the middle, endurance work short. Kettlebell loads
   are moderate, so we run at the shorter end of each band. Moving to a
   DIFFERENT exercise needs less rest than repeating the same one, because the
   next pattern usually loads something else. */
function restSecondsFor(ex, kind, w, block){
  if(typeof ex === 'string') ex = null;               // tolerate the old call shape
  let base;
  if(!ex)                        base = 60;
  else if(ex.timeBased)          base = 45;           // carries, planks
  else if(ex.cat === 'power')    base = 75;           // ballistic: short but taxing
  else if(ex.cat === 'skill')    base = 90;           // get-up: quality, not fatigue
  else {
    const top = plannedReps(ex, w, block)[1] || 12;   // today's prescription, not the default
    base = top <= 8 ? 90 : top <= 12 ? 75 : top <= 15 ? 60 : 50;
  }
  if(kind === 'superset_within') return 0;            // straight into the pair
  if(kind === 'superset_round')  return Math.max(45, Math.round(base*0.8));
  if(kind === 'between_exercises') return Math.round(base*0.8);
  return base;
}
function restLabelFor(ex, w, block){
  if(!ex) return 'Rest';
  if(ex.timeBased) return 'Endurance';
  if(ex.cat === 'power') return 'Power';
  if(ex.cat === 'skill') return 'Skill';
  const top = plannedReps(ex, w, block)[1] || 12;
  return top <= 8 ? 'Strength' : top <= 15 ? 'Hypertrophy' : 'Endurance';
}

/* --- Superset --- */
function renderSupersetPhase(){

           save: "SESSION._sheet=null;submitSupersetSet('"+exId+"',"+rec.low+","+rec.high+")" } };

function submitSupersetSet(exId, low, high){
  const result = parseInt(document.getElementById('resultInput').textContent,10);
  const weightEl = document.getElementById('weightInput');
  const usedWeight = weightEl? parseInt(weightEl.textContent,10) : null;
  const diff = takeFeel(); const flags = takeFlags();
  const w = SESSION.workout;
  const exObj = EX_BY_ID[exId];
  const sideS = isPerSide(exObj) ? currentSide() : null;
  logSet({exerciseId:exId, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'superset', weight:usedWeight, result, difficulty:diff, reason:null, targetLow:low, targetHigh:high, side:sideS, pain:flags.pain, form:flags.form});
  if(isPerSide(exObj) && currentSide()==='R'){
    SESSION.side='L';
    startRest(Math.round(restSecondsFor(exObj,'between_sets',w)*0.4), ()=>render(), 'Switch sides');
    return;
  }
  resetSide();
  SESSION.setIndex++;
  if(SESSION.setIndex>=2){
    SESSION.setIndex=0;
    // hold on to the pair that just finished — the round rest is sized by it,
    // and the index below is about to move past it
    const donePair = w.pairs[SESSION.blockIndex] || [];
    SESSION.blockIndex++;
    if(SESSION.blockIndex>=w.pairs.length){
      SESSION.blockIndex=0; SESSION.round++;
      if(SESSION.round>=w.rounds){ completeMainPart(); render(); return; }
      const hardest = donePair.map(id=>EX_BY_ID[id])
        .sort((a,b)=>restSecondsFor(b,'superset_round',w)-restSecondsFor(a,'superset_round',w))[0];
      startRest(restSecondsFor(hardest,'superset_round',w), ()=>render(), 'Round complete'); return;
    }
  }
  render();
}


/* --- Complex ---
   A chain of movements done without putting the bell down. It is not a
   superset (you may rest between those) and not a circuit (you may change
   implement): the bell stays in the hand from the first rep to the last, which
   is what makes it its own format rather than a label on an old one. The whole
   chain runs on one side, then the other. */
function complexSides(w){ return (w.chain||[]).some(c=>isPerSide(EX_BY_ID[c.ex])) ? 2 : 1; }
function renderComplexPhase(){
  const w = SESSION.workout, chain = w.chain||[];
  if(SESSION.round >= w.rounds){ completeMainPart(); return afterMainMarkup(); }
  const step = chain[SESSION.blockIndex];
  if(!step){ completeMainPart(); return afterMainMarkup(); }
  const ex = EX_BY_ID[step.ex];
  const perSide = complexSides(w) === 2;
  if(!perSide) resetSide();
  window._activeFigureExId = ex.id;
  window._figureMirror = perSide && currentSide()==='L';

  SESSION._focusCtx = { exId: ex.id };
  let html = focusHero(ex.id, 'Round '+(SESSION.round+1)+' of '+w.rounds+(perSide ? ' \u00b7 <span class="fh-side">'+sideLabel(currentSide())+' side</span>' : ''), ex.name);
  html += '<div class="focus-body">' + '<div class="focus-big"><div><div class="n">'+step.reps+'</div><div class="u">reps'+(isPerSide(ex)?' this side':'')+'</div></div></div>'
        + focusLinks(ex, false) + '</div>';
  html += '<div class="card" style="margin-top:10px;"><div class="eyebrow" style="margin-bottom:8px;">The chain \u2014 the bell does not touch the floor</div>';
  html += chain.map((c,i)=>{
      const e = EX_BY_ID[c.ex];
      const cur = i===SESSION.blockIndex;
      return '<div class="ex-row" style="'+(cur?'border-color:var(--blue);background:var(--blue-glow);':'opacity:'+(i<SESSION.blockIndex?'0.45':'0.8')+';')+'">'
        + '<div class="ex-icon">'+exIcon(e)+'</div>'
        + '<div class="ex-row-body"><div class="ex-row-title">'+esc(e.name)+'</div>'
        + '<div class="ex-row-meta">'+c.reps+' reps'+(isPerSide(e)?' this side':'')+'</div></div></div>';
    }).join('');
  if(w.note) html += '<p style="color:var(--text-3);font-size:12.5px;margin-top:10px;">'+esc(w.note)+'</p>';
  const last = SESSION.blockIndex >= chain.length-1;
  const lastOfRound = last && (!perSide || currentSide()==='L');
  html += '<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="skipComplexRound()">Skip this round</button>';
  html += '</div>';
  html += focusDock(lastOfRound ? 'Round complete' : last ? 'Switch sides' : 'Next movement', 'advanceComplex()');
  return html;
}
function advanceComplex(){
  const w = SESSION.workout, chain = w.chain||[];
  const perSide = complexSides(w) === 2;
  if(SESSION.blockIndex < chain.length-1){ SESSION.blockIndex++; render(); return; }
  if(perSide && currentSide()==='R'){
    SESSION.side='L'; SESSION.blockIndex=0;
    startRest(20, ()=>render(), 'Switch sides'); return;
  }
  // a round is logged as one unit of work, at the weight carried through it
  const first = EX_BY_ID[chain[0].ex];
  logSet({exerciseId:first.id, programId:w.programId, programName:w.programName, week:w.week,
          workoutIndex:w.idx, workoutName:w.name, format:'complex',
          weight:pickWeightFor(first,null), result:1, difficulty:null, reason:null,
          targetLow:1, targetHigh:1, side:null});
  resetSide(); SESSION.blockIndex=0; SESSION.round++;
  if(SESSION.round>=w.rounds){ completeMainPart(); render(); return; }
  startRest(w.restSec||75, ()=>render(), 'Between rounds');
}
function skipComplexRound(){
  const w = SESSION.workout;
  resetSide(); SESSION.blockIndex=0; SESSION.round++;
  if(SESSION.round>=w.rounds) completeMainPart();
  render();
}

/* --- EMOM --- */
function renderEmomPhase(){

function startEmomTimer(){
  SESSION.timerRunning = true;
  countBeep(0);
  render();
  runEmomTick();
}
function runEmomTick(){
  if(!SESSION || SESSION.workout.format!=='emom' || !SESSION.timerRunning || SESSION.phase!=='main') return;
  const el = document.getElementById('emomTimer');
  const tick = ()=>{
    if(!SESSION || !SESSION.timerRunning) return;
    if(SESSION.paused){ SESSION._emomHandle = setTimeout(tick,1000); return; }
    SESSION.timeLeft--;
    const timerEl = document.getElementById('emomTimer');
    if(timerEl) timerEl.textContent = fmtMMSS(Math.max(0,SESSION.timeLeft));

function completeEmomMinute(){
  const w = SESSION.workout;
  const exId = w.pattern[SESSION.minute % w.pattern.length];
  if(exId!=='rest'){
    const resultEl = document.getElementById('emomResultInput');
    const result = resultEl? parseInt(resultEl.textContent,10) : 0;
    const ex = EX_BY_ID[exId];
    const rec = getRecommendation(ex, w.programId, w);
    SESSION.emomLog.push({exerciseId:exId, result, minute:SESSION.minute+1, skipped:false});
    logSet({exerciseId:exId, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'emom', weight:rec.weight, result, difficulty: result>=rec.high?'good':(result<rec.low?'hard':'just_right'), reason:null, targetLow:rec.low, targetHigh:rec.high});

function skipEmomExercise(exId){

}

/* --- AMRAP --- */
function renderAmrapPhase(){
  const w = SESSION.workout;
  if(SESSION.amrapDone){ completeMainPart(); return afterMainMarkup(); }

  html += '</div>';

    html += '<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="finishAmrapEarly()">Finish Now</button>';

/* ---------------------------------- FOR TIME ---------------------------------
   A chipper against a clock that counts UP, with a cap so the session cannot
   run away. The work is a ladder of rungs — 21-15-9, or 1-2-3-4-5 — and each
   rung is that many reps of every movement in the chain. A movement can carry
   a multiplier when its natural dose is higher (twice the mountain climbers
   for every swing). The clock is the score; the reps are what gets logged, so
   volume and history stay comparable with every other format. */
function ftReps(rung, c){ return Math.max(1, Math.round(rung * (c.mult||1))); }
function ftCapSec(w){ return (w.capMin || w.mainMin || 20) * 60; }
function ftTotals(w, rungsDone){
  const out = {};
  (w.chain||[]).forEach(c=> out[c.ex] = 0);
  (w.ladder||[]).slice(0, rungsDone).forEach(r=>
    (w.chain||[]).forEach(c=> out[c.ex] += ftReps(r, c)));
  return out;
}
function renderForTimePhase(){
  const w = SESSION.workout;
  if(SESSION.ftDone){ completeMainPart(); return afterMainMarkup(); }
  const lad = w.ladder||[], cap = ftCapSec(w);
  const idx = Math.min(SESSION.rung, Math.max(0,lad.length-1));
  const reps = lad[idx] || 0;
  const left = Math.max(0, cap - SESSION.timeElapsed);

  let html = '<div class="card" style="text-align:center;">'
    + '<div class="eyebrow">For time · '+Math.round(cap/60)+' min cap</div>'
    + '<div class="timer-big" id="ftTimer">'+fmtMMSS(SESSION.timeElapsed)+'</div>'
    + '<div class="timer-sub">Round <span id="ftRung">'+(SESSION.rung+1)+'</span> of '+lad.length
      + ' · <span id="ftLeft"'+(left<=120?' class="cap-warn"':'')+'>'+fmtMMSS(left)+'</span> to the cap</div>'
    + '</div>';

  html += '<div class="card"><div class="eyebrow" style="margin-bottom:10px;">The ladder</div>'
    + '<div class="rung-row">'+lad.map((r,i)=>'<span class="rung'
        +(i<SESSION.rung?' done':i===SESSION.rung?' now':'')+'">'+r+'</span>').join('')+'</div>'
    + (w.note ? '<div class="wr-meta" style="margin-top:10px;">'+esc(w.note)+'</div>' : '')
    + '</div>';

  html += '<div class="card"><div class="eyebrow" style="margin-bottom:10px;">This round</div>'
    + (w.chain||[]).map(c=>{ const ex=EX_BY_ID[c.ex]; if(!ex) return '';
        return '<div class="tap-row" onclick="peekExercise(\''+c.ex+'\')">'
        + '<div class="ex-icon" style="width:38px;height:38px;">'+exIcon(ex)+'</div>'
        + '<div style="flex:1;text-align:left;"><div style="font-size:14.5px;font-weight:700;">'+esc(ex.name)+'</div>'
        + '<div class="wr-meta">'+ftReps(reps,c)+' reps'+(isPerSide(ex)?' per side':'')+'</div></div>'
        + '<span class="row-chev">'+ICON.chevron+'</span></div>'; }).join('')
    + '<div style="font-size:11px;color:var(--text-3);margin-top:10px;font-weight:600;text-align:center;">TAP ANY MOVEMENT TO SEE IT</div>'
    + '</div>';

  if(!SESSION.timerRunning){
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="startForTime()">Start the clock</button>';
  } else {
    html += '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="completeRung()">'
         + (SESSION.rung+1 >= lad.length ? 'Last round done — stop the clock' : 'Round of '+reps+' done')+'</button>'
         + '<button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="finishForTime(true)">Stop here</button>';
  }
  return html;
}
function startForTime(){
  SESSION.timerRunning=true; countBeep(0);
  const lad = SESSION.workout.ladder||[];
  if(lad.length) say('Go. Round of '+lad[SESSION.rung||0]+'.', true);
  render(); runForTimeTick();
}
function runForTimeTick(){
  if(!SESSION || SESSION.workout.format!=='for_time' || !SESSION.timerRunning) return;
  const cap = ftCapSec(SESSION.workout);
  const tick = ()=>{
    if(!SESSION || !SESSION.timerRunning) return;
    if(SESSION.paused){ SESSION._ftHandle = setTimeout(tick,1000); return; }
    SESSION.timeElapsed++;
    const t = document.getElementById('ftTimer'); if(t) t.textContent = fmtMMSS(SESSION.timeElapsed);
    const l = document.getElementById('ftLeft');
    const left = Math.max(0, cap-SESSION.timeElapsed);
    if(l){ l.textContent = fmtMMSS(left); if(left<=120) l.className='cap-warn'; }
    if(left===300 && cap>420) say('Five minutes to the cap.', true);
    else if(left===120 && cap>240) say('Two minutes to the cap.', true);
    else if(left===60) say('One minute.', true);
    if(left>0 && left<=3) countBeep(left);
    if(left<=0){ countBeep(0); say('Cap. Put the bell down.', true); finishForTime(true); return; }
    SESSION._ftHandle = setTimeout(tick,1000);
  };
  clearTimeout(SESSION._ftHandle);
  SESSION._ftHandle = setTimeout(tick,1000);
}
function completeRung(){
  const w = SESSION.workout, lad = w.ladder||[];
  SESSION.rung++;
  if(SESSION.rung >= lad.length){ finishForTime(false); return; }
  say('Round of '+lad[SESSION.rung]+'.', true);
  render();
}
function finishForTime(capped){
  const w = SESSION.workout;
  SESSION.timerRunning=false; clearTimeout(SESSION._ftHandle);
  SESSION.ftDone=true; SESSION.ftCapped=!!capped;
  const totals = ftTotals(w, SESSION.rung);
  (w.chain||[]).forEach(c=>{
    const ex = EX_BY_ID[c.ex]; if(!ex) return;
    const rec = getRecommendation(ex, w.programId, w);
    logSet({exerciseId:c.ex, programId:w.programId, programName:w.programName, week:w.week,
      workoutIndex:w.idx, workoutName:w.name, format:'for_time', weight:rec.weight,
      result:totals[c.ex]||0, timeSec:SESSION.timeElapsed, capped:!!capped, noPR:true,
      difficulty:'just_right', reason:null,
      targetLow:totals[c.ex]||0, targetHigh:totals[c.ex]||0});
  });
  completeMainPart();
  render();
}

function startAmrapTimer(){ SESSION.timerRunning=true; countBeep(0); say('Go.', true); render(); runAmrapTick(); }
function runAmrapTick(){
  if(!SESSION || SESSION.workout.format!=='amrap' || !SESSION.timerRunning) return;
  const tick=()=>{
    if(!SESSION || !SESSION.timerRunning) return;
    if(SESSION.paused){ SESSION._amrapHandle = setTimeout(tick,1000); return; }
    SESSION.timeLeft--;
    const timerEl = document.getElementById('amrapTimer');
    if(timerEl) timerEl.textContent = fmtMMSS(Math.max(0,SESSION.timeLeft));
    const total = (SESSION.workout.totalMinutes||0)*60, left = SESSION.timeLeft;
    if(total >= 240 && left === Math.floor(total/2)) say('Halfway. '+SESSION.amrapRounds+' rounds so far.', true);
    else if(left === 60 && total > 120) say('One minute left.', true);
    if(left>0 && left<=3) countBeep(left);
    if(left<=0){ countBeep(0); finishAmrapEarly(); return; }
    SESSION._amrapHandle = setTimeout(tick,1000);
  };
  clearTimeout(SESSION._amrapHandle);
  SESSION._amrapHandle = setTimeout(tick,1000);
}
function logAmrapRound(){ SESSION.amrapRounds++; const el=document.getElementById('amrapRoundCount'); if(el) el.textContent=SESSION.amrapRounds; }
function finishAmrapEarly(){
  SESSION.timerRunning=false; SESSION.amrapDone=true;
  const w = SESSION.workout;
  w.round.forEach(r=>{
    const ex = EX_BY_ID[r.ex]; const rec = getRecommendation(ex, w.programId, w);
    logSet({exerciseId:r.ex, programId:w.programId, programName:w.programName, week:w.week, workoutIndex:w.idx, workoutName:w.name, format:'amrap', weight:rec.weight, result:SESSION.amrapRounds, difficulty:'just_right', reason:null, targetLow:SESSION.amrapRounds, targetHigh:SESSION.amrapRounds});
  });
  completeMainPart();
  render();
}

/* --- Rest overlay --- */
function startRest(seconds, onDone, label){
  if(!seconds || seconds<=0){ if(onDone) onDone(); return; }   // e.g. straight into a superset pair
  SESSION.restSecondsLeft = seconds; SESSION.restTotal = seconds;
  SESSION.restLabel = label || 'Rest'; SESSION._restOnDone = onDone;
  // a short rest has no room for two announcements, so it goes straight to what is next
  if(seconds < 15) announceNext(); else say('Rest. '+seconds+' seconds.', true);
  render(); tickRest();
}
function tickRest(){
  if(!SESSION || SESSION.restSecondsLeft<=0) return;
  updateRestRing();
  SESSION._restHandle = setTimeout(()=>{
    if(!SESSION) return;
    if(SESSION.paused){ tickRest(); return; }                  // a paused workout holds the clock
    SESSION.restSecondsLeft--;
    const left = SESSION.restSecondsLeft;
    if(left<=0){ countBeep(0); const cb=SESSION._restOnDone; SESSION._restOnDone=null; render(); if(cb) cb(); }
    else {
      if(left===10 && (SESSION.restTotal||0) >= 15) announceNext();
      if(left<=3) countBeep(left);
      tickRest();
    }
  },1000);
}
function addRestTime(sec){
  if(!SESSION || SESSION.restSecondsLeft<=0) return;
  SESSION.restSecondsLeft = Math.max(5, SESSION.restSecondsLeft + sec);
  SESSION.restTotal = Math.max(SESSION.restTotal||0, SESSION.restSecondsLeft);
  updateRestRing();
}
function skipRest(){ clearTimeout(SESSION._restHandle); const cb=SESSION._restOnDone; SESSION.restSecondsLeft=0; SESSION._restOnDone=null; render(); if(cb) cb(); }
function restRingMarkup(){
  const total = Math.max(1, SESSION.restTotal || SESSION.restSecondsLeft || 1);
  const R = 92, C = 2*Math.PI*R;
  const frac = Math.max(0, Math.min(1, SESSION.restSecondsLeft/total));
  return '<div class="rest-ring"><svg viewBox="0 0 200 200" aria-hidden="true">'
    + '<circle cx="100" cy="100" r="'+R+'" class="rr-track"/>'
    + '<circle id="restRing" cx="100" cy="100" r="'+R+'" class="rr-fill'+(SESSION.restSecondsLeft<=3?' rr-hot':'')+'"'
    + ' stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'" transform="rotate(-90 100 100)"/></svg>'
    + '<div class="rest-num" id="restCountdown">'+fmtMMSS(SESSION.restSecondsLeft)+'</div></div>';
}
function updateRestRing(){
  const el = document.getElementById('restCountdown');
  if(el) el.textContent = fmtMMSS(SESSION.restSecondsLeft);
  const ring = document.getElementById('restRing');
  if(ring){
    const total = Math.max(1, SESSION.restTotal || 1), C = 2*Math.PI*92;
    const frac = Math.max(0, Math.min(1, SESSION.restSecondsLeft/total));
    ring.setAttribute('stroke-dashoffset', (C*(1-frac)).toFixed(1));
    ring.setAttribute('class', 'rr-fill'+(SESSION.restSecondsLeft<=3?' rr-hot':''));
  }
}
/* The rest screen answers the only two questions anyone has between sets: how
   long, and what next. Seeing the next load while still breathing is what lets
   you pick up the right bell before the timer runs out. */
function nextUpCard(){
  const n = nextUpInfo(); if(!n) return '';
  const tgt = n.rec ? targetDisplay(n.rec, n.ex).replace(' / side','') : '';
  const wt  = n.rec ? (n.rec.weight ? n.rec.weight+' '+STATE.profile.units : 'Bodyweight') : '';
  return '<div class="next-up"><div class="next-up-eye">Next up'+(n.side?' · '+sideLabel(n.side)+' side':'')+'</div>'
    + '<div class="next-up-row"><div class="ex-icon">'+exIcon(n.ex)+'</div>'
    + '<div class="next-up-body"><div class="next-up-name">'+esc(n.ex.name)+'</div>'
    + '<div class="next-up-meta">'+esc(n.detail)+'</div></div>'
    + (tgt||wt ? '<div class="next-up-load"><div class="next-up-t">'+esc(tgt)+'</div><div class="next-up-w">'+esc(wt)+'</div></div>' : '')
    + '</div></div>';
}
function renderRestOverlay(){
  const why = {Strength:'Heavy, low-rep work needs the longest rest.',
               Hypertrophy:'Enough to recover, short enough to keep the stimulus.',
               Power:'Ballistic sets are short but taxing.',
               Skill:'Rest for quality of movement, not fatigue.',
               Endurance:'Short rest is part of the training effect.',
               'Switch sides':'Same set, other side.'}[SESSION.restLabel] || '';
  return '<div class="rest-overlay"><div class="eyebrow">'+esc(SESSION.restLabel||'Rest')+(SESSION.restLabel==='Switch sides'?'':' · Rest')+'</div>'
  + restRingMarkup()
  + (why ? '<p class="rest-why">'+esc(why)+'</p>' : '')
  + nextUpCard()
  + '<div class="rest-btns">'

    const rw = ctx.measureText(right).width;
    ctx.textAlign = 'left'; ctx.fillStyle = '#C9D2DF'; ctx.font = '600 40px '+FB;
    ctx.fillText(ellipsize(ctx, l.ex.name, W-180-rw-40), 90, y);
  });
  // footer: the last two weeks, the same squares as the Progress calendar
  const dc = dayCounts().c, start = addDays(mondayOf(todayISO()), -7), cell = 24, gap = 6;
  for(let wk=0; wk<2; wk++) for(let r=0; r<7; r++){
    const iso = isoLocal(addDays(start, wk*7+r));
    const n = dc[iso]||0, x = W - 90 - (14*(cell+gap) - gap + 16) + (wk*7+r)*(cell+gap) + wk*16, yy = 1838;
    rr(ctx, x, yy, cell, cell, 6);

  }

  ctx.fillStyle = '#FFFFFF'; ctx.font = '700 44px '+FD;
  ctx.fillText(st ? st+'-WEEK STREAK' : 'DAY ONE', 90, 1850);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  return c;
}

/* 3 024 kg does not fit under a 30-pixel bar, so volume gets a compact form.
   The unit is written once, in the caption, not repeated on every label. */
function fmtVol(v){
  if(v >= 10000) return Math.round(v/1000)+'k';
  if(v >= 1000)  return (v/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(Math.round(v));
}
/* One series, so no legend — the section title names it. A number on every bar
   is noise; only the latest week with work in it is labelled, because that is
   the one being read. Empty weeks get a baseline tick, not a stub bar that
   looks like a broken column. */
function volumeChart(weeks){
  const u    = STATE.profile.units || 'kg';
  if(!weeks.length)
    return '<div class="empty-state">Log a few sets and your weekly volume shows up here.</div>';
  const max  = Math.max.apply(null, weeks.map(w=>w.v));
  const done = weeks.filter(w=>w.v>0);
  if(!done.length)
    return '<div class="empty-state">Log a few sets and your weekly volume shows up here.</div>';

  const lastIdx = weeks.reduce((k,w,i)=> w.v>0 ? i : k, -1);
  const cols = weeks.map((w,i)=>{
    const pct   = max>0 ? Math.max(3, w.v/max*74) : 0;   // 74% leaves room for the label
    const label = i===lastIdx ? '<div class="vol-val">'+fmtVol(w.v)+'</div>' : '';
    /* the highlight marks the week the caption is talking about — the latest
       one with work in it. The peak line, not a second colour, carries the max. */
    const bar   = w.v>0
      ? '<div class="vol-bar'+(i===lastIdx?' hi':'')+'" style="height:'+pct.toFixed(1)+'%;"></div>'
      : '<div class="vol-bar zero"></div>';
    return '<div class="vol-col" title="'+esc(w.label)+' · '
      + (w.v>0 ? Math.round(w.v)+' '+u : 'no sets logged')+'">'+label+bar+'</div>';
  }).join('');

  /* the caption has room for the real number; only the bars need the short form */
  const thisWeek = Math.round(weeks[weeks.length-1].v);
  const span = weeks.length>1 ? 'Weeks '+weeks[0].week+'–'+weeks[weeks.length-1].week
                              : 'Week '+weeks[0].week;
  return '<div class="vol-cap"><span class="k">'+span+'</span>'
    + '<span class="v">'+thisWeek.toLocaleString('en-US')+' '+u+' this week</span></div>'
    + '<div class="vol-plot">'
      + '<div class="vol-peak"><b>'+fmtVol(max)+'</b></div>'
      + '<div class="vol-base"></div>'
      + '<div class="vol-cols">'+cols+'</div>'
    + '</div>'
    + '<div class="vol-axis">'+weeks.map((w,i)=>'<span'+(i===weeks.length-1?' class="now"':'')
        +'>'+esc(w.label)+'</span>').join('')+'</div>'
    + (done.length<2 ? '<div class="vol-note">One week in. A second week of logging gives you a trend to read.</div>' : '');
}
/* Week 1 is the week you first logged a set, not an arbitrary slice of the
   calendar. The old version numbered the eight columns 1-8 within a rolling
   window, so a first-ever workout landed under "W8" and the oldest column of
   an empty history was labelled "W1" — the number meant the opposite of what
   it read as. Anchoring to the first log also stops the buckets sliding by a
   day every day, which used to move old sets between columns. */
function weekIndexer(){
  const DAY = 24*3600*1000;
  const logs = STATE.history.filter(h=>h.weight && h.result && h.date);
  if(!logs.length) return null;
  let first = logs[0].date;
  logs.forEach(h=>{ if(h.date < first) first = h.date; });
  const anchor = new Date(first+'T00:00:00').getTime();
  const at = iso => Math.floor((new Date(iso+'T00:00:00').getTime()-anchor)/(7*DAY)) + 1;
  return {logs, at, current: Math.max(1, at(todayISO()))};
}
function last8WeeksVolume(){
  const W = weekIndexer();
  if(!W) return [];
  const from = Math.max(1, W.current-7);
  const buckets = [];
  for(let n=from; n<=W.current; n++){
    let v = 0;
    W.logs.forEach(h=>{ if(W.at(h.date)===n) v += h.weight*h.result; });
    buckets.push({v, week:n, label:'W'+n});
  }
  const max = Math.max.apply(null, buckets.map(b=>b.v).concat([1]));
  return buckets.map(b=>Object.assign({},b,{max}));
}
function groupHistoryByDate(){
  const map = {};
  STATE.history.slice().reverse().forEach(h=>{
    const key = h.date+'|'+h.workoutName;
    if(!map[key]) map[key] = {date:h.date, workoutName:h.workoutName||'Session', count:0};
    map[key].count++;
  });
  return Object.values(map);
}

/* ======================== PER-EXERCISE PROGRESS ========================
   One number per lift per session, chosen by what progress MEANS for that lift:
     e1rm     grinds (press, squat, row): weight and reps folded into one
              estimate, so 16 kg x 10 and 20 kg x 6 can sit on the same line
     volume   ballistics: a swing gets better by doing more work, not by
              grinding out a heavier single
     weight   carries and the get-up: the bell you can own is the measure
     reps / seconds   bodyweight movements
   Only formats that log real reps feed it. An AMRAP logs rounds, a complex logs
   one unit per round and a for-time piece logs totals; none of those is a set,
   and mixing them in would draw cliffs that never happened. */
const STRENGTH_FORMATS = {traditional:1, superset:1, emom:1, custom:1};
function countedEntry(h){ return !!h && !h.skipped && h.result>0 && (!h.format || STRENGTH_FORMATS[h.format]); }
function progressKind(ex){
  if(!isLoaded(ex)) return ex.timeBased ? 'seconds' : 'reps';
  if(ex.timeBased || ex.type==='Carry' || ex.type==='Skill') return 'weight';
  if(ex.type==='Swing' || ex.type==='Power') return 'volume';
  return 'e1rm';
}
const KIND_META = {
  e1rm:   {title:'Estimated strength', unit:'w',
           blurb:'Your best set each session as one number — weight and reps together (Epley estimate of a single). It lets a heavier bell for fewer reps sit on the same line as a lighter one for more.'},
  volume: {title:'Work per session', unit:'w',
           blurb:'Bell weight × reps, added across the session. Ballistics get better by doing more crisp work, not by grinding a heavier single.'},
  weight: {title:'Heaviest bell', unit:'w',
           blurb:'The heaviest bell you owned for the full set. For a get-up or a carry, that is the whole story.'},
  reps:   {title:'Best set', unit:'reps', blurb:'Most reps in one set each session.'},
  seconds:{title:'Longest hold', unit:'sec', blurb:'Longest set each session, in seconds.'},
};
function kindUnit(kind){ const u = KIND_META[kind].unit; return u==='w' ? (STATE.profile.units||'kg') : u; }
function e1rmOf(w, r){ return (!w || !r) ? 0 : w*(1+Math.min(r,15)/30); }
function exerciseSessions(exId){
  const ex = EX_BY_ID[exId]; if(!ex) return [];
  const kind = progressKind(ex);
  const by = {};
  STATE.history.forEach(function(h){
    if(h.exerciseId!==exId || !h.date || !countedEntry(h)) return;
    (by[h.date] = by[h.date] || []).push(h);
  });
  const score = function(s){
    return kind==='e1rm' ? e1rmOf(s.weight, s.result)
         : kind==='weight' ? (s.weight||0)*1000 + (s.result||0)
         : (s.result||0);
  };
  return Object.keys(by).sort().map(function(date){
    const sets = by[date];
    let best = sets[0], vol = 0, maxW = 0;
    sets.forEach(function(s){
      vol += (s.weight||0)*(s.result||0);
      if((s.weight||0) > maxW) maxW = s.weight||0;
      if(score(s) > score(best)) best = s;
    });
    const value = kind==='e1rm' ? Math.round(e1rmOf(best.weight,best.result)*2)/2
                : kind==='volume' ? vol
                : kind==='weight' ? (best.weight||0)
                : (best.result||0);
    return {date, sets:sets.length, best, value, volume:vol, maxW, pain: sets.some(function(s){return s.pain;})};
  });
}
function exerciseTrend(exId){
  const ex = EX_BY_ID[exId]; if(!ex) return null;
  const s = exerciseSessions(exId); if(!s.length) return null;
  const kind = progressKind(ex);
  const first = s[0], last = s[s.length-1];
  const heaviest = Math.max.apply(null, s.map(function(x){return x.maxW;}));
  const pct = first.value>0 ? Math.round((last.value-first.value)/first.value*100) : 0;
  const weeks = Math.round((dateMs(last.date)-dateMs(first.date))/(7*864e5));
  return {ex, kind, sessions:s, first, last, heaviest, pct, weeks};
}
function fmtKindValue(kind, v){
  if(kind==='volume') return Math.round(v).toLocaleString('en-US');
  if(kind==='e1rm') return (Math.round(v*2)/2).toString();
  return String(Math.round(v));
}
function bestSetText(ex, s){
  const b = s.best, u = STATE.profile.units||'kg';
  const r = ex.timeBased ? b.result+' s' : b.result+' reps';
  return b.weight ? b.weight+' '+u+' × '+(ex.timeBased ? b.result+' s' : b.result) : r;
}
/* The one sentence that says what the chart says. A drop is described, not
   dramatised: in a block with deloads a lower number is often the plan. */
function trendStory(t){
  const u = STATE.profile.units||'kg';
  if(t.sessions.length < 2) return 'One session logged. The line starts with the second.';
  const span = t.weeks>=1 ? ' in '+t.weeks+' week'+(t.weeks===1?'':'s') : ' so far';
  const bells = (t.first.maxW && t.heaviest > t.first.maxW)
    ? 'From the '+t.first.maxW+' to the '+t.heaviest+' '+u+' bell'+span+'. ' : '';
  const what = {e1rm:'Estimated strength', volume:'Work per session', weight:'Heaviest bell',
                reps:'Best set', seconds:'Longest hold'}[t.kind];
  if(t.kind==='weight' && bells) return bells.trim();
  if(t.pct > 0) return bells + what+' up '+t.pct+'%'+(bells ? '.' : span+'.');
  if(t.pct < 0) return bells + what+' is '+Math.abs(t.pct)+'% under your first session — a deload or a rough day reads like this. Three in a row is the signal, one is not.';
  return bells + 'Holding level across '+t.sessions.length+' sessions. The next step is usually one more rep, not a heavier bell.';
}
function deltaChip(pct){
  if(!pct) return '<span class="delta flat">→ 0%</span>';
  return pct>0 ? '<span class="delta up">↑ '+pct+'%</span>' : '<span class="delta down">↓ '+Math.abs(pct)+'%</span>';
