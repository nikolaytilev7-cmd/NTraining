/* ============================================================================
   EXERCISE MOTION ENGINE (v3)

   Movements are MODELLED, not posed. Each exercise is a short script of
   biomechanical primitives (hinge, squat, lunge, armHang, armPress …) with a
   parameter per key that has a real meaning, so the numbers can be checked
   against coaching cues instead of guessed.

   Three deliberate seams, so this can be upgraded without a rewrite:
     1. Every joint is a full 3D point and each leg takes its OWN ankle
        target — split stances and carries need that, and adding it later
        would mean re-solving every exercise.
     2. Exercise scripts live in one data block (MOVES) with no rendering
        mixed in, so they can be edited, exported or migrated on their own.
     3. The renderer is reached through a single drawFigure(ctx, pose) call.
        Swapping the hand-rolled canvas for a real 3D renderer touches that
        function and nothing else.
   ============================================================================ */

/* ---------------------------------- RIG ---------------------------------- */
/* Proportions follow real human ratios (body ≈ 7.5 heads). The arm reach in
   particular matters: too short and the bell can never travel below the hips,
   which is what made earlier swings look like grabbing at the waist. */
const RIG = {
  groundY:190, ankleX:74, hipX:74, hipY:116,
  shin:38, thigh:39, torso:45, neck:8.5, headR:10.5,
  upperArm:29, forearm:27};
const REACH = RIG.upperArm + RIG.forearm;   // 56
const SOFT  = REACH - 0.5;                  // a "straight" arm, with a hair of bend
const Z_LEG = 19, Z_ARM = 16, Z_HAND2 = 6;  // depth separation of the paired limbs

function ik2(ox,oy,tx,ty,l1,l2,bend){
  const dx=tx-ox, dy=ty-oy;
  const d0 = Math.hypot(dx,dy) || 0.001;
  const d = Math.max(Math.abs(l1-l2)+0.4, Math.min(l1+l2-0.4, d0));
  const a = Math.atan2(dy,dx);
  const cosA = Math.max(-1, Math.min(1, (l1*l1+d*d-l2*l2)/(2*l1*d)));
  const A = Math.acos(cosA);
  return {
    joint:{x:ox+l1*Math.cos(a+bend*A), y:oy+l1*Math.sin(a+bend*A)},
    end:{x:ox+d*Math.cos(a), y:oy+d*Math.sin(a)}};
}
function p3(p,z){ return {x:p.x, y:p.y, z:z||0}; }
function lerpN(a,b,f){ return (a==null?0:a)+((b==null?0:b)-(a==null?0:a))*f; }

/* ------------------------------ STANCE PRIMITIVES ------------------------- */
/* HINGE — the hips travel BACK. That is what separates a hinge from a squat. */
function hinge(t){ return { hipX: RIG.hipX - 33*t, hipY: RIG.hipY + 6*t, pitch: 4 + 57*t }; }
/* SQUAT — the hips travel DOWN and the torso stays relatively upright. */
function squat(t){ return { hipX: RIG.hipX - 22*t, hipY: RIG.hipY + 34*t, pitch: 6 + 17*t }; }
function stance(h,s){
  const a=hinge(h||0), b=squat(s||0);
  return { hipX:a.hipX+(b.hipX-RIG.hipX), hipY:a.hipY+(b.hipY-RIG.hipY), pitch:a.pitch+(b.pitch-4) };
}
/* Feet: both on the same spot by default; split stances override per leg. */
function feetTogether(){ const a={x:RIG.ankleX,y:RIG.groundY}; return [a,{x:a.x,y:a.y}]; }
function feetSplit(backX, frontX){
  return [ {x:backX, y:RIG.groundY}, {x:frontX, y:RIG.groundY} ];
}
/* LUNGE — back foot steps away, hips drop between the feet. */
function lunge(t, stepBack){
  const step = stepBack==null ? 34 : stepBack;
  return {
    hipX: RIG.hipX - 5*t, hipY: RIG.hipY + 30*t, pitch: 5 + 10*t,
    ankles: feetSplit(RIG.ankleX - step*t - 2, RIG.ankleX + 8)};
}
/* WALK — used by the carries: the feet alternate, the body bobs a little. */
function walk(p){
  const a = p*Math.PI*2;
  return {
    hipX: RIG.hipX, hipY: RIG.hipY + 2.2*Math.abs(Math.sin(a)), pitch: 2,
    ankles: feetSplit(RIG.ankleX + 13*Math.sin(a), RIG.ankleX - 13*Math.sin(a))};
}

/* -------------------------------- ARM MODES ------------------------------- */
/* WORLD frame — the frame gravity works in. Anything hanging or swinging. */
function armHang(sh, angleDeg, reach){
  const r=angleDeg*Math.PI/180, R=(reach==null?SOFT:reach);
  return { x: sh.x + R*Math.sin(r), y: sh.y + R*Math.cos(r) };
}
/* TORSO frame — stays glued to the chest as the torso pitches. Rack / goblet. */
function armTorso(hip, sh, alongFrac, outDist){
  const dx=sh.x-hip.x, dy=sh.y-hip.y, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  return { x: hip.x+ux*L*alongFrac + nx*outDist, y: hip.y+uy*L*alongFrac + ny*outDist };
}
/* Press: rack (hand at the shoulder) through to lockout (straight overhead). */
function armPress(sh, u){
  return armHang(sh, 100+78*u, 13 + (SOFT-13)*Math.pow(u,0.85));
}
/* Row: hand travels from hanging to beside the lower ribs, elbow past the torso. */
/* Build the finish position in the torso's own frame, so it cannot drift to
   the wrong side of the body: 40% up the spine from the hip, and 14 units
   clear of it, on whichever side the arm is already hanging. */
function torsoFrame(hip, sh, ref){
  const tx=sh.x-hip.x, ty=sh.y-hip.y, L=Math.hypot(tx,ty)||1;
  const ux=tx/L, uy=ty/L;
  let nx=uy, ny=-ux;                                  // a normal to the spine
  if((ref.x-hip.x)*nx + (ref.y-hip.y)*ny < 0){ nx=-nx; ny=-ny; }   // point it outward
  return {ux,uy,nx,ny,L};
}
function armRow(hip, sh, u){
  const down = armHang(sh, 0);
  const f = torsoFrame(hip, sh, down);
  const ribs = { x: hip.x + f.ux*f.L*0.40 + f.nx*14,
                 y: hip.y + f.uy*f.L*0.40 + f.ny*14 };
  return { x: down.x+(ribs.x-down.x)*u, y: down.y+(ribs.y-down.y)*u };
}
/* The elbow trails: back down the spine and out away from the ribs. Weighted
   toward the outward normal, because straight back lies along the bone at the
   finish and would collapse. */
const ROW_HINT = (z, ps) => {
  const f = torsoFrame(ps.hip, ps.shoulder, ps.arms[1].hand);
  return { x: -f.ux*0.55 + f.nx*0.95, y: -f.uy*0.55 + f.ny*0.95, z: z*0.35 };
};
/* High pull: elbow leads high and wide, hand comes in toward the chest. */
function armHighPull(sh, u){
  return armHang(sh, 6+82*u, SOFT - 26*u);
}
/* Snatch: hangs, stays close on the way up, punches out overhead. */
function armSnatch(sh, u){
  if(u<0.55){ const k=u/0.55; return armHang(sh, 4+70*k, SOFT-22*k); }
  const k=(u-0.55)/0.45; return armHang(sh, 74+104*k, (SOFT-22)+22*k);
}
/* Halo: a tight circle around the head. Kept small on purpose — a wide circle
   both misrepresents the movement and throws the arms into a spike overhead. */
function armHalo(sh, head, p){
  const a=p*Math.PI*2;
  const cx=head.x, cy=head.y+5;
  return { x: cx + 19*Math.cos(a), y: cy + 11*Math.sin(a) };
}

/* ------------------------------- RIG KINDS -------------------------------- */
/* Every builder returns the same shape, so one renderer serves all of them:
   { hip, shoulder, head, legs:[{ankle,knee,hip}], arms:[{shoulder,elbow,hand}], bell } */

function buildStanding(st){
  const pr=st.pitch*Math.PI/180;
  const hip={x:st.hipX,y:st.hipY};
  const ux=Math.sin(pr), uy=-Math.cos(pr);
  const sh={x:hip.x+ux*RIG.torso, y:hip.y+uy*RIG.torso};
  // the neck holds more upright than the spine it sits on, so a deep hinge does
  // not end up staring at the floor
  const hp=(st.pitch*0.68)*Math.PI/180;
  const head={x:sh.x+Math.sin(hp)*(RIG.neck+RIG.headR), y:sh.y-Math.cos(hp)*(RIG.neck+RIG.headR)};

  const ankles = st.ankles || feetTogether();
  const legs = ankles.map((an,i)=>{
    const z = i===0 ? -Z_LEG : Z_LEG;
    // bend +1: the knee tracks FORWARD over the foot
    const s = ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh, 1);
    return { ankle:p3(an,z), knee:p3(s.joint,z), hip:p3(hip, z*0.55) };
  });

  const H = st.hands(hip, sh, head);
  /* Draw the hand where the ARM can actually put it, not where the script
     asked for it. ik2 already clamps an out-of-reach target and hands back the
     reachable point; ignoring it stretched the forearm instead of bending the
     elbow — by 96% on the halo and 77% on the get-up. */
  const solveArm=(target,bend,zLimb,zHand)=>{
    const s=ik2(sh.x,sh.y, target.x,target.y, RIG.upperArm,RIG.forearm, bend);
    return { shoulder:p3(sh,zLimb), elbow:p3(s.joint,zLimb), hand:p3(s.end,zHand) };
  };
  let arms, bells=[];
  if(H.off){
    // one working arm, the other does something natural rather than sitting at
    // an arbitrary angle — that mismatch is what read as "arms going opposite ways"
    /* The free hand follows the working arm's bend unless it asks otherwise.
       The old default of -1 against a main arm of +1 sent the two elbows in
       opposite directions — visible wherever both hands share one target. */
    arms = [ solveArm(H.off, H.offBend!=null?H.offBend:(H.bend!=null?H.bend:-1), -Z_ARM, -Z_ARM),
             solveArm(H.main, H.bend!=null?H.bend:-1, Z_ARM, Z_ARM) ];
    /* the bell rides the hand the arm reached, or it floats off the fist */
    if(H.bells==='both') bells=[p3(arms[0].hand,-Z_ARM), p3(arms[1].hand,Z_ARM)];
    else if(H.bells!=='none') bells=[p3(arms[1].hand,Z_ARM)];
  }else{
    // two-handed: both arms converge on ONE handle
    arms = [ solveArm(H.main, H.bend!=null?H.bend:-1, -Z_ARM, -Z_HAND2),
             solveArm(H.main, H.bend!=null?H.bend:-1,  Z_ARM,  Z_HAND2) ];
    if(H.bells!=='none') bells=[p3(arms[1].hand,0)];
  }
  return { kind:'standing', hip:p3(hip,0), shoulder:p3(sh,0), head:p3(head,0), legs, arms, bells };
}

/* Prone — push-up and plank. The body is ONE RIGID LINE from ankle through
   knee and hip to the shoulder: solving the legs with IK (as the standing rig
   does) buckles the knee and the figure reads as kneeling, not planking.
   The toes and the hands are both fixed on the floor, so lowering the shoulder
   swings the body on an arc about the toes and the elbow bends — which is what
   a push-up actually does. */
function buildProne(st){
  const ankle = { x:26, y:RIG.groundY-3 };
  const hand  = { x:136, y:RIG.groundY };
  const L = RIG.torso + RIG.thigh + RIG.shin;          // 122, the rigid body line
  /* On the forearms the elbow is planted and the shoulder stacks directly over
     it, so the shoulder height is not free — it is one upper arm above the
     floor. That also makes the body line flatter than a straight-arm plank,
     which is exactly the difference between the two positions. */
  const shY = st.forearm ? (RIG.groundY - 2 - RIG.upperArm) : st.shoulderY;
  const drop = Math.max(0, Math.min(L-8, ankle.y - shY));
  const run  = Math.sqrt(Math.max(1, L*L - drop*drop));
  const ux = run/L, uy = -drop/L;                       // unit vector, ankle -> shoulder
  const at = d => ({ x: ankle.x + ux*d, y: ankle.y + uy*d });
  const knee = at(RIG.shin);
  const hip  = at(RIG.shin + RIG.thigh);
  const sh   = at(L);
  const head = at(L + RIG.neck + RIG.headR*0.9);

  const drive = st.drive || 0;        // a knee pulled in toward the chest
  const rowLift = st.rowLift || 0;     // a hand lifted off the floor to the ribs
  const legs = [-Z_LEG, Z_LEG].map((z,i)=>{
    /* No sideways nudge: shifting the ankle and knee but not the hip shortened
       the thigh by 7.6%. The far leg is separated by z, like every other pair. */
    const k = 0;
    if(i===1 && drive>0){
      /* The near leg drives forward. Only the FOOT is placed; the knee is
         solved from it, because typing both made the thigh 20 units long on a
         rig whose thigh is 39 — the leg visibly telescoped on every rep. */
      const an = { x: hip.x + 34*drive + 4, y: RIG.groundY - 3 - 34*drive };
      const kn = ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh, 1).joint;
      return { ankle:p3(an,z), knee:p3(kn,z), hip:p3(hip, z*0.55) };
    }
    return { ankle:p3({x:ankle.x+k, y:ankle.y}, z), knee:p3({x:knee.x+k, y:knee.y}, z),
             hip:p3(hip, z*0.55) };
  });
  const arms = [-Z_ARM, Z_ARM].map((z,i)=>{
    if(st.forearm){
      /* Elbow straight down from the shoulder onto the floor, forearm flat and
         pointing ahead toward the head. Both bones are placed at their exact
         length rather than solved, because both ends are known. */
      const el = { x: sh.x, y: sh.y + RIG.upperArm };
      const hd = { x: el.x + RIG.forearm, y: el.y };
      return { shoulder:p3(sh,z), elbow:p3(el,z), hand:p3(hd,z) };
    }
    let hd = { x: hand.x + (i?0:-6), y: hand.y };
    let bend = -1;
    if(i===1 && rowLift>0){
      hd = { x: hand.x - 34*rowLift, y: hand.y - 48*rowLift };
      bend = 1;
    }
    const s = ik2(sh.x,sh.y, hd.x,hd.y, RIG.upperArm,RIG.forearm, bend);
    return { shoulder:p3(sh,z), elbow:p3(s.joint,z), hand:p3(s.end,z) };
  });
  return { kind:'prone', hip:p3(hip,0), shoulder:p3(sh,0), head:p3(head,0), legs, arms, bells:[] };
}

/* Supine — floor press. On the back, knees bent, pressing straight up. */
function buildSupine(st){
  /* The shoulder used to be typed in at x=76 against a hip at x=130 — a torso
     54 units long on a rig whose torso is 45. It is now measured off the hip
     along the body axis, and the knees are solved rather than guessed. */
  const hip={x:130,y:RIG.groundY-4};
  const lie=-3*Math.PI/180;                              // lying all but flat
  const sh={x:hip.x-Math.cos(lie)*RIG.torso, y:hip.y+Math.sin(lie)*RIG.torso};
  const dx=sh.x-hip.x, dy=sh.y-hip.y, dl=Math.hypot(dx,dy)||1;
  const head={x:sh.x+(dx/dl)*(RIG.neck+RIG.headR)*0.85, y:sh.y+(dy/dl)*(RIG.neck+RIG.headR)*0.85};
  const legs=[-Z_LEG,Z_LEG].map((z,i)=>{
    /* Feet planted about 55 units from the hip, which is a 90-degree knee.
       At 32 the leg folded back on itself and the knees swallowed the torso. */
    const an={x:hip.x+55, y:RIG.groundY-3};
    const kn=ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh, 1).joint;   // knee up
    return { ankle:p3(an,z), knee:p3(kn,z), hip:p3(hip,z*0.5) };
  });
  const hand={x:82, y:st.handY};
  /* The pressing arm is solved; the resting arm gets its OWN target on the
     floor and is solved too. Nudging a copy of the first solution by a few
     units stretched the resting upper arm by 17 percent. */
  const sMain=ik2(sh.x,sh.y, hand.x,hand.y, RIG.upperArm,RIG.forearm, 1);
  const rest ={x:sh.x+34, y:RIG.groundY-2};
  const sRest=ik2(sh.x,sh.y, rest.x,rest.y, RIG.upperArm,RIG.forearm, 1);
  const armsOut=[
    { shoulder:p3(sh,-Z_ARM), elbow:p3(sRest.joint,-Z_ARM), hand:p3(sRest.end,-Z_ARM) },
    { shoulder:p3(sh, Z_ARM), elbow:p3(sMain.joint, Z_ARM), hand:p3(sMain.end, Z_ARM) }];
  return { kind:'supine', hip:p3(hip,0), shoulder:p3(sh,0), head:p3(head,0), legs, arms:armsOut, bells:[p3(sMain.end,Z_ARM)] };
}


/* Bridge — shoulders and feet stay down, the hips drive up. The floor-press rig
   is pinned flat on its back, so it cannot express this. */
function buildBridge(st){
  const lift = st.lift||0;
  const hip = {x:116, y:RIG.groundY-7 - 34*lift};
  // the shoulders stay on the floor, so the torso angle follows from the hip
  // height — placing both ends freely stretched the torso well past its length
  const rise = Math.min(RIG.torso-4, (RIG.groundY-7) - hip.y);
  const run  = Math.sqrt(Math.max(1, RIG.torso*RIG.torso - rise*rise));
  const sh = {x: hip.x - run, y: RIG.groundY-7};
  const dx=sh.x-hip.x, dy=sh.y-hip.y, dl=Math.hypot(dx,dy)||1;
  const head = {x:sh.x+(dx/dl)*(RIG.neck+RIG.headR)*0.8, y:sh.y+(dy/dl)*(RIG.neck+RIG.headR)*0.8};
  const legs=[-Z_LEG,Z_LEG].map((z,i)=>{
    const an={x:hip.x+38+(i?0:-5), y:RIG.groundY-3};
    const s=ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh, 1);   // knee points up
    return {ankle:p3(an,z), knee:p3(s.joint,z), hip:p3(hip,z*0.5)};
  });
  const arms=[-Z_ARM,Z_ARM].map((z,i)=>{
    const hd={x:sh.x+36+(i?0:-5), y:RIG.groundY-2};
    const s=ik2(sh.x,sh.y, hd.x,hd.y, RIG.upperArm,RIG.forearm, 1);
    return {shoulder:p3(sh,z), elbow:p3(s.joint,z), hand:p3(s.end,z)};
  });
  return {kind:'supine', hip:p3(hip,0), shoulder:p3(sh,0), head:p3(head,0), legs, arms,
          bells: st.bell ? [p3({x:hip.x, y:hip.y-11},0)] : []};
}
/* Sit-up — the trunk rotates up about the hips, knees bent, feet planted. */
function buildSitUp(st){
  const u = st.u||0;
  const hip = {x:112, y:RIG.groundY-7};
  const th = (178 - 62*u)*Math.PI/180;
  const sh = {x:hip.x+Math.cos(th)*RIG.torso, y:hip.y-Math.sin(th)*RIG.torso};
  const dx=sh.x-hip.x, dy=sh.y-hip.y, dl=Math.hypot(dx,dy)||1;
  const head = {x:sh.x+(dx/dl)*(RIG.neck+RIG.headR), y:sh.y+(dy/dl)*(RIG.neck+RIG.headR)};
  const legs=[-Z_LEG,Z_LEG].map((z,i)=>{
    /* Feet planted, knee solved from the hip — the typed knee made the thigh
       50 units long against a rig that says 39. */
    const an={x:172, y:RIG.groundY-3};
    const kn=ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh, 1).joint;
    return {ankle:p3(an,z), knee:p3(kn,z), hip:p3(hip,z*0.5)};
  });
  const hand = st.hold==='chest'
    ? {x:sh.x+Math.cos(th-1.3)*16, y:sh.y-Math.sin(th-1.3)*16}
    : {x:head.x-4, y:head.y-6};
  const arms=[-Z_ARM,Z_ARM].map((z,i)=>{
    const hd={x:hand.x+(i?0:-5), y:hand.y+(i?0:3)};
    const s=ik2(sh.x,sh.y, hd.x,hd.y, RIG.upperArm,RIG.forearm, 1);
    return {shoulder:p3(sh,z), elbow:p3(s.joint,z), hand:p3(s.end,z)};
  });
  return {kind:'supine', hip:p3(hip,0), shoulder:p3(sh,0), head:p3(head,0), legs, arms,
          bells: st.bell ? [p3(hand,0)] : []};
}


/* Hollow hold — low back pressed down, straight legs and arms floating. The
   sit-up rig keeps the feet planted, which is simply not this position. */
function buildHollow(st){
  const u = st.u==null?0.5:st.u;
  const hip = {x:108, y:RIG.groundY-9};
  const sh  = {x:hip.x-RIG.torso*0.99, y:hip.y-4-5*u};
  const head= {x:sh.x-7, y:sh.y-9};
  const legA = (12+15*u)*Math.PI/180;                  // legs straight, angled up
  const legs=[-Z_LEG,Z_LEG].map((z,i)=>{
    /* No sideways nudge: it moved the knee away from a hip that stayed put and
       shortened the thigh. Depth is what separates the pair. */
    const kn={x:hip.x+Math.cos(legA)*RIG.thigh, y:hip.y-Math.sin(legA)*RIG.thigh};
    const an={x:kn.x+Math.cos(legA)*RIG.shin, y:kn.y-Math.sin(legA)*RIG.shin};
    return {ankle:p3(an,z), knee:p3(kn,z), hip:p3(hip,z*0.5)};
  });
  const hand={x:sh.x-38, y:sh.y+3-8*u};                // arms reach back past the head
  const arms=[-Z_ARM,Z_ARM].map((z,i)=>{
    const hd={x:hand.x+(i?0:5), y:hand.y+(i?0:4)};
    const a=ik2(sh.x,sh.y, hd.x,hd.y, RIG.upperArm,RIG.forearm, -1);
    return {shoulder:p3(sh,z), elbow:p3(a.joint,z), hand:p3(a.end,z)};
  });
  return {kind:'supine', hip:p3(hip,0), shoulder:p3(sh,0), head:p3(head,0), legs, arms, bells:[]};
}
/* Custom — a key supplies joint coordinates directly. Used by the get-up,
   which involves rotation this sagittal rig cannot express honestly. */
function buildCustom(st){
  const j=st.joints;
  const legs=[-Z_LEG,Z_LEG].map((z,i)=>({
    ankle:p3(i? j.ankleF : j.ankleB, z), knee:p3(i? j.kneeF : j.kneeB, z), hip:p3(j.hip, z*0.55)}));
  const arms=[
    { shoulder:p3(j.shoulder,-Z_ARM), elbow:p3(j.elbowB,-Z_ARM), hand:p3(j.handB,-Z_ARM) },
    { shoulder:p3(j.shoulder, Z_ARM), elbow:p3(j.elbowF, Z_ARM), hand:p3(j.handF, Z_ARM) },
  ];
  return { kind:'custom', hip:p3(j.hip,0), shoulder:p3(j.shoulder,0), head:p3(j.head,0),
           legs, arms, bells: st.noBell ? [] : [p3(j.handF, Z_ARM)] };
}

/* --------------------------- MUSCLE BAND PLACEMENT ------------------------ */
/* A muscle is drawn as a BAND running along the limb that works and hugging the
   correct side of it. Offset + half-width must stay inside the limb radius,
   or the band floats off the silhouette and reads as a sticker.
   Limb radii: thigh 8.4 · shin 6.4 · torso 10.6 · upper arm 5.6 · forearm 4.5 */
function segPt(a,b,f,back){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, nx=-uy, ny=ux;     // n points toward the figure's BACK
  return { x:a.x+ux*L*f + nx*back, y:a.y+uy*L*f + ny*back, z:(a.z||0)+((b.z||0)-(a.z||0))*f };
}
function band(a,b,f0,f1,back,w){ return { a:segPt(a,b,f0,back), b:segPt(a,b,f1,back), w }; }

function muscleBands(pose, key){
  const out=[];
  const torso=[pose.hip,pose.shoulder], head=pose.head;
  const onLegs=(f0,f1,back,w)=> pose.legs.forEach(lg=> out.push(band(lg.hip,lg.knee,f0,f1,back,w)));
  const onShins=(f0,f1,back,w)=> pose.legs.forEach(lg=> out.push(band(lg.knee,lg.ankle,f0,f1,back,w)));
  const onArms=(f0,f1,back,w)=> pose.arms.forEach(ar=> out.push(band(ar.shoulder,ar.elbow,f0,f1,back,w)));
  const onForearms=(f0,f1,w)=> pose.arms.forEach(ar=> out.push(band(ar.elbow,ar.hand,f0,f1,0,w)));
  switch(key){
    case 'quads':      onLegs(0.24,0.74,-3.0,7.0); break;
    case 'hamstrings': onLegs(0.24,0.78, 3.0,7.0); break;
    case 'glutes':     onLegs(0.00,0.18, 3.4,9.0); break;
    case 'calves':     onShins(0.12,0.55,2.6,5.6); break;
    case 'core':       out.push(band(torso[0],torso[1],0.18,0.56,-4.6,7.6)); break;
    case 'obliques':   out.push(band(torso[0],torso[1],0.24,0.58, 1.0,9.0)); break;
    case 'chest':      out.push(band(torso[0],torso[1],0.70,0.93,-5.2,8.6)); break;
    case 'back':       out.push(band(torso[0],torso[1],0.52,0.88, 5.0,8.0)); break;
    case 'lower_back': out.push(band(torso[0],torso[1],0.10,0.44, 5.2,7.8)); break;
    case 'traps':      out.push(band(pose.shoulder,head,0.02,0.42,2.2,5.6)); break;
    case 'shoulders':  onArms(0.00,0.24,0,9.0); break;
    case 'biceps':     onArms(0.30,0.80,-2.2,5.0); break;
    case 'triceps':    onArms(0.30,0.80, 2.2,5.0); break;
    case 'forearms':   onForearms(0.18,0.72,4.2); break;
  }
  return out;
}

/* --------------------------------- CAMERA --------------------------------- */
/* Fixed per exercise: the angle is part of the movement's definition, because
   each movement has a plane it reads best in — and it needs two numbers, not
   one. A hinge reads side-on; anything on the floor is a flat line unless the
   camera also lifts off the horizontal. */
const CAM = { rot:20, pitch:0, z:470, base:2.62, cx:230, groundY:442, groundLocal:50 };
const CAM_ANGLE = {
  kb_swing:{rot:20,pitch:-4},          russian_swing:{rot:20,pitch:-4},
  one_arm_swing:{rot:22,pitch:-5},     kb_deadlift:{rot:24,pitch:-6},
  romanian_deadlift:{rot:24,pitch:-6}, single_leg_deadlift:{rot:28,pitch:-7},
  kb_good_morning:{rot:24,pitch:-6},   glute_bridge:{rot:26,pitch:-10},
  goblet_squat:{rot:38,pitch:-9},      kb_front_squat:{rot:38,pitch:-9},
  double_front_squat:{rot:36,pitch:-9},reverse_lunge:{rot:40,pitch:-10},
  split_squat:{rot:40,pitch:-10},
  overhead_press:{rot:30,pitch:-6},    push_press:{rot:30,pitch:-6},
  kb_thruster:{rot:32,pitch:-7},       kb_clean:{rot:28,pitch:-6},
  kb_snatch:{rot:26,pitch:-6},         kb_high_pull:{rot:28,pitch:-6},
  one_arm_row:{rot:34,pitch:-8},       bent_over_row:{rot:34,pitch:-8},
  gorilla_row:{rot:38,pitch:-10},      renegade_row:{rot:26,pitch:-9},
  /* Side on. The whole point of these is the straight line from head to heels,
     and a three-quarter view looking down the body turns that line into a
     diagonal smear across the frame. */
  push_up:{rot:14,pitch:-6},           plank:{rot:11,pitch:-4},
  mountain_climber:{rot:17,pitch:-6}, kb_floor_press:{rot:20,pitch:-7},
  kb_sit_up:{rot:36,pitch:-12},        hollow_hold:{rot:36,pitch:-12},
  turkish_getup:{rot:34,pitch:-12},    farmer_carry:{rot:26,pitch:-6},
  suitcase_carry:{rot:26,pitch:-6},    kb_halo:{rot:32,pitch:-7},
  arm_circles:{rot:30,pitch:-7},       shoulder_pass:{rot:30,pitch:-7},
  jumping_jacks:{rot:28,pitch:-7},     march:{rot:30,pitch:-8},
  bw_squat:{rot:38,pitch:-9},          bw_hinge:{rot:24,pitch:-6},
  cat_cow:{rot:30,pitch:-14},
  burpee:{rot:40,pitch:-14},           goblet_clean:{rot:26,pitch:-6},
  front_rack_lunge:{rot:40,pitch:-10}, goblet_cluster:{rot:34,pitch:-8}};
function camFor(move, moveId){
  const a = CAM_ANGLE[moveId];
  return { rot: a ? a.rot : (move.cam||20), pitch: a ? a.pitch : 0 };
}
function project(p){
  const r=CAM.rot*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
  const rx=p.x*c+(p.z||0)*s;
  let ry=p.y, rz=-p.x*s+(p.z||0)*c;
  const q=(CAM.pitch||0)*Math.PI/180;
  if(q){ const cq=Math.cos(q), sq=Math.sin(q);
    const y2=ry*cq-rz*sq, z2=ry*sq+rz*cq; ry=y2; rz=z2; }
  const zc=rz+CAM.z, S=CAM.base*(CAM.z/zc);
  return { x:CAM.cx+rx*S, y:CAM.groundY+(ry-CAM.groundLocal)*S, z:zc, s:S };
}
const ORIGIN = { x:100, y:140 };           // pose-space point placed at the canvas centre
function rel(p){ return { x:p.x-ORIGIN.x, y:p.y-ORIGIN.y, z:p.z||0 }; }

/* The camera frames itself. The old fit did the trigonometry by hand and
   assumed the camera never tilted, so it could not survive an elevation angle.
   This one projects the whole clip at unit scale and solves for the scale and
   offset that fill the canvas — correct for any camera, and shorter. */
const CAM_FIT = {};
function applyCameraFit(moveId, move, ctx, mirrored){
  if(!ctx) return;
  const W=ctx.canvas.width, H=ctx.canvas.height;
  const cam = camFor(move, moveId);
  if(mirrored) cam.rot = -cam.rot;
  const key = moveId+'@'+W+'x'+H+'@'+(mirrored?'m':'n');
  let f = CAM_FIT[key];
  if(!f){
    CAM.rot=cam.rot; CAM.pitch=cam.pitch; CAM.base=1; CAM.cx=0; CAM.groundY=0;
    let a=1e9,b=-1e9,c=1e9,d=-1e9, seen=false;
    for(let i=0;i<=16;i++){
      let ps; try{ ps = move.pose(sampleKeys(move.keys, i/16, move.linear)); }catch(e){ continue; }
      const pts=[ps.hip,ps.shoulder,ps.head];
      ps.legs.forEach(l=>pts.push(l.hip,l.knee,l.ankle));
      ps.arms.forEach(x=>pts.push(x.shoulder,x.elbow,x.hand));
      (ps.bells||[]).forEach(x=>pts.push(x));
      pts.forEach(p=>{ const q=project(rel(p)); seen=true;
        if(q.x<a)a=q.x; if(q.x>b)b=q.x; if(q.y<c)c=q.y; if(q.y>d)d=q.y; });
    }
    if(!seen){ f={base:2.62,cx:W/2,groundY:H/2}; }
    else {
      const base=Math.min((W-46)/Math.max(1,b-a),(H-52)/Math.max(1,d-c));
      f={ base, cx: W/2-((a+b)/2)*base, groundY: H/2-((c+d)/2)*base };
    }
    CAM_FIT[key]=f;
  }
  CAM.rot=cam.rot; CAM.pitch=cam.pitch;
  CAM.base=f.base; CAM.cx=f.cx; CAM.groundY=f.groundY;
}

/* ===========================================================================
   TWO-BONE IK IN THREE DIMENSIONS

   The app solves every elbow and knee inside the side-on plane. For a squat
   that is right. For a bench press it is badly wrong: at the bottom the hand
   is about 16 units from the shoulder while the arm is 56 long, so the only
   place a sagittal solver can put the elbow is 27 units toward the head or
   the feet. That is the broken bend — the elbow of a real bench press goes
   OUT to the side, which is a direction the plane does not contain.

   So: solve along the real bone vector and push the joint out along a hint
   direction, orthogonalised against it. The hint is where that joint is
   supposed to travel — sideways for a press, back and out for a push-up.
   =========================================================================== */
function ik3(a, b, l1, l2, hint){
  const az=a.z||0, bz=b.z||0;
  let d={x:b.x-a.x, y:b.y-a.y, z:bz-az};
  let L=Math.hypot(d.x,d.y,d.z);
  const maxL=l1+l2-0.5;
  if(L>maxL){ const k=maxL/L; d.x*=k; d.y*=k; d.z*=k; L=maxL; }
  if(L<0.001){ d={x:0,y:0.001,z:0}; L=0.001; }
  const u={x:d.x/L, y:d.y/L, z:d.z/L};
  const along=(L*L+l1*l1-l2*l2)/(2*L);
  const out=Math.sqrt(Math.max(0, l1*l1-along*along));
  // The hint says which way the joint bulges. What actually gets used is the
  // part of it PERPENDICULAR to the bone — so a hint that lies along the bone,
  // or straight against it, leaves almost nothing to work with and the little
  // that is left changes sign as the limb sweeps past. That is the elbow
  // snapping through backwards. Guard it: when the hint collapses, fall back
  // to a perpendicular built from the bone and world up, blended in smoothly
  // so the joint slides rather than jumps.
  let p={x:hint.x, y:hint.y, z:hint.z};
  const hl=Math.hypot(p.x,p.y,p.z)||1; p.x/=hl; p.y/=hl; p.z/=hl;
  const dot=p.x*u.x+p.y*u.y+p.z*u.z;
  p.x-=u.x*dot; p.y-=u.y*dot; p.z-=u.z*dot;
  let pl=Math.hypot(p.x,p.y,p.z);
  const SAFE=0.40;
  if(pl<SAFE){
    let f={x:0,y:-1,z:0};                      // world up
    let fd=f.x*u.x+f.y*u.y+f.z*u.z;
    f={x:f.x-u.x*fd, y:f.y-u.y*fd, z:f.z-u.z*fd};
    let fl=Math.hypot(f.x,f.y,f.z);
    if(fl<1e-3){ f={x:0,y:0,z:1}; fl=1; }
    f.x/=fl; f.y/=fl; f.z/=fl;
    if(f.x*p.x+f.y*p.y+f.z*p.z < 0){ f.x=-f.x; f.y=-f.y; f.z=-f.z; }  // keep the side
    const w=pl/SAFE;                            // 0 = collapsed, 1 = fine
    p={x:p.x+f.x*(1-w)*SAFE, y:p.y+f.y*(1-w)*SAFE, z:p.z+f.z*(1-w)*SAFE};
    pl=Math.hypot(p.x,p.y,p.z)||1;
  }
  p.x/=pl; p.y/=pl; p.z/=pl;
  return { x:a.x+u.x*along+p.x*out, y:a.y+u.y*along+p.y*out, z:az+u.z*along+p.z*out };
}
/* A knee always ends up on the side away from the floor; pick that solution
   instead of guessing a bend sign per rig. */
function kneeFor(hip, ankle){
  const up=ik3(hip, ankle, RIG.thigh, RIG.shin, {x:1,y:-1,z:0});
  const dn=ik3(hip, ankle, RIG.thigh, RIG.shin, {x:-1,y:1,z:0});
  return up.y<=dn.y ? up : dn;
}


/* -------------------------------- RENDERER -------------------------------- */
/* Reached through drawFigure(). The body is built from anatomical outlines
   sampled along each bone and unioned into one silhouette — no joint
   spheres, which is what made the old figure read as assembled parts. */
/* Load colour: amber at light effort through to red at maximal. Used by the
   figure and by the muscle chips, so it lives with the renderer. */
function loadRGB(v){
  const t=Math.max(0,Math.min(1,(v-0.3)/0.7));
  const c1=[238,154,76], c2=[226,64,70];
  return c1.map((a,i)=>Math.round(a+(c2[i]-a)*t));
}
function rgbStr(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(a==null?1:a)+')'; }
function loadColor(v){ return rgbStr(loadRGB(v)); }

/* ------------------------------ shading kit ------------------------------- */
const LIGHT=(()=>{const v={x:-0.52,y:-0.70,z:0.49};
  const m=Math.hypot(v.x,v.y,v.z);return{x:v.x/m,y:v.y/m,z:v.z/m};})();
function toRGB(c){if(Array.isArray(c))return c;
  if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
  const m=c.match(/-?\d+(\.\d+)?/g)||[0,0,0];return[+m[0],+m[1],+m[2]];}
function mix(a,b,t){const p=toRGB(a),q=toRGB(b);
  const f=i=>Math.round(p[i]+(q[i]-p[i])*t);return 'rgb('+f(0)+','+f(1)+','+f(2)+')';}
function depthTint(z){const t=Math.max(0,Math.min(1,(0.5-z/46)));
  return {col:mix('#E2E9F2','#6E7E93',t*0.58), dim:1-t*0.16};}
function formGradient(ctx,px,py,nx,ny,r,col){
  const g=ctx.createLinearGradient(px+nx*r,py+ny*r,px-nx*r,py-ny*r);
  const a=nx*LIGHT.x+ny*LIGHT.y, b=LIGHT.z;
  const lit=mix(col,'#FFFFFF',0.50), sh=mix(col,'#101825',0.68);
  for(let i=0;i<=8;i++){
    const u=-1+i/4;
    const lam=Math.max(0,u*a+Math.sqrt(Math.max(0,1-u*u))*b);
    let c=mix(sh,lit,Math.min(1,0.28+0.72*Math.pow(lam,0.9)));
    const rim=Math.pow(Math.abs(u),7)*(u*a<0?0.52:0.16);
    if(rim>0.01) c=mix(c,'#93B6EF',rim);
    g.addColorStop(i/8,c);
  }
  return g;
}

/* ===========================================================================
   THE HUMAN FIGURE

   Each part is a closed outline sampled along its bone with a width profile,
   so a limb is thick where the muscle belly is and thin at the joint. No
   joint spheres at all: the parts overlap and the union is taken, which is
   what stops it reading as something assembled from components.
   =========================================================================== */
function smoothClosed(ctx, pts){
  if(pts.length<3) return;
  ctx.beginPath();
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let prev=pts[pts.length-1], m0=mid(prev,pts[0]);
  ctx.moveTo(m0[0],m0[1]);
  for(let i=0;i<pts.length;i++){
    const cur=pts[i], next=pts[(i+1)%pts.length], m=mid(cur,next);
    ctx.quadraticCurveTo(cur[0],cur[1],m[0],m[1]);
  }
  ctx.closePath();
}
/* profile: [[t, halfWidth], ...] from a to b, in rig units */
function partPoly(ctx, a, b, profile, capA, capB){
  const pa=project(rel(a)), pb=project(rel(b));
  const dx=pb.x-pa.x, dy=pb.y-pa.y, L=Math.hypot(dx,dy)||1;
  const nx=-dy/L, ny=dx/L;
  const left=[], right=[];
  profile.forEach(([t,w])=>{
    const s=pa.s+(pb.s-pa.s)*t, ww=Math.max(1.2,w*s);
    const px=pa.x+dx*t, py=pa.y+dy*t;
    left.push([px+nx*ww, py+ny*ww]);
    right.push([px-nx*ww, py-ny*ww]);
  });
  const ux=dx/L, uy=dy/L;
  const wA=Math.max(1.2,profile[0][1]*pa.s);
  const wB=Math.max(1.2,profile[profile.length-1][1]*pb.s);
  const pts=[];
  pts.push.apply(pts,left);
  if(capB!==false) pts.push([pb.x+ux*wB*0.32, pb.y+uy*wB*0.32]);
  for(let i=right.length-1;i>=0;i--) pts.push(right[i]);
  if(capA!==false) pts.push([pa.x-ux*wA*0.32, pa.y-uy*wA*0.32]);
  smoothClosed(ctx,pts);
  return {nx,ny,pa,pb,L};
}
const PROFILE={
  upperArm:[[0,9.5],[0.14,8.5],[0.45,6.6],[0.78,5.3],[1,4.8]],   // deltoid cap, then taper
  forearm :[[0,5.3],[0.20,5.9],[0.58,4.5],[1,3.7]],              // belly under the elbow
  thigh   :[[0,12.2],[0.26,11.0],[0.66,8.4],[1,7.0]],
  shin    :[[0,7.6],[0.18,8.2],[0.55,5.6],[1,4.5]],              // calf sits high
  torso   :[[0,14.6],[0.15,14.1],[0.34,12.8],[0.62,10.9],[0.86,11.7],[1,12.3]], // shoulders → chest → waist → hips
  neck    :[[0,5.9],[1,4.6]]};
/* Which way the figure faces is a property of the EXERCISE, not of the frame.
   Deciding it per frame is why the feet flipped mid-rep: during a swing the
   hands pass from behind the shoulder to in front of it, the sign flips, and
   both feet snap round. Measure it once over the whole clip instead. */
const FACE={};
function facingFor(id, mv){
  if(FACE[id]!=null) return FACE[id];
  let knee=0, hand=0;
  for(let i=0;i<=12;i++){
    const ps=mv.pose(sampleKeys(mv.keys,i/12,mv.linear));
    knee += ps.legs[1].knee.x - ps.legs[1].ankle.x;
    hand += (ps.arms[0].hand.x+ps.arms[1].hand.x)/2 - ps.shoulder.x;
  }
  const f = Math.abs(knee)>10 ? Math.sign(knee)
          : Math.abs(hand)>10 ? Math.sign(hand) : 1;
  return FACE[id]= f||1;
}
/* A hand and a foot are small but they are what stop a figure from looking
   like it is hanging on a wire. */
function handPoly(ctx, wrist, elbow, z){
  const pw=project(rel(wrist)), pe=project(rel(elbow));
  let dx=pw.x-pe.x, dy=pw.y-pe.y; const L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, nx=-uy, ny=ux, s=pw.s;
  const len=9.5*s, w=4.0*s;
  const p=(a,b)=>[pw.x+ux*a+nx*b, pw.y+uy*a+ny*b];
  smoothClosed(ctx,[p(-1.5,w*0.85),p(len*0.55,w),p(len,w*0.55),p(len*1.05,0),
                    p(len,-w*0.55),p(len*0.55,-w),p(-1.5,-w*0.85)]);
  const c=p(len*0.45,0);
  return {cx:c[0], cy:c[1], r:Math.max(len,w)*0.75};
}
/* A foot is not a horizontal wedge with a special case for the floor. It sits
   perpendicular to the shin and points the way the body faces — which gives a
   flat foot when the shin is vertical, tucked toes when the shin is horizontal
   in a push-up, and something sensible for everything in between, with no flag
   to get wrong. */
function footPoly(ctx, ankle, knee, face){
  const sx=ankle.x-knee.x, sy=ankle.y-knee.y;          // down the shin
  const sl=Math.hypot(sx,sy)||1, ux=sx/sl, uy=sy/sl;
  let fx=face, fy=0;                                    // forward, in world
  const d=fx*ux+fy*uy; fx-=ux*d; fy-=uy*d;
  let fl=Math.hypot(fx,fy);
  if(fl<0.12){ fx=-uy*face; fy=ux*face; fl=1; }         // shin already points forward
  fx/=fl; fy/=fl;
  const upright=Math.abs(uy);                           // 1 = standing, 0 = shin flat
  const len=9+8*upright, hi=3.2+1.8*upright;
  const tip=project(rel({x:ankle.x+fx*len, y:ankle.y+fy*len, z:ankle.z||0}));
  const pa=project(rel(ankle)), s0=pa.s;
  let tx=tip.x-pa.x, ty=tip.y-pa.y; const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
  const nx=-ty, ny=tx, toe=tl, heel=5.5*s0, h=hi*s0;
  const P=(along,up)=>[pa.x+tx*along+nx*up, pa.y+ty*along+ny*up];
  smoothClosed(ctx,[P(-heel,h*0.4),P(toe*0.4,h*0.8),P(toe*0.9,h*0.45),
                    P(toe,0),P(toe*0.9,-h*0.45),P(toe*0.4,-h*0.8),P(-heel,-h*0.4)]);
  const c=P(toe*0.35,0);
  return {cx:c[0], cy:c[1], r:Math.max(toe,h)*0.8};
}
/* Measured, no head in the app sits on backwards — the spine test passes for
   every exercise. What was missing is that an egg has no front. A skull that
   is flat at the back and carries a brow and a chin at the front tells you
   instantly which way the person is looking, and that is what reads as the
   head being on the right way round. */
function headPoly(ctx, head, shoulder, face){
  const ph=project(rel(head)), ps=project(rel(shoulder));
  let dx=ph.x-ps.x, dy=ph.y-ps.y; const L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, s=ph.s;
  // which way is "in front", in screen space, once the neck axis is removed
  const ahead=project(rel({x:head.x+(face||1)*10, y:head.y, z:head.z||0}));
  let fx=ahead.x-ph.x, fy=ahead.y-ph.y;
  const fd=fx*ux+fy*uy; fx-=ux*fd; fy-=uy*fd;
  let fl=Math.hypot(fx,fy); if(fl<0.001){ fx=-uy; fy=ux; fl=1; }
  fx/=fl; fy/=fl;
  const ry=10.6*s, rx=8.2*s;
  // a: along the neck (+ = crown, - = jaw), b: front(+) to back(-)
  const P=(a,b)=>[ph.x+ux*a+fx*b, ph.y+uy*a+fy*b];
  smoothClosed(ctx,[
    P( ry*0.90,  rx*0.18),   // crown, a touch forward
    P( ry*0.42,  rx*0.86),   // brow
    P(-ry*0.18,  rx*0.98),   // cheek
    P(-ry*0.72,  rx*0.60),   // chin
    P(-ry*0.92, -rx*0.10),   // under the jaw
    P(-ry*0.52, -rx*0.72),   // back of the jaw
    P( ry*0.20, -rx*0.80),   // flat occiput
    P( ry*0.78, -rx*0.42),
  ]);
  return {cx:ph.x, cy:ph.y, r:Math.max(ry,rx)};
}
function humanParts(pose, faceIn){
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:((a.z||0)+(b.z||0))/2});
  const face=(faceIn!=null?faceIn:1);
  const P=[];
  const add=(z,draw)=>P.push({z,draw});
  pose.legs.forEach((lg,i)=>{
    const k=i===1?1:0.94, z=(lg.knee.z||0);
    add(mid(lg.hip,lg.knee).z, ctx=>({r:partPoly(ctx,lg.hip,lg.knee,
      PROFILE.thigh.map(([t,w])=>[t,w*k]))}));
    add(mid(lg.knee,lg.ankle).z, ctx=>({r:partPoly(ctx,lg.knee,lg.ankle,
      PROFILE.shin.map(([t,w])=>[t,w*k]))}));
    add(z-0.5, ctx=>({c:footPoly(ctx,lg.ankle,lg.knee,face)}));
  });
  add(mid(pose.hip,pose.shoulder).z, ctx=>({r:partPoly(ctx,pose.shoulder,pose.hip,PROFILE.torso)}));
  // three quarters of the way, so the neck always meets the skull instead of
  // stopping halfway and leaving the head floating
  add((pose.head.z||0)+0.2, ctx=>({r:partPoly(ctx,pose.shoulder,
    {x:pose.shoulder.x+(pose.head.x-pose.shoulder.x)*0.74,
     y:pose.shoulder.y+(pose.head.y-pose.shoulder.y)*0.74,
     z:(pose.shoulder.z||0)+((pose.head.z||0)-(pose.shoulder.z||0))*0.74},PROFILE.neck)}));
  add((pose.head.z||0), ctx=>({c:headPoly(ctx,pose.head,pose.shoulder,face)}));
  pose.arms.forEach((ar,i)=>{
    const k=i===1?1:0.94;
    add(mid(ar.shoulder,ar.elbow).z, ctx=>({r:partPoly(ctx,ar.shoulder,ar.elbow,
      PROFILE.upperArm.map(([t,w])=>[t,w*k]))}));
    add(mid(ar.elbow,ar.hand).z, ctx=>({r:partPoly(ctx,ar.elbow,ar.hand,
      PROFILE.forearm.map(([t,w])=>[t,w*k]))}));
    add((ar.hand.z||0)-0.5, ctx=>({c:handPoly(ctx,ar.hand,ar.elbow)}));
  });
  return P;
}
const SCRATCH={};
function scratch(ctx,slot){
  const k=slot+'|'+ctx.canvas.width+'x'+ctx.canvas.height;
  let c=SCRATCH[k];
  if(!c){c=SCRATCH[k]=document.createElement('canvas');
    c.width=ctx.canvas.width;c.height=ctx.canvas.height;}
  return c;
}
function unionOf(ctx,parts){
  const c=scratch(ctx,'mask'), o=c.getContext('2d');
  o.setTransform(1,0,0,1,0,0); o.globalCompositeOperation='source-over';
  o.clearRect(0,0,c.width,c.height); o.fillStyle='#FFF';
  parts.forEach(p=>{ p.draw(o); o.fill(); });
  return c;
}
function rimFrom(ctx,mask,px,colour){
  const c=scratch(ctx,'rim'), t=c.getContext('2d');
  t.setTransform(1,0,0,1,0,0); t.globalCompositeOperation='source-over';
  t.clearRect(0,0,c.width,c.height);
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
    t.drawImage(mask,Math.cos(a)*px,Math.sin(a)*px);}
  t.globalCompositeOperation='source-in';
  t.fillStyle=colour; t.fillRect(0,0,c.width,c.height);
  t.globalCompositeOperation='source-over';
  ctx.drawImage(c,0,0);
}
function drawHuman(ctx,pose,opts){
  const o=opts||{};
  if(pose.bench) drawBench(ctx,pose.bench);
  const parts=humanParts(pose, o.face);
  rimFrom(ctx, unionOf(ctx,parts), 2.0, 'rgba(146,182,238,0.58)');
  parts.slice().sort((a,b)=>b.z-a.z).forEach(p=>{
    const {col,dim}=depthTint(p.z);
    const out=p.draw(ctx);
    ctx.save(); ctx.globalAlpha=dim;
    if(out && out.r){
      const {nx,ny,pa,L}=out.r;
      ctx.fillStyle=formGradient(ctx,pa.x,pa.y,nx,ny,Math.max(6,L*0.18),col);
    } else if(out && out.c){
      // head, hands and feet are lumps, not cylinders: light them from a point
      const {cx,cy,r}=out.c;
      const g=ctx.createRadialGradient(cx+LIGHT.x*r*0.5, cy+LIGHT.y*r*0.5, r*0.06, cx, cy, r*1.15);
      g.addColorStop(0, mix(col,'#FFFFFF',0.50));
      g.addColorStop(0.45, mix(col,'#FFFFFF',0.06));
      g.addColorStop(1, mix(col,'#101825',0.56));
      ctx.fillStyle=g;
    } else { ctx.fillStyle=mix(col,'#FFFFFF',0.1); }
    ctx.fill(); ctx.restore();
  });
  const hands=pose.arms.map(a=>a.hand);
  (pose.bells||[]).forEach(bp=>{
    let near=null,best=1e9;
    hands.forEach(h=>{const d=Math.hypot(h.x-bp.x,h.y-bp.y);if(d<best){best=d;near=h;}});
    drawBell(ctx,bp,near);
  });
  if(pose.bar) drawBar(ctx,pose.bar);
  if(pose.band) drawResistanceBand(ctx,pose.band,hands);
  if(o.muscle && pose.load) muscleWash(ctx,pose);
}
function muscleWash(ctx,pose){
  ctx.save(); ctx.globalCompositeOperation='source-atop';
  Object.keys(pose.load).forEach(key=>{
    const v=pose.load[key]; if(!(v>0.28)) return;
    muscleBands(pose,key).forEach(bd=>{
      const a=project(rel(bd.a)), b=project(rel(bd.b));
      const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
      const nx=-dy/L, ny=dx/L, w=Math.max(2.4,bd.w*a.s*1.5);
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, c=loadRGB(v);
      ctx.beginPath(); ctx.moveTo(a.x,a.y);
      ctx.quadraticCurveTo(mx+nx*w,my+ny*w,b.x,b.y);
      ctx.quadraticCurveTo(mx-nx*w,my-ny*w,a.x,a.y); ctx.closePath();
      const g=ctx.createLinearGradient(mx-nx*w,my-ny*w,mx+nx*w,my+ny*w);
      g.addColorStop(0,'rgba('+c+',0)');
      g.addColorStop(0.5,'rgba('+c+','+(0.30+0.5*v)+')');
      g.addColorStop(1,'rgba('+c+',0)');
      ctx.fillStyle=g; ctx.fill();
    });
  });
  ctx.restore();
}

/* ----------------------------- shared scenery ----------------------------- */
function drawGround(ctx){
  const y=RIG.groundY, x0=-160,x1=340,z0=-170,z1=170,st=34;
  ctx.save(); ctx.lineWidth=1;
  for(let x=x0;x<=x1;x+=st){
    const a=project(rel({x,y,z:z0})), b=project(rel({x,y,z:z1}));
    ctx.strokeStyle='rgba(96,128,175,0.14)';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  for(let z=z0;z<=z1;z+=st){
    const a=project(rel({x:x0,y,z})), b=project(rel({x:x1,y,z}));
    ctx.strokeStyle='rgba(96,128,175,'+(0.07+0.13*(1-Math.min(1,Math.abs(z)/z1)))+')';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  ctx.restore();
}
/* A bench is a padded slab with thickness, sat on two uprights — drawn as a
   flat rectangle it reads as a sheet of paper the body hovers over. */
function drawBench(ctx,bn){
  const Z=21, TH=7;
  const P=(x,y,z)=>project(rel({x,y,z}));
  const quad=(pts,fill,stroke)=>{
    ctx.beginPath(); pts.forEach((q,i)=> i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));
    ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.1;ctx.stroke();}
  };
  ctx.save();
  // uprights first, so the pad sits in front of them
  [[bn.x0+16],[bn.x1-16]].forEach(([x])=>{
    [-1,1].forEach(sg=>{
      const t=P(x,bn.y+TH,sg*Z*0.72), f=P(x+sg*0,bn.ground,sg*Z*0.95);
      ctx.strokeStyle='#212A36'; ctx.lineWidth=Math.max(2.4,6*t.s); ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(f.x,f.y);ctx.stroke();
    });
    const a=P(x,bn.ground,-Z*0.95), b=P(x,bn.ground,Z*0.95);
    ctx.strokeStyle='#18202A'; ctx.lineWidth=Math.max(2.4,6*a.s);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  });
  // pad: near side wall, then the top face
  quad([P(bn.x0,bn.y,Z),P(bn.x1,bn.y,Z),P(bn.x1,bn.y+TH,Z),P(bn.x0,bn.y+TH,Z)],'#141B24');
  quad([P(bn.x0,bn.y+TH,-Z),P(bn.x1,bn.y+TH,-Z),P(bn.x1,bn.y+TH,Z),P(bn.x0,bn.y+TH,Z)],'#10161E');
  const a=P(bn.x0,bn.y,-Z), c=P(bn.x1,bn.y,Z);
  const g=ctx.createLinearGradient(a.x,a.y,c.x,c.y);
  g.addColorStop(0,'#39445408'.slice(0,7)); g.addColorStop(0,'#394454');
  g.addColorStop(1,'#222B37');
  quad([P(bn.x0,bn.y,-Z),P(bn.x1,bn.y,-Z),P(bn.x1,bn.y,Z),P(bn.x0,bn.y,Z)],g,'rgba(130,160,205,0.30)');
  ctx.restore();
}
/* A loaded bar: the shaft runs across the body, the plates sit at the ends. */
function drawBar(ctx,bar){
  const P=(z)=>project(rel({x:bar.x,y:bar.y,z}));
  const a=P(-bar.half), b=P(bar.half);
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, ang=Math.atan2(uy,ux);
  ctx.save(); ctx.lineCap='butt';
  // knurled shaft, with a brighter top edge so it reads as a round bar
  ctx.strokeStyle='#4A5464'; ctx.lineWidth=Math.max(2.6,5.0*a.s);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  ctx.strokeStyle='#9AA6B5'; ctx.lineWidth=Math.max(1.0,1.9*a.s);
  ctx.beginPath();ctx.moveTo(a.x-uy*1.2,a.y+ux*1.2);ctx.lineTo(b.x-uy*1.2,b.y+ux*1.2);ctx.stroke();
  // plates: a disc stands across the bar, so its long axis is perpendicular to
  // the bar as the camera sees it — an upright ellipse is what looked stuck on
  [-1,1].forEach(sg=>{
    for(let i=0;i<2;i++){
      const q=P(sg*(bar.half-6-i*7));
      const R=Math.max(5,(16-i*3)*q.s), TH=Math.max(1.6,3.2*q.s);
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(ang);
      const g=ctx.createLinearGradient(0,-R,0,R);
      g.addColorStop(0,'#5C6775'); g.addColorStop(0.45,'#2F3845'); g.addColorStop(1,'#151B23');
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,TH,R,0,0,7); ctx.fill();
      ctx.strokeStyle='rgba(150,175,215,0.35)'; ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
    }
  });
  ctx.restore();
}
/* A band shows its own load: slack it sags and sits thick, stretched it goes
   straight, thins, and warms up. No extra graphic needed to say "harder". */
function drawResistanceBand(ctx,band,hands){
  const A=project(rel(band.anchor));
  ctx.save(); ctx.lineCap='round';
  hands.forEach(h=>{
    const H=project(rel(h));
    const t=Math.max(0,Math.min(1,band.tension));
    const mx=(A.x+H.x)/2, my=(A.y+H.y)/2 + (1-t)*34*A.s*0.4;
    const col=[[90,140,235],[240,164,60]];
    const c=col[0].map((v,i)=>Math.round(v+(col[1][i]-v)*t));
    ctx.strokeStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.lineWidth=Math.max(1.6,(4.0-1.6*t)*A.s);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,H.x,H.y); ctx.stroke();
  });
  const r=Math.max(3,5*A.s);
  ctx.fillStyle='#2A3340'; ctx.beginPath(); ctx.arc(A.x,A.y,r,0,7); ctx.fill();
  ctx.strokeStyle='rgba(140,176,236,0.5)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.restore();
}
function drawBell(ctx,bp,near){
  const q=project(rel(bp)), r=Math.max(4,9.0*q.s);
  let ux=0,uy=1;
  if(near){const h=project(rel(near));const dx=q.x-h.x,dy=q.y-h.y,L=Math.hypot(dx,dy);
    if(L>0.8){ux=dx/L;uy=dy/L;}}
  ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.atan2(uy,ux)-Math.PI/2);
  ctx.lineCap='round';ctx.strokeStyle='#39424F';ctx.lineWidth=r*0.34;
  ctx.beginPath();ctx.arc(0,-r*0.22,r*0.66,Math.PI*1.08,Math.PI*1.92);ctx.stroke();
  const g=ctx.createRadialGradient(-r*0.38,r*0.18,r*0.1,0,r*0.42,r*1.15);
  g.addColorStop(0,'#78838F');g.addColorStop(0.45,'#3A4250');g.addColorStop(1,'#171D26');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,r*0.42,r,0,7);ctx.fill();
  ctx.restore();
}
function shadow(ctx,pose){
  const pts = pose.kind==='prone' ? [pose.legs[1].ankle,pose.arms[1].hand]
            : pose.kind==='supine' ? [pose.hip,pose.legs[1].ankle]
            : pose.legs.map(l=>l.ankle);
  pts.forEach(c=>{
    const q=project(rel({x:c.x,y:RIG.groundY,z:c.z||0}));
    const lift=Math.max(0,(RIG.groundY-c.y))/40;
    const rx=(15+9*lift)*CAM.base;
    const g=ctx.createRadialGradient(q.x,q.y,1,q.x,q.y,rx);
    g.addColorStop(0,'rgba(0,0,0,'+(0.42-0.22*Math.min(1,lift))+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();
    ctx.ellipse(q.x,q.y,rx,Math.max(3,rx*0.2),0,0,7);ctx.fill();
  });
}

function drawFigure(ctx, pose, opts){
  const o = opts||{};
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
  drawGround(ctx);
  shadow(ctx,pose);
  drawHuman(ctx, pose, { muscle: o.bands!==false, face: o.face });
}

/* ============================================================================
   MOVES — one script per exercise. Pure data plus a small pose() function that
   composes primitives. No rendering here on purpose: these can be edited,
   reviewed against coaching cues, or migrated to another renderer on their own.

   Per key:
     t     position in the rep (0..1)
     cue   what the lifter should be doing at that moment
     load  which muscles are working and how hard (0..1), keyed to the app's
           own muscle vocabulary so the labels come from MUSCLE_LABELS
   Per move:
     cam   fixed camera angle — each movement has a plane it reads best in
     loop  'cycle' for ballistic work (a swing played backwards is not a swing)
           'pingpong' for grinds, with ecc = share of the rep spent lowering
     ms    duration of one full rep
   ============================================================================ */

function smoothstep(x){ return x*x*(3-2*x); }
function lerpPtObj(a,b,f){ return { x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f }; }

function sampleKeys(keys, p, linear){
  let i=0;
  for(let j=0;j<keys.length-1;j++){ if(p>=keys[j].t) i=j; }
  const a=keys[i], b=keys[Math.min(i+1,keys.length-1)];
  const span=(b.t-a.t)||1;
  const raw=Math.max(0,Math.min(1,(p-a.t)/span));
  const f= linear ? raw : smoothstep(raw);
  const out={};
  const names={};
  [a,b].forEach(k=>Object.keys(k).forEach(n=>{ if(typeof k[n]==='number' && n!=='t') names[n]=1; }));
  Object.keys(names).forEach(n=> out[n]=lerpN(a[n],b[n],f));
  // hand-authored joint sets (the get-up) interpolate point by point
  if(a.joints && b.joints){
    out.joints={};
    Object.keys(a.joints).forEach(n=>{ out.joints[n]=lerpPtObj(a.joints[n], b.joints[n]||a.joints[n], f); });
  }
  const load={}, la=a.load||{}, lb=b.load||{};
  Object.keys(la).concat(Object.keys(lb)).forEach(n=>{ load[n]=lerpN(la[n],lb[n],f); });
  out.load=load;
  out.cue=(f<0.55?a.cue:b.cue)||a.cue;
  out.keyIndex = f<0.5 ? i : Math.min(i+1,keys.length-1);
  return out;
}

/* helper: the free hand of a one-handed lift just hangs, rather than sitting at
   some arbitrary angle — that mismatch is what read as "arms going opposite ways" */
const freeHand = (sh)=> armHang(sh, 2);


/* A burpee is the one movement that starts upright and ends on the floor, and
   the rig keeps those in two separate builders. Blending their output frame by
   frame collapses the limbs, so the floor half gets its own chain: the hands
   stay planted, the shoulder rides a circle of one arm-length around them, the
   hip's DIRECTION from the shoulder sweeps from the tuck to the body line while
   its DISTANCE is pinned to the torso, and the legs are solved by IK to the
   travelling foot. Every bone therefore keeps its length through the kick-back,
   which a naive pose lerp does not. */
function burpeeFloor(u, push){
  const hand = { x:75, y:RIG.groundY };
  const a    = (36.5 - 28.5*u) * Math.PI/180;        // arm angle off vertical
  const lift = SOFT * (1 - 0.38*(push||0));          // elbows bend on the chest drop
  const sh   = { x: hand.x - lift*Math.sin(a), y: hand.y - lift*Math.cos(a) };
  const an   = { x: 52 - 95*u, y: RIG.groundY-3 };

  /* The hip's DIRECTION from the shoulder sweeps from the tuck to the body
     line; its DISTANCE is always the torso, so the spine cannot stretch.
     The tuck direction is solved, not guessed: it is the one that leaves the
     hip 55 units from the planted foot, i.e. a knee at 91 degrees. */
  const d = { x:an.x-sh.x, y:an.y-sh.y }, L = Math.hypot(d.x,d.y)||1;
  const line = { x:d.x/L, y:d.y/L };
  const tuck = { x:-0.908, y:0.419 };
  let hx = tuck.x + (line.x-tuck.x)*u, hy = tuck.y + (line.y-tuck.y)*u;
  const hl = Math.hypot(hx,hy)||1; hx/=hl; hy/=hl;
  const hip  = { x: sh.x + hx*RIG.torso, y: sh.y + hy*RIG.torso };
  /* the neck continues the SPINE, not the body line — along the body line the
     head ends up pointing back at the hips in the tuck */
  const nk = (RIG.neck+RIG.headR*0.9)/RIG.torso;
  const head = { x: sh.x + (sh.x-hip.x)*nk, y: sh.y + (sh.y-hip.y)*nk };

  /* Both sides are solved, never nudged: shifting a joint by a few units to
     fake depth is what broke the upper arm by 14 percent. Depth is the z
     separation the builder already applies. */
  /* Both knee solutions are legal geometry; only one of them is legal anatomy.
     In the tuck the wrong one drives the knee 16 units through the floor, so
     the solution that sits higher on screen is the one that gets used. */
  const up = ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh,  1);
  const dn = ik2(an.x,an.y, hip.x,hip.y, RIG.shin,RIG.thigh, -1);
  const leg = up.joint.y <= dn.joint.y ? up : dn;
  const arm = ik2(sh.x,sh.y, hand.x,hand.y, RIG.upperArm,RIG.forearm, -1);
  return buildCustom({ noBell:true, joints:{
    hip, shoulder:sh, head,
    ankleB:an, kneeB:leg.joint, ankleF:an, kneeF:leg.joint,
    elbowB:arm.joint, handB:hand, elbowF:arm.joint, handF:hand }});
}

      {t:0.25, cue:'To the elbow — eyes on the bell',
       load:{shoulders:0.85, core:0.85, obliques:0.7, triceps:0.5},
       joints:{hip:{x:130,y:182}, shoulder:{x:95,y:150}, head:{x:76,y:130},
               ankleB:{x:205,y:188}, kneeB:{x:158,y:187}, ankleF:{x:158,y:187}, kneeF:{x:148,y:148},
               elbowB:{x:70,y:172}, handB:{x:50,y:186}, elbowF:{x:97,y:120}, handF:{x:99,y:92}}},
      {t:0.50, cue:'Tall sit — arm stays vertical',
       load:{shoulders:0.9, core:0.9, obliques:0.75, triceps:0.55},
       joints:{hip:{x:130,y:180}, shoulder:{x:108,y:118}, head:{x:98,y:96},
               ankleB:{x:205,y:188}, kneeB:{x:158,y:187}, ankleF:{x:158,y:187}, kneeF:{x:148,y:146},
               elbowB:{x:90,y:150}, handB:{x:66,y:182}, elbowF:{x:110,y:90}, handF:{x:112,y:62}}},
      {t:0.75, cue:'Bridge — hips high',
       load:{glutes:0.9, shoulders:0.85, core:0.8, hamstrings:0.6},
       joints:{hip:{x:122,y:140}, shoulder:{x:116,y:96}, head:{x:110,y:74},
               ankleB:{x:148,y:188}, kneeB:{x:148,y:168}, ankleF:{x:158,y:187}, kneeF:{x:148,y:142},
               elbowB:{x:106,y:122}, handB:{x:94,y:152}, elbowF:{x:118,y:68}, handF:{x:120,y:40}}},
      {t:1.00, cue:'Stand — bell locked overhead',
       load:{shoulders:0.95, quads:0.7, glutes:0.65, core:0.7, triceps:0.5},
       joints:{hip:{x:100,y:116}, shoulder:{x:102,y:71}, head:{x:104,y:52},
               ankleB:{x:92,y:190}, kneeB:{x:94,y:152}, ankleF:{x:112,y:190}, kneeF:{x:110,y:152},
               elbowB:{x:96,y:98}, handB:{x:92,y:124}, elbowF:{x:102,y:43}, handF:{x:102,y:15}}},
    ],
    /* Every joint here was typed by hand, and the bones did not survive it:
       the shin came out 20 units against a rig that says 38. The keyframes
       still decide the SHAPE — where the hip sits, where the feet and hands
       are, which way each joint folds — but the lengths are now enforced. The
       authored knee and elbow are kept only as a hint for which of the two
       legal solutions to take, so the pose still bends the way it was drawn. */
    pose(k){
      const j = k.joints, hip = j.hip;
      const along = (from, to, len) => {
        const dx=to.x-from.x, dy=to.y-from.y, L=Math.hypot(dx,dy)||1;
        return { x: from.x + dx/L*len, y: from.y + dy/L*len };
      };
      const sh   = along(hip, j.shoulder, RIG.torso);
      const head = along(sh, {x:sh.x+(sh.x-hip.x), y:sh.y+(sh.y-hip.y)}, RIG.neck+RIG.headR);
      const pick = (root, target, l1, l2, hint) => {
        const a = ik2(root.x,root.y, target.x,target.y, l1,l2,  1);
        const b = ik2(root.x,root.y, target.x,target.y, l1,l2, -1);
        const da = Math.hypot(a.joint.x-hint.x, a.joint.y-hint.y);
        const db = Math.hypot(b.joint.x-hint.x, b.joint.y-hint.y);
        /* A near-straight limb has two solutions that sit almost equally far
           from the hint, and the wrong one puts the knee through the floor. */
        const aOk = a.joint.y <= RIG.groundY+2, bOk = b.joint.y <= RIG.groundY+2;
        if(aOk !== bOk) return aOk ? a : b;
        return da<=db ? a : b;
      };
      const leg = (an, hint) => pick(an, hip, RIG.shin, RIG.thigh, hint);
      const arm = (hd, hint) => pick(sh, hd, RIG.upperArm, RIG.forearm, hint);
      const lB = leg(j.ankleB, j.kneeB), lF = leg(j.ankleF, j.kneeF);
      const aB = arm(j.handB,  j.elbowB), aF = arm(j.handF,  j.elbowF);
      return buildCustom({joints:{
        hip:hip, shoulder:sh, head:head,
        ankleB:j.ankleB, kneeB:lB.joint, ankleF:j.ankleF, kneeF:lF.joint,
        elbowB:aB.joint, handB:aB.end,   elbowF:aF.joint, handF:aF.end }});
    }},

const ELBOW_HINT = {
  // The halo is the one movement a hint cannot fully serve: the bell orbits
  // the head while the hands barely move, so the arm is folded tight and the
  // elbow swings a long way for almost no hand travel. A steady lateral hint
  // keeps it sane; doing it properly needs the elbow's swivel angle driven
  // directly, which belongs with the three-dimensional skeleton.
  one_arm_row:    ROW_HINT,
  bent_over_row:  ROW_HINT,
  gorilla_row:    ROW_HINT,
  kb_halo:        z => ({x: 0.28, y:-0.22, z: z*1.0}),
  shoulder_pass:  z => ({x: 0.00, y:-0.10, z: z*1.0}),   // same arc, warm-up version
  kb_thruster:    z => ({x: 0.35, y: 0.00, z: z*1.0}),   // stays under the bell
  renegade_row:   z => ({x:-0.40, y:-1.00, z: z*0.50}),  // drives back and up past the ribs
  turkish_getup:  z => ({x: 0.20, y:-0.30, z: z*1.0}),   // packed shoulder, elbow out
};
Object.keys(ELBOW_HINT).forEach(id=>{
  const mv=MOVES[id]; if(!mv) return;
  const inner=mv.pose.bind(mv), hint=ELBOW_HINT[id];
  mv.pose=function(k){
    const ps=inner(k);
    ps.arms=ps.arms.map(ar=>{
      const z=Math.sign(ar.hand.z||ar.shoulder.z||1);
      return { shoulder:ar.shoulder, hand:ar.hand,
               elbow: ik3(ar.shoulder, ar.hand, RIG.upperArm, RIG.forearm, hint(z, ps)) };
    });
    return ps;
  };
});




/* ============================================================================
   PLAYER — drives a move's script and paints it into the on-screen canvas.
   ============================================================================ */
const ANIM = { mounted:false, playing:true, raw:0, last:null, id:null, move:null, ctx:null, sig:'' };

function figureMarkup(sizeClass){
  return '<div class="fig-wrap'+(sizeClass?(' '+sizeClass):'')+'">'
       + '<canvas id="figCanvas" width="460" height="478"></canvas></div>';
}
/* Rep timing: lowering takes longer than lifting, the way a real set feels.
   Ballistic lifts loop FORWARD — a swing played backwards is not a swing. */
function phaseOf(move, raw){
  if(move.loop==='cycle') return raw%1;
  const m=raw%1, e=move.ecc||0.58;
  return m<e ? (m/e) : 1-((m-e)/(1-e));
}
function shortCue(cue){
  if(!cue) return '';
  const head = cue.split(' — ')[0];
  return head.length>16 ? head.slice(0,15)+'…' : head;
}
function animPhaseChips(exId){
  const mv = MOVES[exId];
  if(!mv) return '';
  return mv.keys.map((k,i)=>
    '<span class="phase-chip" id="phaseChip'+i+'" onclick="seekToPhase('+i+')">'+esc(shortCue(k.cue))+'</span>'
  ).join('');
}
function initExerciseAnimation(exId){
  const move = MOVES[exId];
  const cv = document.getElementById('figCanvas');
  if(!move || !cv) return;
  ANIM.id=exId; ANIM.move=move; ANIM.ctx=cv.getContext('2d');
  ANIM.playing=true; ANIM.raw=0; ANIM.last=null; ANIM.mounted=true; ANIM.sig='';
  renderAnimFrame(0);
  requestAnimationFrame(animTick);
}
function stopAnimation(){ ANIM.mounted=false; ANIM.ctx=null; ANIM.move=null; }
function toggleAnimPlay(){
  ANIM.playing=!ANIM.playing; ANIM.last=null;
  const b=document.getElementById('animPlayBtn'); if(b) b.innerHTML=ANIM.playing?ICON.pause:ICON.play;
  if(ANIM.playing) requestAnimationFrame(animTick);
}
function seekToPhase(i){
  if(!ANIM.move) return;
  ANIM.playing=false;
  const b=document.getElementById('animPlayBtn'); if(b) b.innerHTML=ICON.play;
  const k=ANIM.move.keys[i]; if(!k) return;
  renderAnimFrame(k.t);
}
function updatePhaseChipHighlight(idx){
  const n=(ANIM.move&&ANIM.move.keys.length)||0;
  for(let j=0;j<n;j++){
    const c=document.getElementById('phaseChip'+j);
    if(c) c.className='phase-chip'+(j===idx?' current':'');
  }
}
function animTick(ts){
  if(!ANIM.mounted) return;
  if(ANIM.last==null) ANIM.last=ts;
  const dt=ts-ANIM.last; ANIM.last=ts;
  if(ANIM.playing && ANIM.move){
    ANIM.raw += dt/(ANIM.move.ms||2400);
    renderAnimFrame(phaseOf(ANIM.move, ANIM.raw));
  }
  if(ANIM.mounted) requestAnimationFrame(animTick);
}
function renderAnimFrame(p){
  const move=ANIM.move;
  if(!move || !ANIM.ctx) return;
  // viewing this sagittal rig from the opposite side is exactly the other limb
  applyCameraFit(ANIM.id, move, ANIM.ctx, !!window._figureMirror);
  const k = sampleKeys(move.keys, p, move.linear);
  const pose = move.pose(k);
  pose.load = k.load;
  drawFigure(ANIM.ctx, pose, { face: facingFor(ANIM.id, move) });
  updatePhaseChipHighlight(k.keyIndex);
  updateAnimReadout(k);
}
function updateAnimReadout(k){
  const cueEl=document.getElementById('animCue');
  if(cueEl && cueEl.textContent!==k.cue) cueEl.textContent=k.cue;
  const box=document.getElementById('animMuscles');
  if(!box) return;
  const cap = box.classList.contains('mus-compact') ? 3 : 4;   // one row while training
  const active=Object.keys(k.load).filter(m=>k.load[m]>0.3)
                     .sort((a,b)=>k.load[b]-k.load[a]).slice(0,cap);
  const sig=active.map(m=>m+Math.round(k.load[m]*10)).join('|');
  if(sig===ANIM.sig) return;               // only touch the DOM when it changes
  ANIM.sig=sig;
  // No progress bars here. A row of part-filled bars beside a figure reads as
  // something loading, which is exactly the wrong signal during a set — the
  // chip itself carries the level, in its colour and its weight.
  box.innerHTML = active.map(m=>{
    const v=k.load[m], c=loadRGB(v);
    return '<div class="mus" style="border-color:rgba('+c+','+(0.30+0.5*v).toFixed(2)+');'
         + 'background:rgba('+c+','+(0.07+0.16*v).toFixed(2)+');">'
         + '<div class="mus-nm" style="color:'+loadColor(v)+';">'
         + esc(MUSCLE_LABELS[m]||m)+'</div></div>';
  }).join('');
}

  +'<div class="field"><label>Difficulty</label><div class="chip-row">'+['beginner','intermediate','advanced'].map(d=>'<div class="chip '+(GEN.difficulty===d?'selected':'')+'" onclick="GEN.difficulty=\''+d+'\';render()">'+d.charAt(0).toUpperCase()+d.slice(1)+'</div>').join('')+'</div></div>'
  +'<div class="field"><label>Format</label><div class="chip-row">'+['traditional','superset','emom','amrap'].map(f=>'<div class="chip '+(GEN.format===f?'selected':'')+'" onclick="GEN.format=\''+f+'\';render()">'+fmtLabel(f)+'</div></div>'.replace('</div></div>','</div>')).join('')+'</div></div>'
  +'<div class="field"><label>Equipment</label><div class="chip-row">'+['kettlebell','bodyweight'].map(f=>'<div class="chip '+(GEN.equipment===f?'selected':'')+'" onclick="GEN.equipment=\''+f+'\';render()">'+(f==='kettlebell'?'Kettlebell':'Bodyweight')+'</div>').join('')+'</div></div>'
  +'<button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="generateWorkout()">'+ICON.bolt+' Generate Workout</button>';
}
function generateWorkout(){
  const diffOrder={beginner:0,intermediate:1,advanced:2};
  let pool = EXERCISES.filter(e=> e.equipment.includes(GEN.equipment) && diffOrder[e.difficulty]<=diffOrder[GEN.difficulty]);
  if(GEN.goal==='conditioning') pool = pool.filter(e=>['power','squat','core'].includes(e.cat)).concat(pool.filter(e=>e.cat==='hinge'));
  if(GEN.goal==='build_muscle') pool = pool.filter(e=>['press','pull','squat','hinge'].includes(e.cat));
  if(!pool.length) pool = EXERCISES.filter(e=>e.equipment.includes(GEN.equipment));
  pool = shuffle(pool.slice());
  const count = GEN.format==='emom'||GEN.format==='amrap' ? Math.min(4,pool.length) : Math.min(Math.max(3,Math.round(GEN.duration/12)),5,pool.length);
  const chosen = pool.slice(0,count).map(e=>e.id);
  let workout;
  if(GEN.format==='traditional'){
    workout = {name:'Custom Workout', format:'traditional', warmupMin:8, mainMin:GEN.duration-8, blocks: chosen.map(id=>({ex:id,sets:3})), programId:null, programName:'Build My Workout', week:0, idx:0};
  } else if(GEN.format==='superset'){
    const pairs=[]; for(let i=0;i<chosen.length-1;i+=2) pairs.push([chosen[i],chosen[i+1]]);
    if(pairs.length===0) pairs.push([chosen[0], chosen[0]]);
    workout = {name:'Custom Workout', format:'superset', warmupMin:8, mainMin:GEN.duration-8, rounds:3, pairs, programId:null, programName:'Build My Workout', week:0, idx:0};
  } else if(GEN.format==='emom'){
    const pattern = chosen.slice();
    workout = {name:'Custom Workout', format:'emom', warmupMin:8, mainMin:GEN.duration-8, totalMinutes:GEN.duration-8, pattern, programId:null, programName:'Build My Workout', week:0, idx:0};
  } else {
    workout = {name:'Custom Workout', format:'amrap', warmupMin:8, mainMin:GEN.duration-8, totalMinutes:GEN.duration-8, round: chosen.map(id=>({ex:id,target:10})), programId:null, programName:'Build My Workout', week:0, idx:0};
  }
  attachWarmup(workout);           // a built workout gets the same warm-up as a programmed one
  workout.mainMin = Math.max(12, GEN.duration - workout.warmupMin);
  workout.totalMin = workout.warmupMin+workout.mainMin;
  startCustomWorkout(workout);
}
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
