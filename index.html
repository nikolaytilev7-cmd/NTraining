const PROG_BY_ID = Object.fromEntries(PROGRAMS.map(p=>[p.id,p]));

/* ============================= STORAGE ============================= */
const BUILD = '2026-09-25e';   // shown in Profile, so "did the update land?" has an answer
/* The brand is fixed; the category is the part that changes when the app
   grows past kettlebells. The storage key keeps its old name on purpose —
   renaming it would orphan every set already logged on the phone. */
const BRAND = { name:'NT Training', category:'Kettlebell' };
const STORE_KEY='ironbell_state_v1';
function defaultState(){
  return {
    onboardingComplete:false,
    profile:{name:'',goals:[],experience:'',inventory:[],days:3,duration:45,formats:[],units:'kg'},
    selectedProgramId:null,
    programProgress:{},
    exerciseLog:{},
    history:[],
    prs:{},
    savedExercises:[],
    workoutFeedback:[],
    lastSeenToast:null};
}
let STATE = defaultState();
function loadState(){
  // voice preference is restored right after the profile loads (see below)
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ STATE = Object.assign(defaultState(), JSON.parse(raw)); }
  }catch(e){ console.warn('Could not load state', e); STATE = defaultState(); }
  migrateUnloadedWeights();
  migrateRussianSwing();
  registerCustomPrograms();
  loadVoicePref();
  try{ applyTheme(); }catch(e){}
}
/* Older builds logged a bell against bodyweight movements. Those weights are
   removed and the records for those movements replayed, so a push-up stops
   counting 12 kg of volume per rep. Only the affected movements are touched. */
/* The old Russian Swing was the chest-height swing under a second name; its slot
   is now the overhead American Swing. Everything logged or planned as a Russian
   swing is the same movement as the Kettlebell Swing, so it moves there and the
   swing's records are replayed from the merged history. */
function migrateRussianSwing(){
  const raw = JSON.stringify(STATE);
  if(raw.indexOf('"russian_swing"') < 0) return;
  const oldPr = STATE.prs && STATE.prs.russian_swing;
  if(oldPr) delete STATE.prs.russian_swing;
  STATE = JSON.parse(JSON.stringify(STATE).split('"russian_swing"').join('"kb_swing"'));
  if(STATE.savedExercises) STATE.savedExercises = STATE.savedExercises.filter(function(v,i,a){ return a.indexOf(v)===i; });
  if(STATE.prs) delete STATE.prs.kb_swing;
  (STATE.history||[]).forEach(function(h){ if(h.exerciseId==='kb_swing' && !h.noPR){ delete h.isPR; updatePRs(h); } });
  saveState();
}
function migrateUnloadedWeights(){
  const hist = STATE.history || [];
  const fix = {};
  hist.forEach(function(h){
    const ex = EX_BY_ID[h.exerciseId];
    if(ex && !isLoaded(ex) && h.weight){ h.weight = null; fix[h.exerciseId] = 1; }
  });
  const ids = Object.keys(fix);
  if(!ids.length) return;
  ids.forEach(function(id){ if(STATE.prs) delete STATE.prs[id]; });
  hist.forEach(function(h){ if(fix[h.exerciseId]){ delete h.isPR; if(!h.noPR) updatePRs(h); } });
  saveState();
}
/* A save that fails silently is worse than no save: you log a whole session,
   the screen behaves normally, and the work is gone at the next reload. The
   failure is now recorded and surfaced, and the time of the last good save is
   kept so the app can say how far back your data actually goes. */
let SAVE_FAILED = null;
function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
    if(SAVE_FAILED){ SAVE_FAILED = null; render(); }
    try{ localStorage.setItem(STORE_KEY+'_at', new Date().toISOString()); }catch(e2){}
    return true;
  }catch(e){
    const full = e && (e.name==='QuotaExceededError' || e.code===22);
    SAVE_FAILED = full
      ? 'Storage is full. Export your history, then reset, or nothing new will be kept.'
      : 'This browser is refusing to store data \u2014 private browsing blocks it. Nothing you log here will survive a reload.';
    console.warn('Could not save state', e);
    try{ toast('Not saved \u2014 see Profile'); }catch(e3){}
    return false;
  }
}
function lastSavedAt(){ try{ return localStorage.getItem(STORE_KEY+'_at'); }catch(e){ return null; } }

/* ------------------------------ BACKUP ------------------------------ */
/* Everything lives in one browser key on one origin. Safari clears that key
   for sites left unvisited, so a fortnight away can take the lot. A file the
   person holds is the only backup that does not depend on this browser. */
const BACKUP_VERSION = 1;
function backupPayload(){
  return JSON.stringify({
    app:BRAND.name, version:BACKUP_VERSION, exportedAt:new Date().toISOString(),
    sets:(STATE.history||[]).length, state:STATE
  }, null, 2);
}
function exportData(){
  const name = 'nt-training-backup-'+todayISO()+'.json';
  const blob = new Blob([backupPayload()], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast('Backup saved \u00b7 '+(STATE.history||[]).length+' sets');
}
/* iOS sometimes swallows a download from a home-screen app, so the same data
   can be lifted as text and pasted anywhere. */
function copyBackup(){
  const txt = backupPayload();
  const done = function(){ toast('Backup copied \u2014 paste it somewhere safe'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
  } else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('Could not copy \u2014 use Export instead'); }
  ta.remove();
}
function pickBackupFile(){ const el=document.getElementById('restoreFile'); if(el) el.click(); }
function onBackupFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){ applyBackup(String(r.result)); input.value=''; };
  r.onerror = function(){ toast('Could not read that file'); input.value=''; };
  r.readAsText(f);
}
/* Merging, not replacing, is the default: restoring onto a phone that has
   trained since the backup must not throw those sessions away. Sets are keyed
   by their own id, so importing the same file twice changes nothing. */
function applyBackup(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ toast('That is not a backup file'); return; }
  const inc = data && data.state ? data.state : data;
  if(!inc || !Array.isArray(inc.history)){ toast('No training history in that file'); return; }
  const mine = new Set((STATE.history||[]).map(function(h){ return h.id || (h.date+'|'+h.exerciseId+'|'+h.result+'|'+h.weight); }));
  let added = 0;
  inc.history.forEach(function(h){
    const key = h.id || (h.date+'|'+h.exerciseId+'|'+h.result+'|'+h.weight);
    if(!mine.has(key)){ STATE.history.push(h); mine.add(key); added++; }
  });
  STATE.history.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  if(inc.programProgress) Object.keys(inc.programProgress).forEach(function(k){
    if(!STATE.programProgress[k]) STATE.programProgress[k] = inc.programProgress[k];
    else Object.assign(STATE.programProgress[k].completed, inc.programProgress[k].completed||{});
  });
  if(inc.profile && (!STATE.profile || !STATE.profile.name)) STATE.profile = inc.profile;
  if(Array.isArray(inc.customPrograms)){
    const have = new Set((STATE.customPrograms||[]).map(function(p){ return p.id; }));
    STATE.customPrograms = (STATE.customPrograms||[]).concat(inc.customPrograms.filter(function(p){ return p && p.id && !have.has(p.id); }));
    migrateRussianSwing();
    registerCustomPrograms();
  }
  if(inc.savedExercises) inc.savedExercises.forEach(function(id){
    if(STATE.savedExercises.indexOf(id)<0) STATE.savedExercises.push(id); });
  /* PRs are rebuilt from the merged history rather than copied, so they can
     never disagree with the sets that are actually there. */
  STATE.prs = {};
  STATE.history.forEach(function(h){ if(!h.noPR) updatePRs(h); });
  saveState(); render();
  toast(added ? ('Restored \u00b7 '+added+' new sets') : 'Already up to date \u2014 nothing new');
}
function progKey(id){ if(!STATE.programProgress[id]) STATE.programProgress[id] = {completed:{}}; return STATE.programProgress[id]; }

/* ============================= HELPERS ============================= */
function ico(svg, cls){ return '<span class="ico '+(cls||'')+'">'+svg+'</span>'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* Worded exactly as the option the reader picked, so the summary reads back
   their own answer rather than a re-phrasing of it. */
function goalLabel(g){ return {build_strength:'Build strength',build_muscle:'Build muscle',
  conditioning:'Improve conditioning',explosive:'Become more explosive',
  lose_fat:'Lose fat',general_fitness:'Improve overall fitness'}[g]||g; }
/* Three levels, matching the three levels a programme can have. The old
   fourth ("some experience") had nowhere to map: the scoring clamped it into
   the same slot as intermediate, so it changed nothing. A profile saved with
   it still loads — it reads as beginner. */
function expLabel(e){ return {beginner:'Beginner',some:'Beginner',intermediate:'Intermediate',advanced:'Advanced'}[e]||e; }
function fmtLabel(f){ return {traditional:'Straight Sets',superset:'Supersets',emom:'EMOM',
  amrap:'AMRAP',complex:'Complex',for_time:'For Time'}[f]||f; }
function difficultyBadgeClass(d){ return d==='beginner'?'badge-beginner':d==='advanced'?'badge-advanced':'badge-intermediate'; }
function fmtMMSS(totalSec){ const m=Math.floor(totalSec/60), s=totalSec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
/* The calendar date where you are, not in Greenwich: toISOString() is UTC, so a
   session at half past midnight in Sofia used to be filed under yesterday. */
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoLocal(new Date()); }
function dateMs(iso){ return new Date(iso+'T00:00:00').getTime(); }
const MON_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDay(iso){ const d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MON_ABBR[d.getMonth()]; }
function toast(msg){
  const old = document.getElementById('toastEl'); if(old) old.remove();
  const t = document.createElement('div'); t.id='toastEl'; t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2600);
}
function equipOwned(){
  const inv = STATE.profile.inventory||[];
  return { hasKettlebell: inv.length>0, weights: inv.slice().sort((a,b)=>a-b) };
}
/* A push-up is not done holding a bell. Movements whose equipment does not
   include one never get a weight — before this they were handed the lightest
   bell you own, which then went into the log and into your volume. */
function isLoaded(ex){ return !!ex && (ex.equipment||[]).indexOf('kettlebell') >= 0; }
function pickWeightFor(ex, lastEntry){
  if(!isLoaded(ex)) return null;
  const inv = equipOwned().weights;
  if(!inv.length) return null;
  if(lastEntry && lastEntry.weight) return lastEntry.weight;
  const idx = ex.cat==='press'||ex.cat==='power'||ex.cat==='pull' ? 0 : Math.floor(inv.length/2);
  return inv[Math.min(idx, inv.length-1)];
}
function nextHeavier(weight){
  const inv = equipOwned().weights;
  const i = inv.indexOf(weight);
  if(i>=0 && i<inv.length-1) return inv[i+1];
  return null;
}

/* ---- Adaptive engine ---- */
/* For a per-side lift the two sides are effectively two different lifts: the
   weaker one usually logs fewer reps, and comparing across them would read as
   a regression and walk the target down. So the history is matched by side. */
function lastLogFor(exId, programId, side){
  let hits = STATE.history.filter(h=>h.exerciseId===exId && (!programId || h.programId===programId));
  if(side){
    const sameSide = hits.filter(h=>h.side===side);
    if(sameSide.length) hits = sameSide;
  }
  if(!hits.length) return null;
  return hits[hits.length-1];
}
/* The same lift means different things on different days. A goblet squat at 5
   reps is strength work; at 15 it is hypertrophy work. So a program block may
   prescribe its own range, and only falls back to the exercise's default when
   it does not. A template-wide repScheme covers the formats that have no
   blocks to hang a range on (supersets, EMOM, AMRAP). */
function plannedReps(ex, w, block, setIdx){
  /* A ladder prescribes an exact rep count per set, not a range: 1, then 2,
     then 3. The set index comes from the live session when it is not passed,
     so every existing caller keeps working unchanged. */
  if(block && block.ladder && block.ladder.length){
    const i = (setIdx==null && typeof SESSION!=='undefined' && SESSION && SESSION.workout===w)
      ? SESSION.setIndex : (setIdx||0);
    const r = block.ladder[Math.min(Math.max(0,i), block.ladder.length-1)];
    return [r, r];
  }
  const key = ex.timeBased ? 'secs' : 'reps';
  if(block && block[key])                   return block[key].slice();
  if(w && w.repScheme && w.repScheme[ex.id]) return w.repScheme[ex.id].slice();
  return ex.timeBased ? ex.secRange.slice() : ex.reps.slice();
}
function getRecommendation(ex, programId, w, block){
  const last = lastLogFor(ex.id, programId, isPerSide(ex) ? currentSide() : null);
  const base = plannedReps(ex, w, block);
  if(!last){
    return { low:base[0], high:base[1], weight: pickWeightFor(ex,null), note:'First time \u2014 starting target', prevText:null };
  }
  const prevWeight = isLoaded(ex) ? last.weight : null;
  const prevResult = last.result;
  const prevDiff = last.difficulty;
  // history is kept per programme, not per day, so the same lift can come back
  // under a different prescription. If last time's target sits outside today's
  // range, start from today's range instead of dragging the old one along.
  const offRange = last.targetHigh < base[0] || last.targetLow > base[1];
  let low  = offRange ? base[0] : last.targetLow;
  let high = offRange ? base[1] : last.targetHigh;
  let weight = prevWeight;
  const atTop = prevResult >= high;
  const easy = prevDiff==='very_easy'||prevDiff==='easy';
  const hard = prevDiff==='hard'||prevDiff==='too_hard';

  /* Pain and a broken position both stop the load dead, and pain takes some of
     it off. An automatic progression that cannot hear "that hurt" is the one
     way a coaching app can actively injure somebody. Repeated pain on the same
     movement stops being a bad day and starts being a reason to see someone. */
  if(last.pain){
    const lighter = nextLighter(weight);
    const hits = painHistory(ex.id);
    return { low: Math.max(1, base[0]-2), high: Math.max(2, base[1]-3),
      weight: lighter || weight,
      note: hits>=3 ? 'Third session with pain here \u2014 swap it or get it looked at'
                    : 'Backing off after last time \u2014 pain is not something to train through',
      prevText: prevTextFor(ex, last), flag:'pain' };
  }
  if(last.form){
    return { low, high, weight,
      note: 'Same load until the position holds \u2014 form first, then more',
      prevText: prevTextFor(ex, last), flag:'form' };
  }
  if(easy && atTop){
    const heavier = (weight && !readinessHold()) ? nextHeavier(weight) : null;
    if(heavier && !ex.timeBased){ weight = heavier; low = base[0]; high = Math.max(base[0]+2, base[1]-3); }
    else { high = high + 2; low = low + 1; }
  } else if(hard){
    if(prevDiff==='too_hard'){ high = Math.max(base[0], high-2); low = Math.max(base[0]-1, low-2); }
  } else {
    // just right / good \u2014 hold steady, nudge high by 1 if result met high already
    if(prevResult>=high) high = high+1;
  }
  low = Math.max(1,low); high = Math.max(low+1,high);
  // only mention how it felt if you actually said — the feel input is optional
  const feltPart = prevDiff ? ', marked '+diffLabel(prevDiff) : '';
  // and be straight about it when the only history is from the other side
  const askedSide = isPerSide(ex) ? currentSide() : null;
  const sidePart = (askedSide && last.side && last.side!==askedSide)
    ? ' (your '+sideLabel(last.side).toLowerCase()+' side)' : '';
  const prevText = (ex.timeBased? prevResult+' sec' : prevResult+' reps')
    + (prevWeight? ' @ '+prevWeight+' '+STATE.profile.units:'')
    + sidePart
    + ' \u2014 target was '+last.targetLow+'\u2013'+last.targetHigh+(ex.timeBased?' sec':'')
    + feltPart;
  if(easy && atTop && prevWeight && readinessHold() && nextHeavier(prevWeight))
    return { low, high, weight, note:'Holding the bell today \u2014 you said you are not at your best', prevText, _held:true };
  return { low, high, weight, note: easy&&atTop&&prevWeight&&nextHeavier(prevWeight) ? 'Progressing to a heavier bell'
    : (easy&&atTop&&!prevWeight ? 'More reps this time — bodyweight moves progress by volume' : null) || (hard?'Holding steady to build consistency':'Small progression from last time'), prevText };
}
function diffLabel(d){ return {very_easy:'Very Easy',easy:'Easy',just_right:'Just Right',good:'Good',hard:'Hard',too_hard:'Too Hard'}[d]||d; }
/* The step below the one you used — the mirror of nextHeavier. */
function nextLighter(w){
  const inv = (STATE.profile.inventory||[]).slice().sort(function(a,b){return a-b;});
  let out = null;
  inv.forEach(function(x){ if(x < w) out = x; });
  return out;
}
/* How many of the last six sessions on this movement were flagged painful. */
function painHistory(exId){
  const mine = STATE.history.filter(function(h){ return h.exerciseId===exId; }).slice(-6);
  return mine.filter(function(h){ return h.pain; }).length;
}
function prevTextFor(ex, last){
  return (ex.timeBased ? last.result+' sec' : last.result+' reps')
    + (last.weight ? ' @ '+last.weight+' '+STATE.profile.units : '')
    + ' \u2014 flagged '+(last.pain?'painful':'a form breakdown');
}

function logSet(entry){
  // entry: {exerciseId, programId, programName, week, workoutIndex, workoutName, format, weight, result, difficulty, reason, targetLow, targetHigh}
  entry.date = todayISO();
  entry.id = 'h_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  STATE.history.push(entry);
  /* A for-time result is a whole workout's reps against a clock, not one set —
     recording it as "16 kg x 84" would put nonsense at the top of the PR list.
     It still belongs in history, so the volume chart and the log see it. */
  if(!entry.noPR) updatePRs(entry);
  saveState();
}
function updatePRs(entry){
  const ex = EX_BY_ID[entry.exerciseId]; if(!ex) return;
  if(!STATE.prs[entry.exerciseId]) STATE.prs[entry.exerciseId] = {heaviestWeight:0,repsAtHeaviest:0,bestVolume:0,bestResult:0};
  const pr = STATE.prs[entry.exerciseId];
  let isPR=false;
  if(entry.weight && entry.weight > pr.heaviestWeight){ pr.heaviestWeight = entry.weight; pr.repsAtHeaviest = entry.result; isPR=true; }
  else if(entry.weight && entry.weight === pr.heaviestWeight && entry.result > pr.repsAtHeaviest){ pr.repsAtHeaviest = entry.result; isPR=true; }
  const vol = (entry.weight||0) * (entry.result||0);
  if(vol > pr.bestVolume){ pr.bestVolume = vol; isPR = isPR || vol>0; }
  // a bodyweight movement has no load to beat, so its record is reps (or seconds)
  if(!isLoaded(ex) && pr.bestResult > 0 && entry.result > pr.bestResult) isPR = true;
  if(entry.result > pr.bestResult){ pr.bestResult = entry.result; }
  if(isPR) entry.isPR = true;
}

/* ============================= PROGRAM PROGRESS ============================= */
/* A training block is a schedule, not a puzzle. The old rule locked every day
   behind the one before it and locked a week until ALL of the previous week was
   ticked, so a single session cut short — or simply missed, which is what
   February looks like — bricked the rest of the programme with no way forward.

   Days inside a week are never locked now: the app still says which one is
   next, but it will not stand in front of the door. A week opens once most of
   the one before it has been trained, so the structure still means something
   without one missed Thursday costing you the block. */
function weekDaysDone(program, week){
  const grid = progKey(program.id).completed[week]||[];
  let n=0; for(let i=0;i<program.daysPerWeek;i++) if(grid[i]) n++;
  return n;
}
function isWeekUnlocked(program, week){
  if(week<=1) return true;
  const need = Math.max(1, program.daysPerWeek-1);      // one may be missed
  return weekDaysDone(program, week-1) >= need;
}
function isWorkoutUnlocked(program, week, idx){
  return isWeekUnlocked(program, week);
}
/* Partial counts as trained. Getting three quarters of the way through a
   session and stopping is a training day, and the programme has to agree. */
const PARTIAL_COUNTS_PCT = 60;
function isWorkoutDone(program, week, idx){
  const pp = progKey(program.id);
  const grid = pp.completed[week]||[];
  if(grid[idx]) return true;
  const part = (pp.partial||{})[week+'-'+idx];
  return !!(part && part.pct >= PARTIAL_COUNTS_PCT);
}
function isWorkoutPartial(program, week, idx){
  const pp = progKey(program.id);
  if((pp.completed[week]||[])[idx]) return false;
  return (pp.partial||{})[week+'-'+idx] || null;
}
function markWorkoutDone(program, week, idx){
  const pp = progKey(program.id);
  if(!pp.completed[week]) pp.completed[week]=[];
  pp.completed[week][idx]=true;
  saveState();
}
function programStats(program){
  const total = program.weeks*program.daysPerWeek;
  let done=0;
  const pp = progKey(program.id);
  for(let w=1; w<=program.weeks; w++){ const g=pp.completed[w]||[]; for(let i=0;i<program.daysPerWeek;i++) if(g[i]) done++; }
  return {total, done, pct: total? Math.round(done/total*100):0};
}
function currentPosition(program){
  for(let w=1; w<=program.weeks; w++){
    for(let i=0;i<program.daysPerWeek;i++){
      if(!isWorkoutDone(program,w,i)) return {week:w, idx:i};
    }
  }
  return null; // program complete
}
/* Structural progression across a block: volume creeps up in steps, then the
   final week backs off. A deload at the end is how real programs are written —
   without it the last week is the hardest, which is exactly backwards.

   The phases have to be spread across whatever length the program actually is.
   The old rule chopped the block into fixed thirds, which only worked for long
   programs: a one-week program came out as a single deload week — the whole
   thing prescribed BELOW its own templates — and a four-week block ran
   Foundation, Foundation, Build, Deload, never reaching Peak at all. The rule
   below spreads the three phases proportionally over the weeks before the
   deload, so every block of every length climbs and then backs off.

   Some programs are not blocks at all, and say so with `progression`:
     block   (default) climb, then deload
     ladder  the rep ladder is the progression; sets stay put
     flat    the same dose every week — frequency is the stimulus
     test    written to be repeated and compared, never ramped
     reset   a recovery week: half the work, all of the technique          */
const PHASE = {
  foundation:{name:'Foundation', ramp: 0, note:'Groove the patterns before adding load.'},
  build:     {name:'Build',      ramp: 1, note:'Volume steps up from here.'},
  peak:      {name:'Peak',       ramp: 2, note:'The heaviest stretch of the block.'},
  deload:    {name:'Deload',     ramp:-1, note:'Back off and let the work land.'},
  steady:    {name:'Steady',     ramp: 0, note:'Same dose every week. Showing up is the stimulus.'},
  test:      {name:'Test week',  ramp: 0, note:'Written to be repeated. Log every set — this is the baseline.'},
  reset:     {name:'Reset',      ramp:-1, note:'Half the work, all of the technique.'},
  rungLow:   {name:'Base rung',  ramp: 0, note:'The ladder is short. Make every rep look identical.'},
  rungMid:   {name:'Climbing',   ramp: 0, note:'The ladder is longer — the load has not changed.'},
  rungTop:   {name:'Top rung',   ramp: 0, note:'The tallest ladder of the block.'},
};
function isDeloadWeek(weeks, week){
  if(week >= weeks) return true;                       // the block always ends on one
  return weeks >= 8 && week % 4 === 0 && (weeks - week) > 2;
}
function weekPhase(program, week){
  const W = program.weeks, style = program.progression || 'block';
  if(style==='flat')  return PHASE.steady;
  if(style==='test')  return PHASE.test;
  if(style==='reset') return PHASE.reset;
  if(style==='ladder')                       // the rungs climb; the sets do not
    return week>=W ? PHASE.rungTop : (week===1 ? PHASE.rungLow : PHASE.rungMid);

  if(W<=1) return PHASE.test;                // a single week is not a block
  /* A long block needs a breath in the middle. Eleven straight weeks of
     accumulation before the first back-off week is not a programme, it is a
     countdown — so every fourth week is a deload once a block runs eight weeks
     or more, skipped when it would land on top of the final one. */
  if(isDeloadWeek(W, week)) return PHASE.deload;
  /* The three phases spread across the weeks that actually climb; the deloads
     are not part of that count, or the block would peak early and coast. */
  let climbed = 0, total = 0;
  for(let w=1; w<=W; w++){
    if(isDeloadWeek(W, w)) continue;
    if(w < week) climbed++;
    total++;
  }
  const step = total<=1 ? 0 : Math.min(2, Math.floor(climbed*3/total));
  return [PHASE.foundation, PHASE.build, PHASE.peak][step];
}
/* ============================== WARM-UP BUILDER ==============================
   A warm-up is not a couple of token movements before the real session. It has
   a shape every coach writes the same way: raise the pulse, mobilise the joints
   the day will ask for, switch on the muscles that hold the positions, then
   rehearse the day's own lifts light. So it is derived from the session rather
   than typed per template — the day's movement patterns choose the drills, and
   the declared minutes are the sum of what is actually prescribed, never a
   number written beside a two-item list. */

function sessionExIds(w){
  const out=[];
  (w.blocks ||[]).forEach(b=>out.push(b.ex));
  (w.pairs  ||[]).forEach(p=>p.forEach(id=>out.push(id)));
  (w.pattern||[]).forEach(id=>{ if(id!=='rest') out.push(id); });
  (w.round  ||[]).forEach(r=>out.push(r.ex));
  (w.chain  ||[]).forEach(c=>out.push(c.ex));
  return out.filter(Boolean);
}
function sessionPatterns(w){
  const s=new Set();
  sessionExIds(w).forEach(id=>{
    const e=EX_BY_ID[id];
    if(e&&e.type) s.add(e.type.toLowerCase());
    if(e&&e.cat)  s.add(e.cat.toLowerCase());
  });
  return s;
}
/* want:'*' = serves any session · prio orders drills that score the same */
const WARM_POOL = {
  pulse:[
    {move:'march',            label:'March in place',           dose:'90 seconds — start at a walk, finish brisk', sec:90, want:'*', prio:1},
    {move:'jumping_jacks',    label:'Jumping jacks',            dose:'3 × 20, springy and quiet',            sec:90, want:'*', prio:1},
  ],
  mobility:[
    {move:'cat_cow',       label:'Cat-cow',                    dose:'8 rounds, one breath each way',                sec:50, want:'*',                                     prio:1},
    {move:'arm_circles',   label:'Arm circles',                dose:'10 forward, 10 back, full circle',             sec:45, want:['press','pull','carry','power'], prio:2},
    {move:'shoulder_pass', label:'Shoulder pass-throughs',     dose:'2 × 8 with a stick, band or towel — widen the grip if it pinches', sec:50, want:['press','pull'],               prio:1},
    {move:'bw_hinge',      label:'Hip hinges',                 dose:'2 × 8, hands on the hip crease',          sec:55, want:['hinge','swing','power'],        prio:1},
    {move:'bw_squat',      label:'Bodyweight squats',          dose:'2 × 8, three seconds down',               sec:60, want:['squat','lunge'],                prio:1},
    {move:'split_squat',   label:'Split squat — bodyweight', dose:'6 each side, slow and tall',                sec:60, want:['lunge'],                        prio:2},
  ],
  activation:[
    {move:'glute_bridge',  label:'Glute bridge',               dose:'2 × 10 with a two-second squeeze',        sec:60, want:['hinge','squat','swing','power','lunge'], prio:1},
    {move:'kb_swing',      label:'Swings — light',  dose:'2 × 10, hips only',                      sec:60, want:['swing','power','hinge'],        prio:1},
    {move:'push_up',       label:'Push-ups — slow',         dose:'2 × 5, three seconds down',              sec:55, want:['press'],                        prio:1},
    {move:'kb_halo',       label:'Halo — light bell',       dose:'5 each way, ribs down',                       sec:50, want:['press','pull','carry'],         prio:2},
    {move:'plank',            label:'Plank',                        dose:'2 × 20 seconds',        sec:55, want:['core','carry'],          prio:2},
    {move:'mountain_climber', label:'Mountain climbers — slow', dose:'2 × 20, hips level',   sec:80, want:['core','power','carry'], prio:3},
  ]
};
/* Score by how well a drill serves today's patterns, then rotate among the ones
   that tie — otherwise every session in the app opens with the same movement.
   The seed is the day itself, so a given workout always warms up the same way. */
function pickDrills(list, pats, n, seed){
  const scored = list.map((d,i)=>({d, i,
      s:(d.want==='*' ? 0.6 : d.want.filter(p=>pats.has(p)).length) - (d.prio||0)*0.01}))
    .filter(x=>x.s>0);
  if(!scored.length) return [];
  const L = scored.length, rot = ((seed||0)%L+L)%L;
  scored.sort((a,b)=> (b.s-a.s) || (((a.i+rot)%L)-((b.i+rot)%L)));
  /* present them head-to-toe in pool order, not in score order */
  return scored.slice(0,n).sort((a,b)=>a.i-b.i).map(x=>x.d);
}
/* The last thing before the work is the work itself, light: the day's own
   first movements at half the reps. Nothing rehearses a swing like a swing. */
/* The load in the rehearsal has to be the load the movement actually takes.
   A push-up does not get a light bell, and a double-bell lift does not get one
   bell — the cue is read off the exercise's own equipment, not assumed. */
function rampDose(e, first){
  const bell = !!(e.equipment && e.equipment.indexOf('kettlebell') >= 0);
  /* Half the working reps, floored at two — a get-up prescribed 2-5 must not
     come back as a five-rep "rehearsal". */
  const lo = Array.isArray(e.reps) && typeof e.reps[0]==='number'
    ? Math.max(2, Math.round(e.reps[0]*0.5)) : 0;
  const count = lo ? lo+' reps'+(isPerSide(e) ? ' per side' : '') : 'one easy trip';
  const load  = !bell ? '' : (e.pair ? ' with two light bells' : ' with a light bell');
  return count + load + (first
    ? ' — this is the rehearsal, not the set'
    : ', same tempo as the working sets');
}
function specificRamp(w, n){
  const out=[], seen=new Set();
  for(const id of sessionExIds(w)){
    if(out.length>=n) break;
    const e=EX_BY_ID[id];
    if(!e || seen.has(id) || e.type==='Core') continue;   // no point rehearsing a plank
    seen.add(id);
    const loaded = !!(e.equipment && e.equipment.indexOf('kettlebell') >= 0);
    out.push({move:id, label:e.name+(loaded ? ' — ramp set' : ' — practice set'),
              dose:rampDose(e, out.length===0), sec:50});
  }
  return out;
}
const WARM_FLOOR_SEC = 300;                      // five minutes, and it is a floor
function buildWarmup(w){
  const pats  = sessionPatterns(w);
  const seed  = (w.idx||0)*3 + (w.week||0);
  const short = (w.mainMin||30) <= 26;
  const pulse = pickDrills(WARM_POOL.pulse,      pats, 1,          seed);
  const mob   = pickDrills(WARM_POOL.mobility,   pats, short?2:3,  seed);
  const act   = pickDrills(WARM_POOL.activation, pats, short?1:2,  seed);
  const ramp  = specificRamp(w, short?1:2);

  /* Five minutes is a floor, not a rounding: if the short selection lands under
     it, the warm-up grows by a real drill rather than by a rounded-up label. */
  let total = [].concat(pulse,mob,act,ramp).reduce((s,d)=>s+d.sec,0);
  if(total < WARM_FLOOR_SEC){
    const used  = new Set([].concat(pulse,mob,act).map(d=>d.move));
    const spare = [].concat(WARM_POOL.activation, WARM_POOL.mobility)
      .map(d=>({d, s: d.want==='*' ? 0.6 : d.want.filter(p=>pats.has(p)).length}))
      .filter(x=>!used.has(x.d.move))          // a poor fit still beats a short warm-up
      .sort((a,b)=>b.s-a.s);
    for(let i=0; i<spare.length && total<WARM_FLOOR_SEC; i++){
      act.push(spare[i].d); total += spare[i].d.sec;
    }
  }

  const items=[];
  [['Raise the pulse',pulse],['Mobilise',mob],['Switch on',act],['Rehearse the day',ramp]]
    .forEach(function(pair){ pair[1].forEach(function(d){ items.push({
      label:d.label, note:d.dose, sec:d.sec, phase:pair[0],
      move:(typeof MOVES!=='undefined' && MOVES[d.move]) ? d.move : null
    }); }); });
  return items;
}
function attachWarmup(w){
  const items = buildWarmup(w);
  w.warmup    = items;
  /* The declared minutes are the sum of what is prescribed, rounded up — never
     a number written beside a list that does not add up to it. */
  w.warmupMin = Math.max(5, Math.ceil(items.reduce((s,i)=>s+i.sec,0)/60));
  return w;
}

function buildWorkoutInstance(program, week, idx){
  const tmpl = program.templates[idx % program.templates.length];
  const ph = weekPhase(program, week);
  const w = Object.assign({}, tmpl, {
    programId:program.id, programName:program.name, week, idx,
    phaseName:ph.name, phaseNote:ph.note});
  /* A ladder block grows by rungs, not by sets: the load stays put and the
     week adds a step to the top. That is the whole progression, so these
     blocks sit out the set ramp below. */
  if(w.blocks){
    let addedRungs = 0;
    w.blocks = w.blocks.map(b=>{
      if(!b.ladder || !b.ladder.length) return b;
      const lad = b.ladder.slice();
      const grow = (program.progression==='ladder') ? Math.max(0, week-1) : 0;
      for(let k=0;k<grow;k++) lad.push(lad[lad.length-1] + (b.rungStep||1));
      addedRungs += lad.length - b.ladder.length;
      return Object.assign({}, b, {ladder:lad, sets:lad.length});
    });
    /* a taller ladder is more sets, and more sets is more minutes — otherwise
       week four claims the same session length while doing half again the work */
    if(addedRungs) w.mainMin = w.mainMin + addedRungs*2;
  }
  if(w.blocks){
    const before = w.blocks.reduce((n,b)=>n+b.sets,0);
    // straight-set volume ramps more gently than round-based work, or a peak
    // week balloons past the session length the program promises
    const setRamp = Math.min(1, ph.ramp);
    // Volume is added to the day's primary work, not to everything at once.
    // That is how a block is actually written, and it keeps a four-exercise
    // hypertrophy day inside the time the programme promises. A deload still
    // comes off every exercise — backing off should be felt everywhere.
    w.blocks = w.blocks.map((b,i)=> b.ladder ? b : Object.assign({},b,{
      sets: Math.max(2, b.sets + (setRamp > 0 ? (i < 2 ? setRamp : 0) : setRamp))
    }));
    const after = w.blocks.reduce((n,b)=>n+b.sets,0);
    w.mainMin = Math.max(12, Math.round(w.mainMin + (after-before)*2.5));  // more sets, more time
  }
  /* Rounds ramp the same way sets do, so the minutes have to follow them the
     same way. Without this a peak week quietly asks for six rounds inside the
     time four rounds were written for — the same defect the ladder had. */
  if(w.rounds){
    const wasRounds = w.rounds;
    w.rounds = Math.max(2, w.rounds+ph.ramp);
    const perRound = (w.pairs ? w.pairs.length*2 : (w.chain||[]).length) || 2;
    w.mainMin = Math.max(12, Math.round(w.mainMin + (w.rounds-wasRounds)*perRound*1.4));
  }
  if(w.totalMinutes) w.totalMinutes = Math.max(8, w.totalMinutes + ph.ramp*2);
  if(w.totalMinutes) w.mainMin = w.totalMinutes;
  attachWarmup(w);                 // derived from this day's movements, not typed
  const measure = ()=> (w.warmup&&w.warmup.length ? w.warmupMin : 0) + w.mainMin
             + (w.finisher ? (w.finisher.totalMinutes||0) : 0);
  w.totalMin = measure();
  // Nothing worth calling a session runs under this. A deload keeps the time
  // and drops the load — cutting both would make the easy week a token one.
  /* A for-time piece is as long as its cap and no longer: padding it would
     contradict the cap printed on the same screen. */
  /* Most sessions should not fall under thirty-five minutes; a programme
     written deliberately short says so and is left alone, rather than being
     padded with rest it never asked for. */
  const MIN_SESSION = (w.format==='for_time') ? 0
    : (program.minSession != null ? program.minSession : 35);
  if(w.totalMin < MIN_SESSION){
    const add = MIN_SESSION - w.totalMin;
    if(w.format==='emom' || w.format==='amrap'){
      w.totalMinutes = (w.totalMinutes||0) + add;   // the clock itself has to grow
      w.mainMin = w.totalMinutes;
    } else {
      w.mainMin += add;                              // more rest, same work
    }
    w.totalMin = measure();
  }
  return w;
}

/* ============================= ROUTER / APP STATE ============================= */
let ROUTE = {name:'home', params:{}};
let SESSION = null; // active workout runtime state
let ONB_STEP = 0;
let ONB_DATA = null;
let REST_TIMER = null;

/* The app keeps its own trail of screens. The back arrow used to call
   history.back(), but nothing was ever pushed onto the browser history — so on
   a home-screen install back did nothing, and in a browser tab it left the
   app altogether. */
let NAV_STACK = [];
function navigate(name, params){
  const next = {name, params: params||{}};
  if(ROUTE && (ROUTE.name!==next.name || JSON.stringify(ROUTE.params)!==JSON.stringify(next.params))){
    NAV_STACK.push(ROUTE);
    if(NAV_STACK.length > 40) NAV_STACK.shift();
  }
  ROUTE = next; window.scrollTo(0,0); render();
}
function goBack(fallback){
  let prev = NAV_STACK.pop();
  // never go "back" into a finished or abandoned workout
  while(prev && prev.name==='active_workout' && !SESSION) prev = NAV_STACK.pop();
  ROUTE = prev || {name: fallback || 'home', params:{}};
  window.scrollTo(0,0); render();
}

function render(){
  const app = document.getElementById('app');
  stopAnimation();
  syncWakeLock();
  if(!STATE.onboardingComplete && ROUTE.name!=='onboarding' && ROUTE.name!=='recommend'){
    ROUTE = {name:'onboarding', params:{}};
  }
  let body = '';
  switch(ROUTE.name){
    case 'onboarding': body = renderOnboarding(); app.innerHTML = shellless(body); attachOnboardingHandlers(); return;
    case 'recommend': body = renderRecommend(); app.innerHTML = shellless(body); return;
    case 'home': body = renderHome(); break;
    case 'programs': body = renderProgramsList(); break;
    case 'builder': body = renderBuilder(); break;
    case 'program_detail': body = renderProgramDetail(ROUTE.params.id); break;
    case 'exercises': body = renderExercisesList(); break;
    case 'exercise_detail': body = renderExerciseDetail(ROUTE.params.id); break;
    case 'generator': body = renderGenerator(); break;
    case 'workout_preview': body = renderWorkoutPreview(ROUTE.params); break;
    case 'active_workout':
      window._activeFigureExId = null;
      app.innerHTML = renderActiveWorkout();
      if(window._activeFigureExId) initExerciseAnimation(window._activeFigureExId);
      return;
    case 'progress': body = renderProgress(); break;
    case 'exercise_progress': body = renderExerciseProgress(ROUTE.params.id); break;
    case 'profile': body = renderProfile(); break;
    default: body = renderHome();
  }
  if(ROUTE.name!=='home') THEME_SHEET = false;
  app.innerHTML = shell(body, ROUTE.name==='exercise_progress' ? 'progress' : ROUTE.name==='builder' ? 'programs' : ROUTE.name) + themeSheetMarkup();
  if(ROUTE.name==='exercise_detail'){ initExerciseAnimation(ROUTE.params.id); }
}

function shell(inner, active){
  const navItems = [
    ['home','Home',ICON.home],['programs','Programs',ICON.programs],['exercises','Exercises',ICON.exercises],
    ['progress','Progress',ICON.progress],['profile','Profile',ICON.profile]
  ];
  const sideLinks = navItems.map(([r,label,icon])=>
    '<a class="side-link '+(active===r||( (active==='program_detail')&&r==='programs')||((active==='exercise_detail')&&r==='exercises')?'active':'')+'" onclick="navigate(\''+r+'\')">'+icon+'<span>'+label+'</span></a>'
  ).join('');
  const bottomItems = navItems.map(([r,label,icon])=>
    '<div class="tab '+(active===r||( (active==='program_detail')&&r==='programs')||((active==='exercise_detail')&&r==='exercises')?'active':'')+'" onclick="navigate(\''+r+'\')">'+icon+'<span>'+label+'</span></div>'
  ).join('');
  return '<div class="app-shell">'
    + '<div class="sidebar"><div class="sidebar-brand">NT<span> TRAINING</span><div class="brand-cat">'+esc(BRAND.category)+'</div></div>'+sideLinks+'</div>'
    + '<div class="main-col"><div class="main-inner">'+inner+'</div></div>'
    + '</div>'
    + '<div class="bottom-nav">'+bottomItems+'</div>';
}
function shellless(inner){ return '<div class="main-col"><div class="main-inner" style="max-width:520px;padding-top:28px;">'+inner+'</div></div>'; }

/* ============================= MUSCLE MAP SVG ============================= */
function bodySvg(view, highlighted){
  const IDLE = '#2B3643', BASE = '#1B222C', EDGE = '#10151C';
  const c = id => highlighted[id] || IDLE;
  const lit = id => !!highlighted[id];
  const m = (d, id) => '<path d="'+d+'" fill="'+c(id)+'" stroke="'+EDGE+'" stroke-width="0.7" stroke-linejoin="round"'
                     + (lit(id) ? ' filter="url(#glow-'+view+')"' : '') + '/>';
  // one half of the body; sfx picks the _l or _r region ids
  const half = sfx => {
    const s = id => id + sfx;
    // the base silhouette of this half: arm, leg, flank
    let g = '<path d="M60,40 L50,41 Q38,43 33,49 Q27,55 27,66 L24,100 L19,138 L17,152 Q19,158 24,155 L26,140 L31,104 L35,78 L37,96 Q37,110 38,122 L39,136 L41,178 L43,226 Q39,232 43,235 L54,235 Q56,231 54,226 L57,180 L60,140 Z" fill="'+BASE+'"/>';
    if(view === 'front'){
      g += m('M60,41 L51,42 L45,46 L56,47 Z', s('trap'));                                   // upper traps, seen over the collarbone
      g += m('M44,46 Q33,46 29,55 Q27,63 30,71 Q34,62 42,56 Z', s('shoulders'));           // front deltoid
      g += m('M59,49 L45,49 Q39,54 38,64 Q39,72 44,76 Q52,79 59,76 Z', 'chest');           // pectoral
      g += m('M30,72 Q26,80 25,93 Q26,99 29,100 Q32,92 34,80 Q34,74 32,70 Z', s('biceps'));
      g += m('M25,102 Q21,114 19,136 L24,137 Q28,118 30,103 Z', s('forearms'));
      g += m('M59,79 L51,80 Q49,98 51,118 L59,120 Z', 'abs');                              // rectus abdominis
      g += '<path d="M51,90 L59,90 M51,100 L59,100 M51,110 L59,110" stroke="'+EDGE+'" stroke-width="0.7" fill="none"/>';
      g += m('M48,79 Q41,82 40,96 Q40,108 43,116 L50,118 Q48,98 50,80 Z', s('obliques'));
      g += m('M45,126 Q39,146 42,172 L46,178 L55,178 Q58,160 58,142 Q58,130 55,124 Z', s('quads'));
      g += m('M45,184 Q43,204 46,222 L52,222 Q54,204 54,184 Z', s('shins'));
      g += '<path d="M50,131 Q48,152 50,174" stroke="'+EDGE+'" stroke-width="0.7" fill="none"/>';   // vastus / rectus femoris split
    } else {
      g += m('M60,38 L52,42 Q44,45 40,49 L50,56 Q56,62 60,78 Z', s('trap'));               // trapezius, neck to mid back
      g += m('M40,48 Q31,49 28,58 Q27,65 30,71 Q34,62 42,56 Z', s('shoulders'));           // rear deltoid
      g += m('M42,57 Q36,70 38,86 Q42,98 50,102 L58,100 Q56,74 50,60 Z', s('upperback'));  // lats and rhomboids
      g += m('M30,72 Q26,82 25,94 Q26,100 29,100 Q33,90 34,78 Q33,73 31,70 Z', s('triceps'));
      g += m('M25,102 Q21,114 19,136 L24,137 Q28,118 30,103 Z', s('forearmsb'));
      g += m('M59,101 L51,103 Q49,112 51,121 L59,122 Z', 'lowerback');                     // spinal erectors
      g += m('M49,121 Q41,122 40,132 Q41,142 50,145 Q57,146 60,140 L60,123 Z', s('glutes'));
      g += m('M42,147 Q39,160 42,176 L55,177 Q58,162 57,148 Z', s('hamstrings'));
      g += m('M43,182 Q39,196 44,210 L54,210 Q58,196 55,182 Z', s('calves'));
    }
    return g;
  };
  const glow = '<defs><filter id="glow-'+view+'" x="-40%" y="-40%" width="180%" height="180%">'
    + '<feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  return '<svg viewBox="0 0 120 240" width="100%" style="height:auto;display:block;" role="img" aria-label="'
    + (view==='front' ? 'Front' : 'Back') + ' muscle map">' + glow
    + '<ellipse cx="60" cy="21" rx="11.5" ry="14" fill="'+BASE+'"/>'
    + '<rect x="54" y="32" width="12" height="10" rx="3" fill="'+BASE+'"/>'
    + half('_l')
    + '<g transform="translate(120,0) scale(-1,1)">' + half('_r') + '</g>'
    + '</svg>';
}
function muscleMap(ex){
  const colorFor = level => level==='primary'?'#E6555A':level==='secondary'?'#EE9A4C':'#E8C548';
  const hl = {};
  (ex.primary||[]).forEach(m=> (MUSCLE_TO_REGION[m]||[]).forEach(r=> hl[r]=colorFor('primary')));
  (ex.secondary||[]).forEach(m=> (MUSCLE_TO_REGION[m]||[]).forEach(r=> { if(!hl[r]) hl[r]=colorFor('secondary'); }));
  return '<div style="display:flex;gap:18px;align-items:flex-start;">'
    +'<div style="flex:1;text-align:center;"><div style="font-size:11px;color:var(--text-3);font-weight:700;margin-bottom:6px;">FRONT</div>'+bodySvg('front',hl)+'</div>'
    +'<div style="flex:1;text-align:center;"><div style="font-size:11px;color:var(--text-3);font-weight:700;margin-bottom:6px;">BACK</div>'+bodySvg('back',hl)+'</div>'
    +'</div>'
    +'<div class="muscle-legend" style="margin-top:14px;">'
    +'<span><span class="dot" style="background:#E6555A;"></span>Primary</span>'
    +'<span><span class="dot" style="background:#EE9A4C;"></span>Secondary</span>'
    +'</div>';
}

<script>
'use strict';
/* ============================= ONBOARDING ============================= */
const ONB_STEPS = 7;
function ensureOnbData(){
  if(!ONB_DATA) ONB_DATA = {goals:[], experience:'', inventory:[], multipleKb:false, adjustable:false, otherEquipment:false,
    days:3, duration:45, formats:[], name:STATE.profile.name||''};
}
function renderOnboarding(){
  ensureOnbData();
  /* The bar used to carry seven segments and fill every one up to and
     including the current step, while the label counted six questions and
     ignored the welcome screen — so "Step 1 of 6" lit two segments. Both now
     count the same six questions, and the bar stays out of the way on the
     screens that are not questions. */
  const dots = (ONB_STEP>=1 && ONB_STEP<=6)
    ? '<div class="onb-progress">'+Array.from({length:6}).map((_,i)=>
        '<span class="'+(i<ONB_STEP?'on':'')+'"></span>').join('')+'</div>'
    : '';
  let content='';
  if(ONB_STEP===0) content = onbStep0();
  else if(ONB_STEP===1) content = onbStep1();
  else if(ONB_STEP===2) content = onbStep2();
  else if(ONB_STEP===3) content = onbStep3();
  else if(ONB_STEP===4) content = onbStep4();
  else if(ONB_STEP===5) content = onbStep5();
  else content = onbStep6();
  return '<div class="onb-body">'+dots+content+'</div>';
}

/* An option that explains what choosing it actually changes. A row of bare
   pills makes the reader guess; six of them wrapping unevenly makes them
   guess AND hunt. */
const OPT_TICK = '<span class="tick"><svg viewBox="0 0 12 12" fill="none" stroke="#fff"'
  + ' stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M2 6.3 L4.7 9 L10 3.2"/></svg></span>';
function optCard(sel, onclick, title, desc){
  return '<div class="opt'+(sel?' sel':'')+'" role="button" tabindex="0" onclick="'+onclick+'"'
    + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}">'
    + OPT_TICK
    + '<div class="t">'+esc(title)+'</div>'
    + (desc?'<div class="d">'+esc(desc)+'</div>':'')
    + '</div>';
}
function tokenGrid(items){
  return '<div class="tok-grid">'+items.map(function(it){
    return '<div class="tok'+(it[2]?' sel':'')+'" onclick="'+it[1]+'">'+esc(it[0])+'</div>';
  }).join('')+'</div>';
}
function onbPickTheme(t){ const el = document.getElementById('onbName'); if(el) ONB_DATA.name = el.value; setTheme(t); }
function onbStep0(){
  return '<div class="eyebrow">Welcome to NT Training</div><h1 style="font-size:32px;margin:8px 0 6px;">First, pick your look.</h1>'
  +'<p style="color:var(--text-2);margin-bottom:14px;">Tap one and the whole app changes with it. You can switch any time.</p>'
  +'<div class="tp-grid" style="margin-bottom:26px;">'+THEMES.map(function(t){ return themePreviewCard(t, "onbPickTheme('"+t[0]+"')"); }).join('')+'</div>'
  +'<h2 style="font-size:22px;margin:0 0 6px;">Six questions. Then we train.</h2>'
  +'<p style="color:var(--text-2);margin-bottom:26px;">Enough to coach you properly \u2014 which weight, how many reps, when to go up. Not a list of exercises with a stopwatch.</p>'
  +'<div class="field"><label>What should we call you?</label><input type="text" id="onbName" placeholder="Your name" value="'+esc(ONB_DATA.name)+'"></div>'
  +'<button class="btn btn-primary btn-block" onclick="onbNext0()">Get Started</button>';
}
function onbNext0(){ ONB_DATA.name = document.getElementById('onbName').value.trim(); ONB_STEP=1; render(); }
function onbStep1(){
  const opts = [
    ['build_strength','Build strength','Heavier bells, fewer reps, longer rests'],
    ['build_muscle','Build muscle','More sets, reps in the eight to fifteen range'],
    ['conditioning','Improve conditioning','Short rests, circuits and clocks'],
    ['explosive','Become more explosive','Swings, cleans and snatches'],
    ['lose_fat','Lose fat','Dense work and loaded carries'],
    ['general_fitness','Improve overall fitness','A balanced share of all of it'],
  ];
  return '<div class="eyebrow">Step 1 of 6</div><h2 style="font-size:26px;margin:8px 0 10px;">What are you training for?</h2>'
  +'<p style="color:var(--text-3);margin-bottom:18px;font-size:13.5px;">Pick as many as apply \u2014 this decides which programmes come up first.</p>'
  +'<div class="opt-grid">'+opts.map(function(o){
      return optCard(ONB_DATA.goals.indexOf(o[0])>=0, "toggleGoal('"+o[0]+"')", o[1], o[2]);
    }).join('')+'</div>'
  +navButtons(ONB_DATA.goals.length>0, 'Pick at least one to carry on.');
}
function toggleGoal(id){ const i=ONB_DATA.goals.indexOf(id); if(i>=0) ONB_DATA.goals.splice(i,1); else ONB_DATA.goals.push(id); render(); }
function onbStep2(){
  const opts=[
    ['beginner','Beginner','New to kettlebells, or back after a long break'],
    ['intermediate','Intermediate','The main lifts feel familiar and repeatable'],
    ['advanced','Advanced','Years behind you; snatches and get-ups are routine'],
  ];
  if(ONB_DATA.experience==='some') ONB_DATA.experience='beginner';   // old profiles
  return '<div class="eyebrow">Step 2 of 6</div><h2 style="font-size:26px;margin:8px 0 10px;">How much time do you have behind you?</h2>'
  +'<p style="color:var(--text-3);margin-bottom:18px;font-size:13.5px;">Answer honestly \u2014 it sets where the weights start, nothing else.</p>'
  +'<div class="opt-grid rows">'+opts.map(function(o){
      return optCard(ONB_DATA.experience===o[0], "setExp('"+o[0]+"')", o[1], o[2]);
    }).join('')+'</div>'
  +navButtons(!!ONB_DATA.experience, 'Choose the one that fits you best.');
}
function setExp(id){ ONB_DATA.experience=id; render(); }
function onbStep3(){
  /* The light end matters: a 4 or a 6 is what a press or a halo starts on,
     and someone who owns only those had no way to say so. */
  const weights=[4,6,8,10,12,16,20,24,28,32];
  return '<div class="eyebrow">Step 3 of 6</div><h2 style="font-size:26px;margin:8px 0 10px;">What is actually in your gym?</h2>'
  +'<p style="color:var(--text-3);margin-bottom:18px;font-size:13.5px;">Every weight you can reach today. A bell you do not own will never be programmed.</p>'
  +tokenGrid(weights.map(function(w){
      return [w+' kg', 'toggleWeight('+w+')', ONB_DATA.inventory.indexOf(w)>=0];
    }))
  +'<div class="divider"></div>'
  +'<div class="opt-grid rows">'
  +optCard(ONB_DATA.multipleKb,'ONB_DATA.multipleKb=!ONB_DATA.multipleKb;render()',
      'I have two of the same weight','Unlocks double-bell work such as front squats and renegade rows')
  +optCard(ONB_DATA.adjustable,'ONB_DATA.adjustable=!ONB_DATA.adjustable;render()',
      'Adjustable kettlebell','Weight jumps can be smaller than a full bell')
  +optCard(ONB_DATA.otherEquipment,'ONB_DATA.otherEquipment=!ONB_DATA.otherEquipment;render()',
      'Other equipment at home','Bench, bands, bar \u2014 kept for later updates')
  +'</div>'
  +navButtons(ONB_DATA.inventory.length>0, 'Select at least one bell you own.');
}
function toggleWeight(w){ const i=ONB_DATA.inventory.indexOf(w); if(i>=0) ONB_DATA.inventory.splice(i,1); else ONB_DATA.inventory.push(w); render(); }
/* The options here are derived from the programmes, not invented. Offering
   "2 days a week" when the lightest block runs three, or asking for a session
   length to the nearest five minutes when a single programme swings from 35 to
   61, is a promise the app cannot keep. Days come from what the library
   actually schedules; time is a band, because that is the honest resolution. */
function scheduleOptions(){
  const days = [...new Set(PROGRAMS.map(p=>p.daysPerWeek))].sort(function(a,b){return a-b;});
  return {days:days, bands:DUR_BANDS};
}
const DUR_BANDS = [
  {cap:40, label:'30\u201340 min', desc:'Short sessions. The heaviest weeks of a long block will run over.'},
  {cap:50, label:'40\u201350 min', desc:'The length most of the library is written to.'},
  {cap:60, label:'50\u201360 min', desc:'Room for the long strength days and the finishers.'},
  {cap:75, label:'60 min or more', desc:'Nothing gets cut for time.'},
];
function bandFor(cap){
  for(let i=0;i<DUR_BANDS.length;i++) if(cap <= DUR_BANDS[i].cap) return DUR_BANDS[i];
  return DUR_BANDS[DUR_BANDS.length-1];
}
/* How many programmes genuinely fit inside an answer — shown live, so the
   choice is never a guess and the app never claims support it lacks. */
function fittingCount(days, cap){
  return PROGRAMS.filter(function(p){
    return p.daysPerWeek <= days && p.sessionMin && p.sessionMin[1] <= cap;
  }).length;
}
function onbStep4(){
  const opt = scheduleOptions();
  const cap = bandFor(ONB_DATA.duration).cap;
  const fit = fittingCount(ONB_DATA.days, cap);
  return '<div class="eyebrow">Step 4 of 6</div><h2 style="font-size:26px;margin:8px 0 10px;">How often, and for how long?</h2>'
  +'<p style="color:var(--text-3);margin-bottom:18px;font-size:13.5px;">Pick the week you could still be keeping up in three months, not the one you can manage next Monday.</p>'
  +'<div class="field"><label>Training days per week</label>'
  +tokenGrid(opt.days.map(function(d){ return [String(d), 'ONB_DATA.days='+d+';render()', ONB_DATA.days===d]; }))
  +'</div>'
  +'<div class="field"><label>Time you can give a session</label>'
  +'<div class="opt-grid">'+opt.bands.map(function(b){
      return optCard(cap===b.cap, 'ONB_DATA.duration='+b.cap+';render()', b.label, b.desc);
    }).join('')+'</div></div>'
  +'<div class="fit-note">'+fit+' of '+PROGRAMS.length+' programmes fit inside that'
    +(fit<PROGRAMS.length ? ' \u00b7 the rest stay available, just ranked lower' : '')+'.</div>'
  +navButtons(true);
}
function onbStep5(){
  const opts=[
    ['traditional','Straight sets','One movement at a time, full rest between'],
    ['superset','Supersets','Two movements back to back, then rest'],
    ['emom','EMOM','A set at the top of every minute; the rest is what is left'],
    ['amrap','AMRAP','As many rounds as you can before the clock runs out'],
  ];
  const none = ONB_DATA.formats.length===0;
  return '<div class="eyebrow">Step 5 of 6</div><h2 style="font-size:26px;margin:8px 0 10px;">How do you like to train?</h2>'
  +'<p style="color:var(--text-3);margin-bottom:18px;font-size:13.5px;">Optional. It moves matching programmes up the list \u2014 it never hides the rest.</p>'
  +'<div class="opt-grid">'+opts.map(function(o){
      return optCard(ONB_DATA.formats.indexOf(o[0])>=0, "toggleFormat('"+o[0]+"')", o[1], o[2]);
    }).join('')+'</div>'
  +'<div class="divider"></div>'
  +'<div class="opt-grid rows">'
  +optCard(none,'ONB_DATA.formats=[];render()','No strong preference','Every programme is ranked on the rest of your answers')
  +'</div>'
  +navButtons(true);
}
function toggleFormat(id){ const i=ONB_DATA.formats.indexOf(id); if(i>=0) ONB_DATA.formats.splice(i,1); else ONB_DATA.formats.push(id); render(); }
function onbStep6(){
  const invText = ONB_DATA.inventory.length ? ONB_DATA.inventory.slice().sort((a,b)=>a-b).map(w=>w+' kg').join(', ') : 'None selected';
  return '<div class="eyebrow">Your Training Profile</div><h2 style="font-size:26px;margin:8px 0 20px;">Ready to see your programs.</h2>'
  +'<div class="card">'
  +profRow('Goal', ONB_DATA.goals.map(goalLabel).join(' + ')||'\u2014')
  +profRow('Experience', expLabel(ONB_DATA.experience))
  +profRow('Equipment', invText+(ONB_DATA.multipleKb?' \u00b7 matched pair':'')+(ONB_DATA.adjustable?' \u00b7 adjustable':''))
  +profRow('Frequency', ONB_DATA.days+' days / week')
  +profRow('Session', ONB_DATA.duration+' min')
  +profRow('Preferred formats', ONB_DATA.formats.length? ONB_DATA.formats.map(fmtLabel).join(', ') : 'No preference')
  +'</div>'
  +'<button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="finishOnboarding()">See My Programs</button>'

/* ============================= PROGRAM RECOMMENDATION ============================= */
function scorePrograms(){
  const p = STATE.profile;
  const expOrder = {beginner:0,some:0,intermediate:1,advanced:2};
  const levelOrder = {beginner:0,intermediate:1,advanced:2};
  return PROGRAMS.map(prog=>{
    let score=0;
    const overlap = prog.goals.filter(g=>p.goals.includes(g)).length;
    score += overlap*3;
    /* A gap of one level is a stretch; a gap of two is the wrong programme,
       and the old flat penalty let it win whenever nothing else matched the
       goal — an advanced athlete was being handed a beginners' block. */
    const lvGap = Math.abs(levelOrder[prog.level]-(expOrder[p.experience]??0));
    score -= lvGap*3 + (lvGap>=2 ? 4 : 0);
    /* Asymmetric on purpose. A programme that needs more days than you have,
       or sessions longer than you can give, will actually fail you; one that
       asks for less simply leaves time on the table. The old rule compared
       midpoints and punished both ends equally. */
    score -= prog.daysPerWeek > p.days ? (prog.daysPerWeek-p.days)*2
                                       : (p.days-prog.daysPerWeek)*0.5;
    const cap = bandFor(p.duration||50).cap, hi = prog.sessionMin[1];
    score -= hi > cap ? (hi-cap)/5 : (cap-hi)/25;
    // Asking someone how they like to train and then ignoring the answer is
    // worse than not asking. A preference nudges matching programmes up; it
    // never hides the others.
    if(p.formats && p.formats.length){
      const mine = new Set(prog.templates.map(t=>t.format));
      const hits = p.formats.filter(f=>mine.has(f)).length;
      score += hits*1.5;
    }
    // And a programme built on two bells is not a match for one bell, however
    // well its goals line up.
    const gate = missingGearFor(prog);
    if(gate) score -= 12;
    return {prog, score, gate};
  }).sort((a,b)=>b.score-a.score);
}
/* What a programme needs that this person has not got. Derived from the
   exercises themselves, so adding a two-bell movement to a programme is enough
   to make it honest about the requirement. */
function missingGearFor(prog){
  const p = STATE.profile;
  if(p.pairs) return null;
  const ids = new Set();
  prog.templates.forEach(t=>{
    (t.blocks||[]).forEach(b=>ids.add(b.ex));
    (t.pairs||[]).forEach(pr=>pr.forEach(id=>ids.add(id)));
    (t.pattern||[]).forEach(id=>ids.add(id));
    (t.round||[]).forEach(r=>ids.add(r.ex));
  });
  const needPair = [...ids].filter(id=>EX_BY_ID[id] && EX_BY_ID[id].pair);
  if(!needPair.length) return null;
  const names = needPair.slice(0,2).map(id=>EX_BY_ID[id].name);
  return 'Needs two kettlebells of the same weight \u2014 for '
       + names.join(' and ') + (needPair.length>2 ? ' and others' : '');
}

function weeklyVolume(){
  const weekAgo = Date.now()-7*24*3600*1000;

  STATE.history.forEach(h=>{ if(new Date(h.date).getTime()>=weekAgo && h.weight) v += h.weight*h.result; });
  return Math.round(v);
}
function computeStreak(){
  const dates = Array.from(new Set(STATE.history.map(h=>h.date))).sort().reverse();
  if(!dates.length) return 0;
  let streak=1;
  for(let i=0;i<dates.length-1;i++){
    const d1=new Date(dates[i]), d2=new Date(dates[i+1]);
    const diffDays = Math.round((d1-d2)/(24*3600*1000));
    if(diffDays<=3) streak++; else break;
  }
  return streak;
}

/* ============================ PROGRAM BUILDER ============================
   Your own days, your own exercises — run by the same engine as every other
   program. Warm-ups are derived from the movements, the load progresses from
   your history, the week structure climbs and deloads (or stays flat, if you
   say so), and the readiness check and swap work exactly as they do anywhere
   else. Built programs live in your data and travel with the backup; they
   are kept out of the recommendations, which only rank the written library. */
let CUSTOM_IDS = [];
function registerCustomPrograms(){
  CUSTOM_IDS.forEach(function(id){ delete PROG_BY_ID[id]; });
  CUSTOM_IDS = [];
  (STATE.customPrograms||[]).forEach(function(p){
    PROG_BY_ID[p.id] = p; CUSTOM_IDS.push(p.id);
    try{
      let lo = Infinity, hi = 0;
      for(let wk=1; wk<=p.weeks; wk++) p.templates.forEach(function(t,i){
        const w = buildWorkoutInstance(p, wk, i); lo = Math.min(lo, w.totalMin); hi = Math.max(hi, w.totalMin);
      });
      if(isFinite(lo)) p.sessionMin = [lo, hi];
    }catch(e){ console.warn('custom program', p.id, e); }
  });
  if(STATE.selectedProgramId && !PROG_BY_ID[STATE.selectedProgramId]) STATE.selectedProgramId = null;
}

function blankDay(i){ return {name: DAY_NAMES[i]||('Day '+(i+1)), blocks:[]}; }

function bAdd(exId){

function bMove(i, d){

function bRemove(i){ bDay().blocks.splice(i,1); render(); }
function bSets(i, d){ const b = bDay().blocks[i]; b.sets = Math.max(1, Math.min(8, b.sets+d)); render(); }
function bReps(i, lo, hi){ bDay().blocks[i].reps = [lo, hi]; render(); }
function repPresets(ex){
  if(ex.timeBased) return [['Default', ex.secRange], ['Short', [20,30]], ['Medium', [30,45]], ['Long', [45,60]]];
  if(ex.cat==='skill') return [['Default', ex.reps], ['Singles', [1,2]], ['Doubles', [2,3]]];
  if(ex.cat==='power') return [['Default', ex.reps], ['Crisp', [5,10]], ['Volume', [15,20]]];
  return [['Default', ex.reps], ['Strength', [5,8]], ['Muscle', [8,12]], ['Endurance', [12,20]]];
}
/* Minutes are estimated the way the written programs are timed: working time
   by rep or hold, rest by what the set demands, per-side work nearly double. */
function estBlockSec(ex, b){
  const top = b.reps[1];
  const work = ex.timeBased ? top : ex.cat==='power' ? top*2 : ex.cat==='skill' ? top*25 : top*3.2;
  const rest = ex.timeBased ? 45 : ex.cat==='power' ? 75 : ex.cat==='skill' ? 90 : top<=8 ? 90 : top<=12 ? 75 : 60;
  return b.sets*(work+rest)*(isPerSide(ex) ? 1.7 : 1);
}
function estDayMin(t){
  let s = 0;
  t.blocks.forEach(function(b){ const ex = EX_BY_ID[b.ex]; if(ex) s += estBlockSec(ex, b) + 60; });
  return Math.round(s/60);
}

    + '<div class="share-top"><div class="eyebrow">Add to '+esc(bDay().name)+'</div><div class="back-btn" onclick="BUILDER.picking=false;render();">'+ICON.x+'</div></div>'
    + '<input type="search" class="pick-q" placeholder="Search exercises" value="'+esc(BUILDER.pickQ||'')+'" oninput="pickFilter(this.value)">'
    + '<div id="pickList" class="pick-list">'+pickerList()+'</div>'
    + '</div></div>';
}
function saveBuilder(andStart){
  const B = BUILDER;
  const nameEl = document.getElementById('bName'); if(nameEl) B.name = nameEl.value;
  const name = (B.name||'').trim();
  if(!name){ toast('Give the program a name'); if(nameEl) nameEl.focus(); return; }
  const days = B.templates.slice(0, B.daysPerWeek);
  const empty = days.findIndex(function(t){ return !t.blocks.length; });
  if(empty >= 0){ B.dayIdx = empty; render(); toast((days[empty].name||'A day')+' has no exercises yet'); return; }
  const id = B.id || ('custom_'+Date.now().toString(36));
  const level = (STATE.profile && STATE.profile.experience) || 'intermediate';
  const prog = {
    id, custom:true, name: name.toUpperCase(),
    tagline: B.weeks+' Week Custom \u00b7 '+B.daysPerWeek+' days a week',
    weeks: B.weeks, daysPerWeek: B.daysPerWeek, level, goals: [],
    progression: B.progression, minSession: 0,
    desc: 'Your own program. Warm-ups, load progression'+(B.progression==='block'?', the climb and the deload weeks':'')
        + ' are handled the same way as in every written one.',
    templates: days.map(function(t,i){
      return {name: (t.name||DAY_NAMES[i]).trim(), format:'traditional', mainMin: Math.max(10, estDayMin(t)),
              blocks: t.blocks.map(function(b){ return {ex:b.ex, sets:b.sets, reps:b.reps.slice()}; })};
    }),
    createdAt: B.id ? ((STATE.customPrograms||[]).find(function(p){return p.id===id;})||{}).createdAt : todayISO()
  };
  STATE.customPrograms = (STATE.customPrograms||[]).filter(function(p){ return p.id!==id; }).concat([prog]);
  registerCustomPrograms();
  saveState();
  BUILDER = null;
  if(andStart){ selectProgram(id); return; }
  toast(B.id ? 'Program updated' : 'Program saved');
  navigate('program_detail', {id});
}
function deleteCustom(id){
  const p = PROG_BY_ID[id]; if(!p || !p.custom) return;
  if(!confirm('Delete '+p.name+'? Your logged sets stay in your history.')) return;
  STATE.customPrograms = (STATE.customPrograms||[]).filter(function(x){ return x.id!==id; });
  if(STATE.programProgress) delete STATE.programProgress[id];
  if(STATE.selectedProgramId===id) STATE.selectedProgramId = null;
  registerCustomPrograms(); saveState();
  toast('Program deleted');
  navigate('programs');
}

function renderProgramDetail(id){
  const prog = PROG_BY_ID[id]; if(!prog) return '<p>Program not found.</p>';
  const stats = programStats(prog);
  const pos = currentPosition(prog);
  window._pdWeek = window._pdWeek && window._pdWeek.prog===id ? window._pdWeek.week : (pos?pos.week:1);
  const activeWeek = window._pdWeek;
  const weekTabs = Array.from({length:prog.weeks}).map((_,i)=>{
    const w=i+1; const unlocked = isWeekUnlocked(prog,w);
    let g = prog.templates && Array.from({length:prog.daysPerWeek}).map((_,j)=>isWorkoutDone(prog,w,j));
    const allDone = g.every(Boolean);
    const cls = w===activeWeek?'current':(allDone?'done':(unlocked?'':'locked'));
    return '<div class="week-tab '+cls+'" onclick="setPdWeek(\''+id+'\','+w+')">W'+w+'<span class="wk-status">'+(allDone?'Done':unlocked?'':'Locked')+'</span></div>';
  }).join('');
  const dayRows = Array.from({length:prog.daysPerWeek}).map((_,i)=>{
    const done = isWorkoutDone(prog,activeWeek,i);
    const unlocked = isWorkoutUnlocked(prog,activeWeek,i);
    const partial = isWorkoutPartial(prog,activeWeek,i);
    const counted = done && partial;          // stopped short, but far enough in to count
    const w = buildWorkoutInstance(prog, activeWeek, i);
    const statusIcon = done?ICON.check:(unlocked?ICON.play:ICON.lock);
    const statusCls = counted?'partial':(done?'done':(partial?'partial':(unlocked?'available':'')));
    return '<div class="workout-row" '+(unlocked?'style="cursor:pointer;" onclick="previewWorkout(\''+id+'\','+activeWeek+','+i+')"':'')+'>'
    +'<div class="wr-status '+statusCls+'">'+statusIcon+'</div>'
    +'<div class="wr-body"><div class="wr-title '+(unlocked?'':'locked')+'">'+esc(w.name)+'</div>'
      +'<div class="wr-meta '+(unlocked?'':'locked')+'">'+w.totalMin+' min \u00b7 '+fmtLabel(w.format)
        +(w.finisher?' \u00b7 +finisher':'')+' \u00b7 '+esc(w.phaseName)+'</div>'
      +(partial?'<div class="wr-meta" style="color:var(--amber);">'
          +(counted?'Counted':'Started')+' \u2014 '+partial.pct+'% done, '
          +partial.sets+' set'+(partial.sets===1?'':'s')+' kept</div>':'')
      +(done&&!partial?'<div class="wr-meta" style="color:var(--green);">Completed \u00b7 tap to run it again</div>':'')
      +'</div>'
    +(unlocked?'<span class="row-chev">'+ICON.chevron+'</span>':'')
    +'</div>';
  }).join('');
  const isActive = STATE.selectedProgramId===id;
  return '<div class="top-row"><div class="back-btn" onclick="navigate(\'programs\')">'+ICON.back+'</div><h2>'+esc(prog.name)+'</h2></div>'
  +'<p style="color:var(--text-2);font-size:14px;margin-bottom:16px;">'+esc(prog.desc)+'</p>'
  +(prog.custom ? '<div style="display:flex;gap:9px;margin:-4px 0 16px;"><button class="btn btn-ghost btn-sm" style="flex:1;" onclick="openBuilder(\''+id+'\')">Edit</button>'
     +'<button class="btn btn-ghost btn-sm" style="flex:1;color:var(--red);" onclick="deleteCustom(\''+id+'\')">Delete</button></div>' : '')
  +(!isActive?'<button class="btn btn-primary btn-block" style="margin-bottom:20px;" onclick="selectProgram(\''+id+'\')">Make This My Program</button>':
    '<div class="card card-tight" style="margin-bottom:20px;"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-3);font-weight:700;margin-bottom:8px;"><span>WEEK '+ (pos?pos.week:prog.weeks)+(pos?' \u2014 CURRENT':' \u2014 COMPLETE')+'</span><span>'+stats.pct+'%</span></div>'
    +'<div class="progress-track"><div class="progress-fill" style="width:'+stats.pct+'%;"></div></div>'
    +'<div style="margin-top:6px;font-size:12.5px;color:var(--text-3);">'+stats.done+' / '+stats.total+' workouts completed</div></div>')

/* ============================= EXERCISES ============================= */
let EX_FILTER = {equipment:'all', difficulty:'all', q:''};
/* The library as currently filtered: the list screen shows it, and the
   exercise page's Previous / Next steps through it in the same order. */
function libraryList(){
  return EXERCISES.filter(e=>{
    if(EX_FILTER.equipment!=='all' && !e.equipment.includes(EX_FILTER.equipment)) return false;
    if(EX_FILTER.difficulty!=='all' && e.difficulty!==EX_FILTER.difficulty) return false;
    if(EX_FILTER.q && !e.name.toLowerCase().includes(EX_FILTER.q.toLowerCase())) return false;
    return true;
  });
}
/* Step to the neighbouring exercise without growing the back stack, so Back
   still returns to the list however many exercises were paged through. */
function exStep(d){
  const list = libraryList(), i = list.findIndex(e=>e.id===ROUTE.params.id);
  if(i<0 || !list.length) return;
  const n = list[(i + d + list.length) % list.length];
  ROUTE = {name:'exercise_detail', params:{id:n.id, lib:1}};
  window.scrollTo(0,0); render();
}
function exPager(id){
  if(!ROUTE.params.lib) return '';
  const list = libraryList(), i = list.findIndex(e=>e.id===id);
  if(i<0 || list.length<2) return '';
  const prev = list[(i-1+list.length)%list.length], next = list[(i+1)%list.length];
  return '<div class="ex-pager">'
    + '<button class="ex-pg" onclick="exStep(-1)" aria-label="Previous exercise">'+ICON.back+'<span>'+esc(prev.name)+'</span></button>'
    + '<div class="ex-pg-n">'+(i+1)+' / '+list.length+'</div>'
    + '<button class="ex-pg nx" onclick="exStep(1)" aria-label="Next exercise"><span>'+esc(next.name)+'</span>'+ICON.back+'</button>'
    + '</div>';
}
function renderExercisesList(){
  const filtered = libraryList();
  return '<h1 style="font-size:28px;margin-bottom:16px;">Exercise Library</h1>'
  +'<div class="field"><input type="text" id="exSearchInput" placeholder="Search exercises" value="'+esc(EX_FILTER.q)+'" oninput="filterExercises(this.value)"></div>'
