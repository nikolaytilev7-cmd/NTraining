<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NT Training — Kettlebell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0A0E13;
  --bg-1:#121822;
  --bg-2:#19212C;
  --bg-3:#212B37;
  --border:#263140;
  --border-soft:#1B2330;
  --text-1:#F2F5F8;
  --text-2:#9FACBA;
  --text-3:#616D7A;
  --blue:#4C7EFF;
  --blue-2:#3563DB;
  --blue-dim:#1E3260;
  --blue-glow:rgba(76,126,255,0.16);
  --accent-rgb:76,126,255;
  --bg-rgb:10,14,19;
  --on-accent:#FFFFFF;
  --grad:linear-gradient(180deg,#5B89FF,#4C7EFF);
  --grad-x:linear-gradient(90deg,#3563DB,#4C7EFF);
  --grad-text:#F2F5F8;
  --hero-bg:linear-gradient(160deg,var(--bg-2),var(--bg-1));
  --red:#E6555A;
  --orange:#EE9A4C;
  --yellow:#E8C548;
  --green:#33C48D;
  --amber:#F0B429;
  --radius-l:22px;
  --radius-m:15px;
  --radius-s:9px;
  --font-d:'Barlow Condensed','Oswald','Arial Narrow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Manrope',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:var(--safe-t);background:var(--bg);color:var(--text-1);}
/* Some viewers — the iOS Files preview among them — repaint html and body with
   their own light ground and win, and the app's near-white headings vanish.
   So the page paints its own ground: a fixed layer IN FRONT of the body's
   background (a negative z-index would sit behind it and lose the same way),
   with the app itself stacked above that. */

/* ------------------------------ COLOUR THEMES ------------------------------
   The whole app is drawn from these tokens, so a theme is a set of values and
   nothing else. Night is the original; Berry and Energy add a gradient accent. */
html[data-theme="berry"]{
  --bg:#120C22;--bg-1:#1C1433;--bg-2:#251B42;--bg-3:#2E2350;--border:#3A2D62;--border-soft:#281E47;
  --text-2:#B3A8CC;--text-3:#7A6E96;
  --blue:#A278FF;--blue-2:#7C4DEB;--blue-dim:#3A2670;--blue-glow:rgba(162,120,255,0.18);
  --accent-rgb:162,120,255;--bg-rgb:18,12,34;--on-accent:#FFFFFF;
  --green:#22D3EE;
  --grad:linear-gradient(120deg,#9B6BFF,#EC4899);
  --grad-x:linear-gradient(90deg,#9B6BFF,#EC4899);
  --grad-text:linear-gradient(120deg,#B794FF,#F472B6);
  --hero-bg:linear-gradient(135deg,rgba(155,107,255,.38),rgba(236,72,153,.30)),var(--bg-1);
}
html[data-theme="energy"]{
  --bg:#0B0F09;--bg-1:#141A10;--bg-2:#1B2316;--bg-3:#232E1D;--border:#2E3B27;--border-soft:#1F281A;
  --text-2:#A9B69C;--text-3:#6F7C63;
  --blue:#B8F33D;--blue-2:#8FD12A;--blue-dim:#34471A;--blue-glow:rgba(184,243,61,0.14);
  --accent-rgb:184,243,61;--bg-rgb:11,15,9;--on-accent:#0B0F09;
  --green:#2EE6A6;--amber:#FFB020;
  --grad:linear-gradient(120deg,#B8F33D,#2EE6A6);
  --grad-x:linear-gradient(90deg,#8FD12A,#2EE6A6);
  --grad-text:linear-gradient(120deg,#C6F75A,#2EE6A6);
  --hero-bg:linear-gradient(135deg,rgba(184,243,61,.22),rgba(46,230,166,.16)),var(--bg-1);
}
html[data-theme="berry"] .fh-num,html[data-theme="energy"] .fh-num{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;}
html[data-theme="berry"] .fh-eb,html[data-theme="energy"] .fh-eb{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.tp-card{position:relative;border:2px solid rgba(255,255,255,.08);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s;}
.tp-card.on{border-color:#fff;transform:translateY(-2px);}
.tp-card:active{transform:scale(.97);}
.tp-img{width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;}
.tp-img img{width:100%;height:100%;object-fit:cover;display:block;}
.tp-num{font-family:var(--font-d);font-size:24px;font-weight:800;line-height:1;margin-top:2px;}
.tp-btn{width:100%;border-radius:8px;font-size:11px;font-weight:800;padding:6px 0;}
.tp-name{font-size:13.5px;font-weight:800;color:#fff;}
.tp-desc{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.6);line-height:1.2;}
.tp-tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:#fff;color:#111;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.theme-btn{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);padding:4px;background:var(--bg-2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.theme-btn i{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(#4C7EFF 0 33%,#A278FF 0 50%,#EC4899 0 66%,#B8F33D 0 83%,#2EE6A6 0);}
.theme-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0 12px;}
.theme-seg button{background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);border-radius:10px;padding:9px 4px;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
.theme-seg button i{width:34px;height:10px;border-radius:5px;display:block;}
.theme-seg button.on{border-color:var(--blue);color:var(--text-1);box-shadow:0 0 0 1px var(--blue) inset;}
#bgLayer{position:fixed;inset:0;z-index:0;background:var(--bg);pointer-events:none;}
#app{position:relative;z-index:1;color:var(--text-1);}
/* Headings inherited their colour from body. A viewer that repaints body's
   colour therefore repainted every heading with it — which is how the title
   ended up invisible. Say it here instead of inheriting it. */
#app h1,#app h2,#app h3,#app h4{color:var(--text-1);}
/* Same defence for body text, at the lowest specificity that still does it
   (0,0,1): it beats nothing but bare type selectors. Written as "#app span"
   it outranked every class in the app, so .wr-meta, .next-up-eye, .delta and
   the rest were quietly drawn in the parent's colour instead of their own. */
:where(#app) p,:where(#app) label,:where(#app) span,:where(#app) div{color:inherit;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text-1);
  font-family:var(--font-b);
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:700;margin:0;letter-spacing:0.2px;}
p{margin:0;}
button{font-family:var(--font-b);cursor:pointer;}
input,select,textarea{font-family:var(--font-b);}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:8px;}

.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--bg-1);border-right:1px solid var(--border-soft);
  padding:28px 18px;display:none;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.sidebar-brand{white-space:nowrap;font-family:var(--font-d);font-size:24px;font-weight:800;color:var(--text-1);padding:0 10px 26px;letter-spacing:0.5px;}
.sidebar-brand span{color:var(--blue);}
.brand-cat{font-family:system-ui,-apple-system,sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);margin-top:3px;}
.brand-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.brand-word{font-family:var(--font-d);font-size:17px;font-weight:800;letter-spacing:.06em;color:var(--text-1);}
.brand-word span{color:var(--blue);}
.brand-tag{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);
  padding:3px 8px;border-radius:99px;border:1px solid var(--border);background:var(--bg-2);}
@media (min-width:900px){ .brand-bar{display:none;} }
.side-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-s);color:var(--text-2);font-weight:600;font-size:15px;}
.side-link svg{width:19px;height:19px;flex-shrink:0;}
.side-link.active{background:var(--blue-glow);color:var(--text-1);}
.side-link:hover{color:var(--text-1);}

.main-col{flex:1;min-width:0;display:flex;justify-content:center;}
.main-inner{width:100%;max-width:560px;padding:20px 18px 100px;}
@media (min-width:900px){
  .sidebar{display:flex;}
  .main-inner{padding:36px 32px 60px;max-width:640px;}
  .bottom-nav{display:none !important;}
}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(var(--bg-rgb),0.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--border-soft);
  display:flex;justify-content:space-around;align-items:center;
  padding:9px 6px calc(9px + var(--safe-b));
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-3);font-size:11px;font-weight:600;flex:1;padding:4px;}
.tab svg{width:22px;height:22px;}
.tab.active{color:var(--blue);}

.card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:var(--radius-l);padding:20px;}
.card + .card{margin-top:14px;}
.card-tight{padding:16px;border-radius:var(--radius-m);}
.section{margin-bottom:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:14px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:1.1px;}
.eyebrow{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1.3px;}

.btn{border:none;border-radius:var(--radius-m);padding:15px 22px;font-weight:700;font-size:15px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;white-space:nowrap;
  transition:transform .08s ease, background .15s ease, box-shadow .15s ease, opacity .15s ease;}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

/* Icons are injected as raw <svg> with no intrinsic size, so every element that
   hosts one has to constrain it — otherwise it stretches to fill its box and
   swallows the label. One rule here beats a wrapper at each call site. */
.btn svg,.btn-icon svg,.back-btn svg,.wr-status svg,.chip svg,.badge svg,.diff-opt svg{
  width:18px;height:18px;flex-shrink:0;display:block;}
.btn-block svg{width:19px;height:19px;}
.btn-sm svg{width:15px;height:15px;}
.wr-status svg{width:17px;height:17px;}
.btn:active{transform:scale(0.97);}
.btn-block{width:100%;padding:17px 22px;font-size:15.5px;}
.btn-primary{background:var(--grad);color:var(--on-accent);
  box-shadow:0 6px 18px -8px rgba(var(--accent-rgb),0.9), inset 0 1px 0 rgba(255,255,255,0.18);}
.btn-primary:hover{background:linear-gradient(180deg,var(--blue),var(--blue-2));}
.btn-primary:active{box-shadow:0 2px 8px -6px rgba(var(--accent-rgb),0.9);}
.btn-secondary{background:var(--bg-3);color:var(--text-1);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text-1);border-color:var(--text-3);}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(230,85,90,0.4);}
.btn-sm{padding:10px 15px;font-size:13px;border-radius:var(--radius-s);gap:7px;}
.btn-sm.btn-block{padding:12px 15px;font-size:13.5px;}
.btn[disabled]{opacity:0.35;pointer-events:none;}
.btn-icon{width:38px;height:38px;padding:0;border-radius:50%;background:var(--bg-3);color:var(--text-1);border:1px solid var(--border);flex-shrink:0;}

.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:99px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);font-weight:600;font-size:14px;}
.chip.selected{background:var(--blue-dim);border-color:var(--blue);color:#FFFFFF;
  box-shadow:inset 0 0 0 1px var(--blue);}
.chip-row{display:flex;flex-wrap:wrap;gap:9px;}

.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
.badge-beginner{background:rgba(51,196,141,0.15);color:var(--green);}
.badge-intermediate{background:rgba(240,180,41,0.15);color:var(--amber);}
.badge-advanced{background:rgba(230,85,90,0.15);color:var(--red);}
.badge-neutral{background:var(--bg-3);color:var(--text-2);}
.badge-blue{background:var(--blue-glow);color:var(--blue);}

.ex-pager{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.ex-pg{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:var(--radius-s);background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);font-size:12.5px;font-weight:700;cursor:pointer;}
.ex-pg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ex-pg svg{width:16px;height:16px;flex-shrink:0;color:var(--blue);}
.ex-pg.nx{justify-content:flex-end;text-align:right;}
.ex-pg.nx svg{transform:scaleX(-1);}
.ex-pg:active{background:var(--bg-3);}
.ex-pg-n{font-size:11.5px;font-weight:800;color:var(--text-3);flex-shrink:0;min-width:44px;text-align:center;}
.top-row{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.back-btn{width:36px;height:36px;border-radius:50%;background:var(--bg-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-1);flex-shrink:0;}
.top-row h2{font-size:24px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.stat-tile{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-m);padding:16px;}
.stat-tile .num{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1;color:var(--text-1);}
.stat-tile .lbl{font-size:12.5px;color:var(--text-3);margin-top:6px;font-weight:600;}

.progress-track{height:8px;background:var(--bg-3);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--grad-x);border-radius:99px;transition:width .3s ease;}

.seg-track{display:flex;gap:5px;}
.seg{flex:1;height:7px;border-radius:99px;background:var(--bg-3);}
.seg.done{background:var(--grad-x);}
.seg.current{background:var(--blue-dim);border:1.5px solid var(--blue);}

.week-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.week-tab{flex-shrink:0;padding:10px 16px;border-radius:var(--radius-s);background:var(--bg-2);border:1px solid var(--border-soft);font-weight:700;font-family:var(--font-d);font-size:16px;color:var(--text-3);min-width:76px;text-align:center;}
.week-tab .wk-status{font-size:10px;font-family:var(--font-b);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block;margin-top:2px;}
.week-tab.current{background:var(--blue-glow);border-color:var(--blue);color:var(--text-1);}
.week-tab.done{color:var(--green);}
.week-tab.locked{color:var(--text-3);opacity:0.55;}

.workout-row{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--border-soft);}
.workout-row:last-child{border-bottom:none;}
.wr-status{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg-3);color:var(--text-3);}
.wr-status.done{background:rgba(51,196,141,0.15);color:var(--green);}
.wr-status.available{background:var(--blue-glow);color:var(--blue);}
.wr-status.partial{background:rgba(240,180,41,0.16);color:var(--amber);}
.wr-body{flex:1;min-width:0;}
.wr-title{font-weight:700;font-size:15.5px;}
.wr-meta{font-size:13px;color:var(--text-3);margin-top:2px;}
.wr-title.locked, .wr-meta.locked{color:var(--text-3);}

.ex-icon{width:52px;height:52px;border-radius:var(--radius-s);background:var(--bg-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-icon .ex-thumb{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;}
.ex-icon:has(.ex-thumb){overflow:hidden;background:#14161A;}
.ex-icon svg{width:30px;height:30px;color:var(--blue);}
.ex-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border-soft);}
.ex-row:last-child{border-bottom:none;}
.ex-row-body{flex:1;min-width:0;}
.ex-row-title{font-weight:700;font-size:15.5px;}
.ex-row-meta{font-size:12.5px;color:var(--text-3);margin-top:3px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text-2);margin-bottom:8px;}
.field input[type=text], .field input[type=number], .field select{
  width:100%;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-s);
  padding:13px 14px;color:var(--text-1);font-size:15px;
}
.field input:focus, .field select:focus{outline:none;border-color:var(--blue);}

.num-stepper{display:flex;align-items:center;gap:14px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-s);padding:6px;}
.num-stepper button{width:40px;height:40px;border-radius:var(--radius-s);background:var(--bg-3);color:var(--text-1);border:none;font-size:20px;font-weight:700;}
.num-stepper .val{flex:1;text-align:center;font-family:var(--font-d);font-size:22px;font-weight:700;}

.rest-ring{position:relative;width:min(62vw,236px);aspect-ratio:1;margin:14px auto 6px;}
.rest-ring svg{width:100%;height:100%;display:block;}
.rr-track{fill:none;stroke:var(--bg-3,#1c2533);stroke-width:9;}
.rr-fill{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .95s linear,stroke .3s;}
.rr-fill.rr-hot{stroke:var(--amber);}
.rest-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-size:clamp(40px,12.5vw,52px);font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;}
.rest-why{color:var(--text-3);margin:8px 0 16px;max-width:300px;font-size:13.5px;}
.rest-btns{display:flex;gap:10px;align-items:center;margin-top:18px;}
.next-up{width:100%;max-width:360px;text-align:left;padding:12px 14px;border-radius:var(--radius-m);
  background:var(--bg-2);border:1px solid var(--border-soft);}
.next-up-eye{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;}
.next-up-row{display:flex;align-items:center;gap:11px;}
.next-up-body{flex:1;min-width:0;}
.next-up-name{font-size:15.5px;font-weight:800;color:var(--text-1);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.next-up-meta{font-size:12.5px;color:var(--text-3);margin-top:2px;}
.next-up-load{text-align:right;flex:0 0 auto;}
.next-up-t{font-size:13px;font-weight:700;color:var(--text-2);}
.next-up-w{font-size:16px;font-weight:800;color:var(--text-1);margin-top:1px;}
/* ---- progress: lifts, charts, calendar, weekly review ---- */
.lifts-card{padding:4px 14px;}
.lift-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.lift-row:last-child{border-bottom:0;}
.lift-row > .ico{color:var(--text-3);}
.lift-body{flex:1;min-width:0;}
.lift-body .wr-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lift-val{text-align:right;flex:0 0 auto;min-width:62px;}
.lift-num{font-size:16px;font-weight:800;color:var(--text-1);font-variant-numeric:tabular-nums;}
.lift-num small,.ep-num small{font-size:.6em;font-weight:700;color:var(--text-3);}
.pr-dot{display:inline-flex;width:14px;height:14px;color:var(--amber);vertical-align:-2px;}

.sp-line{fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;}
.sp-dot{fill:var(--blue);}
.delta{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:99px;margin-top:3px;font-variant-numeric:tabular-nums;}
.delta.up{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);}
.delta.down{color:var(--text-2);background:var(--bg-3);}
.delta.flat{color:var(--text-3);background:var(--bg-3);}
.ep-hero{padding:20px;margin-bottom:22px;}
.ep-num{font-family:var(--font-d);font-size:44px;font-weight:700;line-height:1.05;margin:6px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ep-num .delta{font-family:system-ui,-apple-system,sans-serif;font-size:13px;align-self:center;}
.ep-story{color:var(--text-2);font-size:14px;line-height:1.5;}
.ch-wrap{position:relative;}
.ch-svg{width:100%;height:auto;display:block;overflow:visible;}
.ch-grid{stroke:var(--border-soft);stroke-width:1;}
.ch-base{stroke:var(--border);stroke-width:1;}
.ch-ytick{fill:var(--text-3);font-size:10px;text-anchor:end;dominant-baseline:middle;font-variant-numeric:tabular-nums;}
.ch-xtick{fill:var(--text-3);font-size:10px;}
.ch-line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.ch-area{fill:var(--blue);opacity:.10;}
.ch-dot{fill:var(--blue);stroke:var(--bg-1);stroke-width:2;}
.ch-dot.last{r:5;}
.ch-dot.flag{fill:var(--amber);}
.ch-lab{fill:var(--text-1);font-size:11.5px;font-weight:800;}
.ch-hit{fill:transparent;cursor:pointer;}
.ch-tip{display:none;position:absolute;transform:translate(-50%,calc(-100% - 12px));pointer-events:none;
  background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:6px 9px;white-space:nowrap;
  font-size:12px;color:var(--text-2);box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:3;}
.ch-tip.below{transform:translate(-50%,12px);}
.ch-tip b{display:block;color:var(--text-1);font-size:13px;}
.ch-note{font-size:12px;color:var(--text-3);line-height:1.5;margin-top:10px;}
.ep-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.ep-table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);text-align:left;font-weight:700;padding:6px 4px;border-bottom:1px solid var(--border-soft);}
.ep-table td{padding:9px 4px;border-bottom:1px solid var(--border-soft);color:var(--text-2);}
.ep-table tr:last-child td{border-bottom:0;}
.ep-table .n{text-align:right;font-variant-numeric:tabular-nums;}
.pain-mark{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--amber);color:#111;font-size:10px;font-weight:900;}
.cal-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
.cal-big{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1;}
.cal-big small{font-size:14px;color:var(--text-3);font-weight:700;}
.cal-sub{font-size:12px;color:var(--text-3);font-weight:600;margin-top:4px;}
.cal-grid{display:grid;gap:3px;align-items:center;}
.cal-m{font-size:10px;color:var(--text-3);white-space:nowrap;overflow:visible;height:13px;line-height:13px;}
.cal-rl{font-size:9.5px;color:var(--text-3);text-align:left;}
.cal-c{display:block;aspect-ratio:1;border-radius:3px;background:var(--bg-3);}
.cal-c.l1{background:color-mix(in srgb,var(--blue) 38%,var(--bg-3));}
.cal-c.l2{background:color-mix(in srgb,var(--blue) 68%,var(--bg-3));}
.cal-c.l3{background:var(--blue);}
.cal-c.fut{background:transparent;border:1px dashed var(--border-soft);}
.cal-c.today{outline:2px solid var(--text-1);outline-offset:1px;}
.cal-key{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--text-3);margin-top:10px;}
.cal-key .cal-c{width:11px;height:11px;}
.wk-card{margin-bottom:22px;}
.wk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.wk-range{font-size:13px;color:var(--text-3);font-weight:600;margin-top:3px;}
.wk-empty{color:var(--text-3);font-size:14px;margin-top:12px;}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px;}
.wk-stats div{background:var(--bg-2);border-radius:var(--radius-s);padding:10px;}
.wk-stats b{display:block;font-family:var(--font-d);font-size:22px;font-weight:700;line-height:1.1;}
.wk-stats b small{font-size:12px;color:var(--text-3);font-weight:700;}
.wk-stats span{display:block;font-size:11px;color:var(--text-3);font-weight:600;margin-top:3px;line-height:1.3;}
.wk-line{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text-2);padding:8px 0 0;line-height:1.45;}
.wk-line .ico{flex:0 0 auto;width:18px;height:18px;margin-top:1px;color:var(--text-3);}
.wk-line .ico svg{width:18px;height:18px;}
.wk-line.up .ico{color:var(--green);}
.wk-line.pr .ico{color:var(--amber);}
.wk-line.warn .ico{color:var(--amber);}
.wk-line b{color:var(--text-1);}
.wk-next{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);}
.wk-next-t{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--blue);text-transform:uppercase;}
.wk-next-b{font-size:13.5px;color:var(--text-2);margin-top:5px;line-height:1.5;}
.share-cta{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;}
.share-cta svg{width:18px;height:18px;}
.share-overlay{position:fixed;inset:0;background:rgba(var(--bg-rgb),0.9);backdrop-filter:blur(6px);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:16px;}
.share-sheet{width:100%;max-width:400px;max-height:100%;display:flex;flex-direction:column;gap:12px;}
.share-top{display:flex;align-items:center;justify-content:space-between;}
.share-frame{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;}
.share-img{max-width:100%;max-height:62vh;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.5);display:block;
  -webkit-touch-callout:default;}
.share-wait{height:50vh;aspect-ratio:9/16;border-radius:16px;background:var(--bg-2);display:flex;align-items:center;
  justify-content:center;color:var(--text-3);font-size:13px;}
.share-btns{display:flex;gap:10px;}
.share-btns .btn{flex:1;}
.share-hint{font-size:12px;color:var(--text-3);text-align:center;}
.ready-lede{color:var(--text-3);font-size:13.5px;line-height:1.5;margin-bottom:6px;}
.ready-q{margin-top:14px;}
.ready-l{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:7px;}
.ready-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ready-o{padding:12px 6px;border-radius:var(--radius-s);background:var(--bg-2);border:1px solid var(--border);
  color:var(--text-2);font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;}
.ready-o.on{background:var(--blue-glow);border-color:var(--blue);color:var(--text-1);}
.ready-verdict{margin-top:16px;padding:12px 14px;border-radius:var(--radius-s);background:var(--bg-2);border-left:3px solid var(--green);}
.ready-verdict.mid{border-left-color:var(--blue);}
.ready-verdict.low{border-left-color:var(--amber);}
.ready-verdict b{display:block;font-size:14px;color:var(--text-1);margin-bottom:3px;}
.ready-verdict span{font-size:13px;color:var(--text-2);line-height:1.5;}
.ready-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;}
.link-btn{background:none;border:0;color:var(--text-3);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;font-family:inherit;padding:6px 0;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.swap-sheet{width:100%;max-width:420px;background:var(--bg-1);border:1px solid var(--border);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:8px;}
.swap-opt{cursor:pointer;}
.swap-opt > .ico{color:var(--text-3);}
.pref-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
.pref-row:last-child{border-bottom:0;}
.switch{flex:0 0 auto;width:48px;height:28px;border-radius:99px;background:var(--bg-3);border:1px solid var(--border);position:relative;cursor:pointer;padding:0;}
.switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text-3);transition:left .18s,background .18s;}
.switch.on{background:var(--blue);border-color:var(--blue);}
.switch.on span{left:23px;background:#fff;}
.build-cta{display:flex;align-items:center;gap:12px;cursor:pointer;border:1px dashed var(--blue);background:var(--blue-glow);}
.build-cta > .ico{color:var(--text-3);}
.b-lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:14px 0 8px;}
.b-note{font-size:12.5px;color:var(--text-3);line-height:1.5;margin-top:10px;}
.bchips{display:flex;flex-wrap:wrap;gap:7px;}
.bchip{padding:8px 13px;border-radius:99px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);
  font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;}
.bchip.on{background:var(--blue-glow);border-color:var(--blue);color:var(--text-1);}
.bchips.sm .bchip{padding:6px 10px;font-size:12.5px;}
.bchip small{font-weight:600;color:var(--text-3);margin-left:3px;}
.bchip.on small{color:var(--text-2);}
.day-tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0 12px;padding-bottom:2px;}
.day-tab{flex:0 0 auto;min-width:92px;text-align:left;padding:10px 12px;border-radius:var(--radius-s);background:var(--bg-1);
  border:1px solid var(--border);color:var(--text-1);font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;}
.day-tab span{display:block;font-size:11.5px;font-weight:600;color:var(--text-3);margin-top:2px;}
.day-tab.on{border-color:var(--blue);background:var(--blue-glow);}
.b-block{padding:12px 0;border-bottom:1px solid var(--border-soft);}
.b-head{display:flex;align-items:center;gap:10px;}
.b-ico{width:32px;height:32px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);
  font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;}
.b-ico svg{width:15px;height:15px;}
.b-ico[disabled]{opacity:.3;pointer-events:none;}
.b-ico.del{color:var(--red);}
.b-row{display:flex;align-items:center;gap:10px;margin:10px 0 8px;}
.b-k{font-size:12.5px;font-weight:700;color:var(--text-3);}
.mini-step{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.mini-step button{width:34px;height:32px;background:var(--bg-2);border:0;color:var(--text-1);font-size:17px;font-weight:700;cursor:pointer;}
.mini-step b{min-width:30px;text-align:center;font-size:15px;}
.pick-sheet{max-height:86vh;}
.pick-q{width:100%;padding:11px 13px;border-radius:10px;background:var(--bg-2);border:1px solid var(--border);color:var(--text-1);font-size:15px;font-family:inherit;}
.pick-list{overflow-y:auto;flex:1 1 auto;min-height:0;margin:0 -4px;padding:0 4px;}
.pick-cat{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin:14px 0 4px;}
.pick-row{cursor:pointer;}
.pick-row.used{opacity:.55;}
.voice-hint{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px;padding:13px 14px;
  border-radius:var(--radius-m);background:var(--blue-glow);border:1px solid var(--blue);}
.voice-hint-ico{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--blue);color:#fff;}
.voice-hint-ico svg{width:18px;height:18px;}
.voice-hint-t{font-size:14px;font-weight:800;color:var(--text-1);}
.voice-hint-b{font-size:12.5px;color:var(--text-2);line-height:1.45;margin-top:3px;}
.timer-big{font-family:var(--font-d);font-size:68px;font-weight:700;text-align:center;line-height:1;letter-spacing:1px;}
.timer-sub{text-align:center;color:var(--text-3);font-weight:600;font-size:13px;margin-top:6px;text-transform:uppercase;letter-spacing:0.8px;}

.muscle-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);font-weight:600;}
.muscle-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.divider{height:1px;background:var(--border-soft);margin:18px 0;}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-3);}
.empty-state h3{color:var(--text-2);margin-bottom:8px;}

.onb-progress{display:flex;gap:6px;margin-bottom:26px;}
.onb-progress span{flex:1;height:4px;border-radius:99px;background:var(--bg-3);}
.onb-progress span.on{background:var(--blue);}

.program-hero{border-radius:var(--radius-l);padding:22px;border:1px solid var(--border-soft);position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bg-2),var(--bg-1));}
.program-hero .glow{position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,var(--blue-glow),transparent 70%);}

.rest-overlay{position:fixed;inset:0;background:rgba(var(--bg-rgb),0.94);backdrop-filter:blur(6px);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}

.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--bg-3);border:1px solid var(--border);color:var(--text-1);padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,0.4);}

.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.diff-opt{padding:13px 10px;border-radius:var(--radius-s);background:var(--bg-2);border:1.5px solid var(--border);text-align:center;font-weight:700;font-size:14px;color:var(--text-2);}
.diff-opt.selected{border-color:var(--blue);background:var(--blue-glow);color:var(--text-1);}

.fig-wrap{width:100%;max-width:230px;margin:0 auto;background:var(--bg-2);border-radius:var(--radius-m);padding:10px 0 4px;}
.fig-wrap canvas{width:100%;height:auto;display:block;}
.fig-wrap.has-photo{background:#14161A;padding:0;overflow:hidden;max-width:300px;}
.fig-wrap.fig-compact.has-photo{max-width:100%;background:transparent;}
.fig-compact .photo-stack{max-width:320px;margin:0 auto;border-radius:12px;overflow:hidden;}
.photo-stack.slow img{transition:opacity .6s ease;}
.set-strip .st, .tech-strip figure{cursor:pointer;}
.tech-strip figure.on{outline:2px solid var(--blue);outline-offset:-2px;}
.frame-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0 12px;}
.frame-seg button{background:var(--bg-2);border:1px solid var(--border);color:var(--text-2);border-radius:10px;padding:9px 4px;font-weight:700;font-size:13px;line-height:1.2;cursor:pointer;}
.frame-seg button small{display:block;font-weight:600;font-size:10.5px;opacity:.75;margin-top:2px;}
.frame-seg button.on{background:var(--blue);border-color:var(--blue);color:var(--on-accent);}
.focus-hero{position:relative;margin:0 -18px;}
@media (min-width:900px){.focus-hero{margin:0;}}
.focus-hero .fig-wrap{max-width:none;width:100%;height:min(50vh,520px);min-height:280px;margin:0;padding:0;border-radius:0 0 22px 22px;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
@media (min-width:900px){.focus-hero .fig-wrap{border-radius:22px;}}
.focus-hero .fig-wrap canvas{height:100%;width:auto;}
.focus-hero .photo-stack{aspect-ratio:auto !important;height:100%;max-width:none;border-radius:0;}
.focus-hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(to bottom,rgba(var(--bg-rgb),0) 48%,rgba(var(--bg-rgb),.55) 72%,var(--bg) 100%);}
.fh-txt{position:absolute;left:18px;right:18px;bottom:12px;z-index:2;pointer-events:none;}
.fh-eb{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#C3CDDB;text-transform:uppercase;}
.fh-eb .fh-side{color:#8FB0FF;}
.fh-title{font-size:30px;font-weight:800;line-height:1.1;margin:3px 0 8px;letter-spacing:-.01em;color:#fff;}
.fh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fh-cap{background:rgba(8,10,14,.72);backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;max-width:72%;}
.fh-cap:empty{display:none;}
.fh-dots{display:flex;gap:5px;}
.fh-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);}
.fh-dots i.on{background:#fff;}
.focus-big{display:flex;align-items:flex-end;justify-content:center;gap:20px;margin:14px 0 6px;}
.focus-big > div{text-align:center;}
.focus-big .n{font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--text-1);}
.focus-big .n.sm{font-size:30px;}
.focus-big .u{font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--text-3);margin-top:5px;text-transform:uppercase;}
.focus-big .sep{width:1px;align-self:stretch;background:var(--border);}
.focus-why{text-align:center;font-size:12.5px;color:var(--text-2);line-height:1.45;margin:0 0 10px;}
.focus-body .rir-line{justify-content:center;}
.focus-links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;margin:6px 0 4px;}
.focus-links button{background:none;border:0;color:var(--text-2);font-weight:700;font-size:13.5px;padding:8px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.focus-links button svg{width:15px;height:15px;}
.focus-dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 18px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 68%,rgba(var(--bg-rgb),0));}
.focus-dock .btn{display:flex;width:100%;max-width:524px;margin:0 auto;height:56px;font-size:17px;box-shadow:0 8px 24px rgba(var(--accent-rgb),.35);}
.fsheet-wrap{position:fixed;inset:0;z-index:88;background:rgba(var(--bg-rgb),.6);display:flex;align-items:flex-end;justify-content:center;animation:fsFade .2s ease;}
.fsheet{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:var(--bg-1);border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:12px;animation:fsUp .24s ease;}
.fsheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 2px;flex-shrink:0;}
.fsheet h3{font-size:19px;margin:0;}
.fsheet .field{margin:0;}
.fs-steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fs-steps .field label{text-align:center;}
.fs-steps #weightHint{display:none;}
.fs-steps .num-stepper .val{font-size:26px;}
.fsheet .tech-strip figure{cursor:pointer;}
.fsheet .chip-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.fsheet .chip-row::-webkit-scrollbar{display:none;}
.fsheet .chip{flex-shrink:0;}
@keyframes fsUp{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
@keyframes fsFade{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion: reduce){.fsheet,.fsheet-wrap{animation:none;}}
.set-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px;}
.set-strip .st{position:relative;border-radius:8px;overflow:hidden;border:2px solid transparent;opacity:.5;transition:opacity .2s,border-color .2s;}
.set-strip .st.on{border-color:var(--blue);opacity:1;}
.set-strip img{width:100%;aspect-ratio:480/540;object-fit:cover;display:block;}
.set-strip.mirrored img{transform:scaleX(-1);}
.set-strip .n{position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.set-strip .st.on .n{background:var(--blue);}
.set-strip .l{font-size:9.5px;font-weight:700;color:var(--text-2);text-align:center;padding:3px 0 4px;background:#14161A;}
.tech-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.tech-strip figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:#14161A;}
.tech-strip img{width:100%;aspect-ratio:480/540;object-fit:cover;display:block;}
.tech-strip .tn{position:absolute;left:5px;top:5px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.tech-strip figcaption{font-size:10.5px;font-weight:700;color:var(--text-2);text-align:center;padding:6px 2px 7px;line-height:1.2;}
.fig-wrap.has-photo canvas{display:none;}
.photo-stack{position:relative;width:100%;aspect-ratio:480/540;}
.photo-stack.mirrored{transform:scaleX(-1);}
.photo-stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .22s ease;}
.photo-stack img.on{opacity:1;}
.photo-tag{position:absolute;left:8px;bottom:7px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);border-radius:6px;padding:2px 6px;}
.photo-stack.mirrored .photo-tag{transform:scaleX(-1);}
.fig-wrap.fig-compact{max-width:168px;padding:8px 0 3px;margin-bottom:2px;}
.fig-caption{text-align:center;font-size:11px;color:var(--text-2);font-weight:700;letter-spacing:0.2px;margin:-2px 0 10px;min-height:15px;line-height:1.3;}
.mus-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px;min-height:44px;align-content:flex-start;}
.mus{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:9px;padding:6px 9px 7px;min-width:96px;}
.mus-nm{font-size:10.5px;font-weight:700;color:var(--text-2);display:flex;justify-content:space-between;gap:8px;}
.mus-nm i{font-style:normal;color:var(--text-3);font-variant-numeric:tabular-nums;}
.mus-row.mus-compact{min-height:0;margin-bottom:8px;}
.mus-row.mus-compact .mus{min-width:74px;padding:4px 7px 5px;}
.mus-row.mus-compact .mus-nm{font-size:9.5px;}
.mod-strip{display:flex;gap:6px;margin:0 0 16px;}
.mod{flex:1;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:8px 6px;text-align:center;}
.mod b{display:block;font-size:11.5px;font-weight:700;color:var(--text-3);}
.mod span{display:block;font-size:10px;color:var(--text-3);margin-top:2px;}
.mod.current{background:var(--blue-glow);border-color:var(--blue);}
.mod.current b{color:var(--text-1);}
.mod.done b{color:var(--green);}
.peek-wrap{position:fixed;inset:0;background:rgba(var(--bg-rgb),0.9);backdrop-filter:blur(6px);z-index:85;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:22px 14px 40px;}
.peek-card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;width:100%;max-width:440px;}
.tap-row{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
.tap-row:last-of-type{border-bottom:none;}
.tech{margin-top:12px;text-align:left;}
.tech-zones{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.zone{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--bg-3);color:var(--text-2);}
.zone-primary{background:rgba(226,64,70,0.16);color:var(--red);}
.tech-h{font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;font-weight:700;color:var(--green);margin:10px 0 4px;}
.tech-h-bad{color:var(--orange);}
.tech-list{margin:0;padding-left:17px;color:var(--text-2);font-size:12.5px;line-height:1.6;}
.tech-list li{margin-bottom:2px;}
.tech-bad li::marker{color:var(--orange);}
.why-box{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--radius-s);padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:var(--text-2);line-height:1.55;text-align:left;}
.why-box b{display:block;color:var(--text-3);font-size:10.5px;text-transform:uppercase;letter-spacing:0.7px;margin-bottom:4px;}
.row-chev,.ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-3);}
.row-chev svg,.ico svg{width:18px;height:18px;display:block;}
.ico-lg svg{width:23px;height:23px;}
.ico-accent{color:var(--blue);}
/* safety net: a raw icon dropped into any of these rows still gets a size */
.card>svg,.workout-row>svg,.ex-row>svg,.top-row>svg,.section>svg{width:18px;height:18px;flex-shrink:0;}
.anim-controls{display:flex;align-items:center;gap:10px;margin-top:14px;text-align:left;}
.phase-chip-row{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.phase-chip{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:99px;background:var(--bg-3);color:var(--text-3);cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.phase-chip.current{background:var(--blue-glow);color:var(--text-1);border-color:var(--blue);}
/* Weekly volume. The columns and the axis labels are two flex rows sharing the
   same gap, so every label sits under its own bar — the previous version styled
   the labels as a child of the chart while the markup made them a sibling, so
   the rule never applied and the eight weeks ran together as one word. */
.vol-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;}
.vol-cap .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:700;}
.vol-cap .v{font-size:14px;font-weight:700;color:var(--text-1);font-variant-numeric:tabular-nums;white-space:nowrap;}
.vol-plot{position:relative;height:96px;}
.vol-peak{position:absolute;left:0;right:0;top:26%;border-top:1px dashed var(--border);} /* 100% − the 74% bar cap */
/* on the left: the right-hand end is where the labelled bar sits */
.vol-peak b{position:absolute;left:0;top:-15px;font-size:9.5px;font-weight:700;color:var(--text-3);
  background:var(--bg-1);padding:0 4px 0 0;font-variant-numeric:tabular-nums;}
.vol-base{position:absolute;left:0;right:0;bottom:0;border-top:1px solid var(--border-soft);}
.vol-cols{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:6px;}
/* capped so a first-ever week reads as a bar, not a filled panel */
.vol-col{flex:1 1 0;min-width:0;max-width:62px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;}
.vol-bar{background:var(--blue-dim);border-radius:4px 4px 0 0;}
.vol-bar.hi{background:var(--blue);}
.vol-bar.zero{height:3px;background:var(--bg-3);border-radius:2px;}
.vol-val{font-size:10px;font-weight:700;color:var(--text-2);text-align:center;margin-bottom:4px;
  white-space:nowrap;font-variant-numeric:tabular-nums;}
.vol-axis{display:flex;justify-content:center;gap:6px;margin-top:8px;}
.vol-axis span{flex:1 1 0;min-width:0;max-width:62px;text-align:center;font-size:10px;font-weight:600;color:var(--text-3);
  font-variant-numeric:tabular-nums;}
.vol-axis span.now{color:var(--text-2);}
.vol-note{margin-top:10px;font-size:12px;color:var(--text-3);}
/* The ladder of a for-time piece, drawn as the rungs themselves. */
.rung-row{display:flex;flex-wrap:wrap;gap:6px;}
.rung{flex:0 0 auto;min-width:34px;text-align:center;padding:6px 8px;border-radius:var(--radius-s);
  background:var(--bg-2);color:var(--text-3);font-size:13px;font-weight:700;border:1px solid transparent;
  font-variant-numeric:tabular-nums;}
.rung.done{background:var(--bg-3);color:var(--text-3);text-decoration:line-through;}
.rung.now{background:var(--blue);color:var(--on-accent);border-color:var(--blue);}
.cap-warn{color:var(--amber);}
.badge-special{background:var(--blue-dim);border:1px solid var(--blue);color:#FFFFFF;}
.week-note{margin:0 0 16px;padding:12px 14px;border-radius:var(--radius-m);
  background:var(--bg-2);border-left:3px solid var(--blue);}
.week-note-t{font-size:13px;font-weight:800;color:var(--text-1);margin-bottom:4px;}
.week-note-b{font-size:13px;color:var(--text-2);line-height:1.5;}
.rir-line{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:9px 12px;
  border-radius:var(--radius-s);background:var(--bg-2);border:1px solid var(--border-soft);
  font-size:12.5px;color:var(--text-2);line-height:1.4;}
.rir-n{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;
  border-radius:99px;background:var(--blue-dim);color:#FFFFFF;border:1px solid var(--blue);
  font-variant-numeric:tabular-nums;}
.flag-chip{font-size:13px;}
.flag-chip.flagged{background:color-mix(in srgb,var(--amber) 22%,transparent);
  border-color:var(--amber);color:var(--text-1);}
/* The one badge on the screen that is a recommendation rather than a label,
   so it gets the only piece of neon in the palette. */
.badge-best{background:linear-gradient(95deg,#00E5A0,#19D3FF);color:#04221C;
  border:0;font-weight:800;letter-spacing:.04em;
  box-shadow:0 0 0 1px rgba(25,211,255,.45), 0 0 18px rgba(0,229,160,.38);}
/* ---- Onboarding: option cards, token grids, pinned actions ---- */
.onb-body{padding-bottom:132px;}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt-grid.rows{grid-template-columns:1fr;}
@media (max-width:380px){ .opt-grid{grid-template-columns:1fr;} }
.opt{position:relative;text-align:left;padding:14px 40px 13px 14px;border-radius:var(--radius-m);
  background:var(--bg-2);border:1px solid var(--border);cursor:pointer;
  transition:border-color .12s, background .12s;}
.opt:hover{border-color:var(--text-3);}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.opt .t{font-weight:700;font-size:14.5px;color:var(--text-1);line-height:1.25;}
.opt .d{margin-top:5px;font-size:12px;color:var(--text-3);line-height:1.38;}
.opt.sel{background:var(--blue-dim);border-color:var(--blue);}
.opt.sel .d{color:var(--text-2);}
.opt .tick{position:absolute;top:12px;right:12px;width:19px;height:19px;border-radius:99px;
  border:1.5px solid var(--border);background:transparent;}
.opt.sel .tick{background:var(--blue);border-color:var(--blue);
  display:grid;place-items:center;}
.opt .tick svg{display:none;width:11px;height:11px;}
.opt.sel .tick svg{display:block;}
.tok-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;}
.tok{text-align:center;padding:12px 6px;border-radius:var(--radius-s);background:var(--bg-2);
  border:1px solid var(--border);font-weight:700;font-size:14.5px;color:var(--text-2);cursor:pointer;
  font-variant-numeric:tabular-nums;transition:border-color .12s, background .12s;}
.tok:hover{border-color:var(--text-3);}
.tok.sel{background:var(--blue-dim);border-color:var(--blue);color:#FFFFFF;}
.onb-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(to top, var(--bg) 58%, rgba(var(--bg-rgb),0));
  padding:18px 18px calc(16px + env(safe-area-inset-bottom, 0px));}
.onb-nav .row{display:flex;gap:10px;max-width:520px;margin:0 auto;}
.onb-hint{max-width:520px;margin:0 auto 9px;font-size:12.5px;color:var(--text-3);text-align:center;}
.save-alert{margin-bottom:10px;border-color:var(--red);
  background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--text-1);
  font-size:13px;line-height:1.5;font-weight:600;}
.fit-note{margin-top:14px;padding:11px 13px;border-radius:var(--radius-s);background:var(--bg-2);
  border:1px solid var(--border-soft);font-size:12.5px;color:var(--text-2);line-height:1.45;}
</style>
