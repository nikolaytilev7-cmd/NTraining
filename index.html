/* --------------------------------- CHARTS ---------------------------------
   Plain inline SVG — one series, so no legend: the section title names it.
   Time runs on a real date axis, so a two-week gap looks like two weeks.
   Every point can be tapped for its exact value; only the latest is labelled. */
window._charts = window._charts || {};
function niceStep(range){
  const raw = range/3, mag = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const n = raw/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
}
function lineChart(id, pts, fmt, unit){
  const W=340, H=178, L=38, R=16, T=18, B=26;
  if(!pts.length) return '';
  let lo = Math.min.apply(null, pts.map(function(p){return p.y;}));
  let hi = Math.max.apply(null, pts.map(function(p){return p.y;}));
  if(hi===lo){ const pad = Math.max(1, Math.abs(hi)*0.1); lo -= pad; hi += pad; }
  const step = niceStep(hi-lo);
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  if(lo < 0 && Math.min.apply(null, pts.map(function(p){return p.y;})) >= 0) lo = 0;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  const X = function(t){ return t1===t0 ? (L+W-R)/2 : L + (t-t0)/(t1-t0)*(W-L-R); };
  const Y = function(v){ return T + (1-(v-lo)/(hi-lo))*(H-T-B); };
  let g = '';
  for(let v=lo; v<=hi+1e-9; v+=step){
    const y = Y(v).toFixed(1);
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="ch-grid"/>'
       + '<text x="'+(L-7)+'" y="'+y+'" class="ch-ytick">'+esc(Math.abs(v)>=1000 ? Math.round(v).toLocaleString('en-US') : String(Math.round(v*10)/10))+'</text>';
  }
  const xy = pts.map(function(p){ return [X(p.t), Y(p.y)]; });
  const path = xy.map(function(q,i){ return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1); }).join(' ');
  const area = path + ' L'+xy[xy.length-1][0].toFixed(1)+' '+(H-B)+' L'+xy[0][0].toFixed(1)+' '+(H-B)+' Z';
  const lastI = pts.length-1;
  const dots = xy.map(function(q,i){
    return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4" class="ch-dot'+(i===lastI?' last':'')+(pts[i].flag?' flag':'')+'"/>';
  }).join('');
  const hits = xy.map(function(q,i){
    return '<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="15" class="ch-hit" onclick="chartTip(\''+id+'\','+i+')" onmouseenter="chartTip(\''+id+'\','+i+')"/>';
  }).join('');
  const lx = xy[lastI][0], ly = xy[lastI][1];
  const lab = '<text x="'+Math.min(W-R, lx).toFixed(1)+'" y="'+(ly-10).toFixed(1)+'" class="ch-lab" text-anchor="'+(pts.length>1?'end':'middle')+'">'+esc(fmt(pts[lastI].y))+' '+esc(unit)+'</text>';
  const xl = '<text x="'+L+'" y="'+(H-7)+'" class="ch-xtick" text-anchor="start">'+esc(fmtDay(pts[0].iso))+'</text>'
    + (pts.length>1 ? '<text x="'+(W-R)+'" y="'+(H-7)+'" class="ch-xtick" text-anchor="end">'+esc(fmtDay(pts[lastI].iso))+'</text>' : '');
  window._charts[id] = pts.map(function(p,i){ return {x:xy[i][0]/W*100, y:xy[i][1]/H*100, tip:p.tip}; });
  return '<div class="ch-wrap" id="ch_'+id+'" onmouseleave="chartTip(\''+id+'\',-1)">'
    + '<svg viewBox="0 0 '+W+' '+H+'" class="ch-svg" role="img" aria-label="'+esc(unit)+' over time">'
    + g + '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" class="ch-base"/>'
    + (pts.length>1 ? '<path d="'+area+'" class="ch-area"/><path d="'+path+'" class="ch-line"/>' : '')
    + dots + lab + xl + hits + '</svg><div class="ch-tip" id="tip_'+id+'"></div></div>';
}
function chartTip(id, i){
  const el = document.getElementById('tip_'+id); if(!el) return;
  const p = (window._charts[id]||[])[i];
  if(!p){ el.style.display='none'; return; }
  el.innerHTML = p.tip;
  el.style.display = 'block';
  el.style.left = Math.max(14, Math.min(86, p.x))+'%';
  el.style.top  = p.y+'%';
  el.classList.toggle('below', p.y < 34);
}
function sparkline(vals){
  if(vals.length < 2) return '<svg viewBox="0 0 64 24" class="spark"><circle cx="58" cy="12" r="2.6" class="sp-dot"/></svg>';
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), r = (hi-lo)||1;
  const pts = vals.map(function(v,i){ return [2 + i/(vals.length-1)*56, 21 - (v-lo)/r*18]; });
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 64 24" class="spark" aria-hidden="true"><polyline points="'
    + pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+'" class="sp-line"/>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" class="sp-dot"/></svg>';
}

/* ------------------------------ YOUR LIFTS ------------------------------ */
function liftsList(){
  const lastSeen = {};
  STATE.history.forEach(function(h){ if(countedEntry(h) && EX_BY_ID[h.exerciseId] && h.date && (!lastSeen[h.exerciseId] || h.date > lastSeen[h.exerciseId])) lastSeen[h.exerciseId] = h.date; });
  const ids = Object.keys(lastSeen).sort(function(a,b){ return lastSeen[b].localeCompare(lastSeen[a]); });
  if(!ids.length) return '<div class="empty-state">Log a few sets and every lift gets its own line here.</div>';
  return ids.map(function(id){
    const t = exerciseTrend(id); if(!t) return '';
    const recentPR = STATE.history.some(function(h){ return h.exerciseId===id && h.isPR && h.date===t.last.date; });
    return '<div class="lift-row" onclick="navigate(\'exercise_progress\',{id:\''+id+'\'})">'
      + '<div class="lift-body"><div class="wr-title">'+esc(t.ex.name)+(recentPR?' <span class="pr-dot" title="Record last session">'+ICON.trophy+'</span>':'')+'</div>'
      + '<div class="wr-meta">'+t.sessions.length+' session'+(t.sessions.length===1?'':'s')+' · last '+esc(fmtDay(t.last.date))+'</div></div>'
      + sparkline(t.sessions.slice(-10).map(function(s){return s.value;}))
      + '<div class="lift-val"><div class="lift-num">'+esc(fmtKindValue(t.kind, t.last.value))+'<small> '+esc(kindUnit(t.kind))+'</small></div>'
      + (t.sessions.length>1 ? deltaChip(t.pct) : '<span class="delta flat">new</span>')+'</div>'
      + ico(ICON.chevron)+'</div>';
  }).join('');
}
function renderExerciseProgress(id){

      + '<td class="n">'+(s.volume ? esc(Math.round(s.volume).toLocaleString('en-US')) : '\u2014')+'</td></tr>';

  return head
    + '<div class="card ep-hero">'
    +   '<div class="eyebrow">'+esc(meta.title)+'</div>'
    +   '<div class="ep-num">'+esc(fmtKindValue(t.kind, t.last.value))+'<small> '+esc(unit)+'</small>'
    +   (t.sessions.length>1 ? ' '+deltaChip(t.pct) : '')+'</div>'
    +   '<p class="ep-story">'+esc(trendStory(t))+'</p>'
    + '</div>'
    + '<div class="section"><div class="section-title">'+esc(/per session$/.test(meta.title) ? meta.title : meta.title+' by session')+'</div><div class="card">'
    +   (pts.length>1 ? lineChart('ex_'+id, pts, function(v){ return fmtKindValue(t.kind, v); }, unit)
                      : '<div class="empty-state">One session so far. The line starts with the second.</div>')
    +   '<p class="ch-note">'+esc(meta.blurb)+(t.sessions.some(function(s){return s.pain;})?' Amber points are sessions where you flagged pain.':'')+'</p>'
    + '</div></div>'
    + '<div class="section"><div class="section-title">Sessions</div><div class="card card-tight">'
    +   '<table class="ep-table"><thead><tr><th>Date</th><th>Best set</th><th class="n">Sets</th><th class="n">Volume</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +   (t.sessions.length>12 ? '<p class="ch-note">Latest 12 of '+t.sessions.length+' sessions.</p>' : '')
    + '</div></div>'
    + '<button class="btn btn-ghost btn-block" onclick="navigate(\'exercise_detail\',{id:\''+id+'\'})">How it’s done</button>';
}

/* --------------------------- CONSISTENCY CALENDAR ---------------------------
   Sixteen weeks, Monday on top. Shade is how much you did that day, in three
   steps of one hue, so a glance says both "did I train" and "how hard". */
function dayCounts(){
  const c = {}, names = {};
  STATE.history.forEach(function(h){ if(h.date){ c[h.date]=(c[h.date]||0)+1; names[h.date]=h.workoutName||'Session'; } });
  return {c, names};
}
function mondayOf(iso){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function addDays(d, n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function weekStreak(){
  const dc = dayCounts().c;
  const trained = function(mon){ for(let i=0;i<7;i++) if(dc[isoLocal(addDays(mon,i))]) return true; return false; };
  let mon = mondayOf(todayISO()), n = 0;
  if(!trained(mon)) mon = addDays(mon, -7);          // this week is not over yet
  while(trained(mon) && n < 520){ n++; mon = addDays(mon, -7); }
  return n;
}
function consistencyCalendar(){
  const WEEKS = 16, dc = dayCounts(), today = todayISO();
  const start = addDays(mondayOf(today), -(WEEKS-1)*7);
  let months = '', cells = '';
  const monOf = function(w){ return addDays(start, w*7).getMonth(); };
  for(let w=0; w<WEEKS; w++){
    const m = monOf(w);
    const show = w===0 ? (monOf(1)===m && monOf(2)===m) : m!==monOf(w-1);   // no two labels touching
    months += '<span>'+(show ? MON_ABBR[m] : '')+'</span>';
  }
  const rowLbl = ['M','','W','','F','',''];
  for(let r=0; r<7; r++){
    cells += '<span class="cal-rl">'+rowLbl[r]+'</span>';
    for(let w=0; w<WEEKS; w++){
      const d = addDays(start, w*7+r), iso = isoLocal(d);
      if(iso > today){ cells += '<span class="cal-c fut"></span>'; continue; }
      const n = dc.c[iso]||0, lv = n===0?0 : n<=5?1 : n<=12?2 : 3;
      const tip = fmtDay(iso)+(n ? ' · '+n+' set'+(n===1?'':'s')+' · '+dc.names[iso] : ' · rest');
      cells += '<span class="cal-c l'+lv+(iso===today?' today':'')+'" title="'+esc(tip)+'" onclick="toast(this.title)"></span>';
    }
  }
  const since = isoLocal(addDays(new Date(today+'T00:00:00'), -29));
  const sessions30 = new Set(STATE.history.filter(function(h){ return h.date>=since; }).map(function(h){ return h.date+'|'+h.workoutName; })).size;
  const st = weekStreak();
  return '<div class="cal-head"><div><div class="cal-big">'+st+'<small> week'+(st===1?'':'s')+'</small></div><div class="cal-sub">training streak</div></div>'
    + '<div style="text-align:right;"><div class="cal-big">'+sessions30+'</div><div class="cal-sub">sessions · 30 days</div></div></div>'
    + '<div class="cal-grid" style="grid-template-columns:14px repeat('+WEEKS+',1fr);">'
    + '<span></span>'+months.replace(/<span>/g,'<span class="cal-m">')+cells+'</div>'
    + '<div class="cal-key">Less <span class="cal-c l0"></span><span class="cal-c l1"></span><span class="cal-c l2"></span><span class="cal-c l3"></span> More</div>';
}

/* ------------------------------- WEEKLY REVIEW -------------------------------
   What a coach would say on Sunday: did you turn up, what moved, what hurt,
   and what the next week is for. Built only from what is in the log. */
function weekBounds(offset){
  const mon = addDays(mondayOf(todayISO()), offset*7);
  return {from: isoLocal(mon), to: isoLocal(addDays(mon,6))};
}
function weekReview(offset){
  const b = weekBounds(offset), pb = weekBounds(offset-1);
  /* the current week is only partly done, so it is compared with the same
     days of the week before — Monday to today — not with a whole week */
  if(offset===0) pb.to = isoLocal(addDays(new Date(pb.from+'T00:00:00'), (new Date().getDay()+6)%7));
  const inB = function(h, r){ return h.date>=r.from && h.date<=r.to; };
  const hs = STATE.history.filter(function(h){ return inB(h,b); });
  const ph = STATE.history.filter(function(h){ return inB(h,pb); });
  const vol = function(list){ return list.reduce(function(s,h){ return s + (h.weight||0)*(h.result||0); }, 0); };
  const sessions = new Set(hs.map(function(h){ return h.date+'|'+h.workoutName; })).size;
  const moved = [];
  const seen = {};
  hs.forEach(function(h){
    if(!h.weight || seen[h.exerciseId] || !countedEntry(h)) return;
    seen[h.exerciseId] = 1;
    const thisMax = Math.max.apply(null, hs.filter(function(x){ return x.exerciseId===h.exerciseId && countedEntry(x); }).map(function(x){ return x.weight||0; }));
    const before = STATE.history.filter(function(x){ return x.exerciseId===h.exerciseId && x.date < b.from && countedEntry(x); });
    const prevMax = before.length ? Math.max.apply(null, before.map(function(x){ return x.weight||0; })) : 0;
    if(prevMax && thisMax > prevMax) moved.push({ex:EX_BY_ID[h.exerciseId], from:prevMax, to:thisMax});
  });
  const pain = [];
  hs.forEach(function(h){ const e = EX_BY_ID[h.exerciseId]; if(h.pain && e && pain.indexOf(e.name)<0) pain.push(e.name); });
  const prog = STATE.selectedProgramId ? PROG_BY_ID[STATE.selectedProgramId] : null;
  let next = null;
  if(prog){
    const pos = currentPosition(prog);
    if(pos){
      const ph2 = weekPhase(prog, pos.week);
      const sp = SPECIAL_WEEKS[ph2.name];
      next = {week:pos.week, of:prog.weeks, phase:ph2.name, note: sp ? sp.body : (ph2.note||'')};
    }
  }
  return {b, sessions, planned: prog ? prog.daysPerWeek : null, sets: hs.length,
          vol: vol(hs), prevVol: vol(ph), moved, prs: hs.filter(function(h){ return h.isPR; }).length,
          pain, next, offset};
}
function weekReviewCard(offset, compact){
  const r = weekReview(offset);
  const title = offset===0 ? 'This week' : offset===-1 ? 'Last week' : 'Week of '+fmtDay(r.b.from);
  const range = fmtDay(r.b.from)+' – '+fmtDay(r.b.to);
  const u = STATE.profile.units||'kg';
  const volPct = r.prevVol>0 ? Math.round((r.vol-r.prevVol)/r.prevVol*100) : null;
  let html = '<div class="card wk-card">'
    + '<div class="wk-top"><div><div class="eyebrow">'+esc(title)+'</div><div class="wk-range">'+esc(range)+'</div></div>'
    + (compact ? '<button class="btn btn-ghost btn-sm" onclick="navigate(\'progress\')">Details</button>' : '')+'</div>';
  if(!r.sessions){
    html += '<p class="wk-empty">'+(offset===0 ? 'Nothing logged yet this week.' : 'No sessions that week.')+'</p>';
  } else {
    html += '<div class="wk-stats">'
      + '<div><b>'+r.sessions+(r.planned?'<small>/'+r.planned+'</small>':'')+'</b><span>sessions</span></div>'
      + '<div><b>'+r.sets+'</b><span>sets</span></div>'
      + '<div><b>'+fmtVol(r.vol)+'<small> '+esc(u)+'</small></b><span>'+(volPct==null?'volume':(volPct>=0?'+':'')+volPct+'% vs last week')+'</span></div>'
      + '</div>';
    const lines = [];
    r.moved.slice(0, compact?2:6).forEach(function(m){
      lines.push('<div class="wk-line up">'+ico(ICON.arrowUp)+'<span><b>'+esc(m.ex.name)+'</b> moved up — '+m.from+' → '+m.to+' '+esc(u)+'</span></div>');
    });
    if(r.prs) lines.push('<div class="wk-line pr">'+ico(ICON.trophy)+'<span>'+r.prs+' new record'+(r.prs===1?'':'s')+'</span></div>');
    if(r.pain.length) lines.push('<div class="wk-line warn">'+ico(ICON.alert)+'<span>Pain flagged on <b>'+esc(r.pain.join(', '))+'</b> — the load has already backed off there.</span></div>');
    if(r.planned && r.sessions < r.planned && offset<0) lines.push('<div class="wk-line">'+ico(ICON.calendar)+'<span>'+(r.planned-r.sessions)+' session'+(r.planned-r.sessions===1?'':'s')+' short of the plan. The next week still opens after one miss.</span></div>');
    html += lines.join('');
  }
  if(r.next && !compact){
    html += '<div class="wk-next"><div class="wk-next-t">Up next · Week '+r.next.week+' of '+r.next.of+' · '+esc(r.next.phase)+'</div>'
      + (r.next.note ? '<div class="wk-next-b">'+esc(r.next.note)+'</div>' : '')+'</div>';
  }
  return html + '</div>';
}

/* ============================= PROFILE ============================= */
function renderProfile(){

  +'<div class="card">'

  +'</div></div>'

  + (SAVE_FAILED ? '<div class="card card-tight save-alert">'+esc(SAVE_FAILED)+'</div>' : '')
  + '<div class="card">'
  + '<p style="margin:0 0 4px;font-size:13.5px;color:var(--text-2);line-height:1.5;">'
    + (STATE.history||[]).length + ' sets logged'
    + (lastSavedAt() ? ' \u00b7 last saved '+esc(lastSavedAt().slice(0,16).replace('T',' ')) : '')
    + '.</p>'
  + '<p style="margin:0 0 14px;font-size:12.5px;color:var(--text-3);line-height:1.5;">'
    + 'All of it lives in this browser only. Safari clears storage for sites it has not seen in a while, '
    + 'so keep a copy somewhere you control.</p>'
  + '<button class="btn btn-primary btn-block" onclick="exportData()">Export backup file</button>'
  + '<button class="btn btn-secondary btn-block" style="margin-top:9px;" onclick="copyBackup()">Copy backup as text</button>'

  + '<input type="file" id="restoreFile" accept="application/json,.json" style="display:none;" onchange="onBackupFile(this)">'
  + '<p style="margin:12px 0 0;font-size:12px;color:var(--text-3);line-height:1.5;">'

  + '</div></div>'
  +'<button class="btn btn-danger btn-block" style="margin-top:20px;" onclick="resetAllData()">Reset All Data</button>'

    +'font-variant-numeric:tabular-nums;">Build '+BUILD
    +(('serviceWorker' in navigator) && navigator.serviceWorker.controller ? ' \u00b7 offline ready' : '')
    +' \u00b7 '+(Object.keys(PHOTO_SETS).length ? Object.keys(PHOTO_SETS).length+' photo sets' : 'photos.js not loaded')

function updateProfileField(field,val){ STATE.profile[field]=val; saveState(); if(field==='units') render(); }
function toggleInventory(w){
  const inv = STATE.profile.inventory; const i=inv.indexOf(w);
  if(i>=0) inv.splice(i,1); else { inv.push(w); inv.sort((a,b)=>a-b); }
  saveState(); render();
}
function resetAllData(){
  if(confirm('This will erase your profile, program progress and workout history. Continue?')){
    STATE = defaultState(); ONB_DATA=null; ONB_STEP=0; registerCustomPrograms(); saveState(); navigate('onboarding');
  }
}

/* ============================= INIT ============================= */
/* The session length a programme advertises is measured, never typed. A
   hand-written range goes stale the moment the programming changes, and a
   programme that promises 45 minutes and delivers 60 has lied to the person
   deciding whether they have time to train today. */
function deriveSessionLengths(){
  PROGRAMS.forEach(p=>{
    let lo=Infinity, hi=0;
    for(let wk=1; wk<=p.weeks; wk++) p.templates.forEach((t,i)=>{
      const w = buildWorkoutInstance(p, wk, i);
      lo = Math.min(lo, w.totalMin); hi = Math.max(hi, w.totalMin);
    });
    if(isFinite(lo)) p.sessionMin = [lo, hi];
  });
}
/* Registered only on a real origin: a file:// page or an in-app preview has no
   service worker, and asking for one there throws. Failure is silent by design
   — the app works perfectly well online without it. */
function registerWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){
      console.warn('Offline support unavailable', e);
    });
  });
}
function boot(){
  registerWorker();
  deriveSessionLengths();
  loadState();
  render();
}
boot();
